name: SuperMemory Specs

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install pinned application dependencies
        run: npm ci --ignore-scripts

      - name: Verify secret hygiene
        run: node scripts/verify-secret-hygiene.mjs

      - name: Verify CI regression suite
        run: node scripts/verify-ci-regression-suite.mjs

      - name: Verify SuperMemory specs
        run: node scripts/verify-supermemory-specs.mjs

      - name: Verify release readiness
        run: node scripts/verify-supermemory-release-readiness.mjs

      - name: Check whitespace
        run: git diff --check
