name: SuperMemory Specs

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify CI regression suite
        run: node scripts/verify-ci-regression-suite.mjs

      - name: Verify SuperMemory specs
        run: node scripts/verify-supermemory-specs.mjs

      - name: Check whitespace
        run: git diff --check
