services:
  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight@sha256:6364c3c5f1e551447976d6c3ab369040d0237c0980f10f911d76d981290913b6}
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "${SUPERMEMORY_SERVER_BIND:-127.0.0.1}:8888:8888"
      - "${SUPERMEMORY_SERVER_BIND:-127.0.0.1}:9999:9999"
    environment:
      CODEX_HOME: "/var/lib/supermemory-codex"
      HINDSIGHT_API_LLM_PROVIDER: "openai-codex"
      HINDSIGHT_API_LLM_MODEL: "gpt-5.6-luna"
      HINDSIGHT_API_LLM_REASONING_EFFORT: "high"
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "true"
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "false"
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "true"
      HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
      HINDSIGHT_API_AUDIT_LOG_RETENTION_DAYS: "30"
      HINDSIGHT_API_WORKER_ID: "supermemory-portainer"
    volumes:
      - hindsight_database_v090:/home/hindsight/.pg0
      - hindsight_cache_v090:/home/hindsight/.cache
      - ${SUPERMEMORY_CODEX_AUTH_DIR:-/opt/supermemory/codex-auth}:/var/lib/supermemory-codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 120s
    mem_limit: "${HINDSIGHT_MEMORY_LIMIT:-3g}"
    cpus: "${HINDSIGHT_CPUS:-1.0}"
    pids_limit: 512
    stop_grace_period: 60s
    networks: [supermemory_ai]
    security_opt: [no-new-privileges:true]
    logging: &default_logging
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26.28}
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-1g}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2g}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1g}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_bolt_advertised__address: "neo4j:7687"
      NEO4J_dbms_security_auth__minimum__password__length: "16"
    secrets: [neo4j_auth]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(cut -d/ -f2- /run/secrets/neo4j_auth)\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
    mem_limit: "${NEO4J_MEMORY_LIMIT:-5g}"
    cpus: "${NEO4J_CPUS:-2.0}"
    pids_limit: 512
    stop_grace_period: 90s
    networks: [supermemory_graph]
    security_opt: [no-new-privileges:true]
    logging: *default_logging

  neo4j-migrate:
    image: ${GRAPHD_IMAGE:-supermemory-graphd:2.0.0}
    build:
      context: ../..
      dockerfile: services/supermemory-graphd/Dockerfile
    pull_policy: build
    restart: "no"
    command: ["node", "server.mjs", "--migrate"]
    environment: &graphd_environment
      NEO4J_HTTP_URL: "http://neo4j:7474"
      GRAPHD_TOKEN_FILE: /run/secrets/graphd_token
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
    secrets: [graphd_token, neo4j_auth]
    group_add: ["7474"]
    depends_on:
      neo4j: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    pids_limit: 64
    networks: [supermemory_graph]
    security_opt: [no-new-privileges:true]
    logging: *default_logging

  supermemory-graphd:
    image: ${GRAPHD_IMAGE:-supermemory-graphd:2.0.0}
    build:
      context: ../..
      dockerfile: services/supermemory-graphd/Dockerfile
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${SUPERMEMORY_SERVER_BIND:-127.0.0.1}:${GRAPHD_PORT:-8787}:8080"
    environment: *graphd_environment
    secrets: [graphd_token, neo4j_auth]
    group_add: ["7474"]
    depends_on:
      neo4j-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s
    mem_limit: "${GRAPHD_MEMORY_LIMIT:-512m}"
    cpus: "${GRAPHD_CPUS:-0.5}"
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    stop_grace_period: 30s
    networks: [supermemory_graph, supermemory_ai]
    security_opt: [no-new-privileges:true]
    logging: *default_logging

  supermemory-daemon:
    image: ${SUPERMEMORY_RUNTIME_IMAGE:-supermemory-runtime:4.0.0}
    build:
      context: ../..
      dockerfile: deploy/runtime/Dockerfile
      args:
        CODEX_CLI_VERSION: "${CODEX_CLI_VERSION:-0.146.1}"
    pull_policy: build
    restart: unless-stopped
    network_mode: host
    environment:
      CODEX_HOME: "/var/lib/supermemory-codex"
    command:
      - node
      - scripts/supermemoryd.mjs
      - --host
      - 127.0.0.1
      - --port
      - "8765"
      - --vault-root
      - /data/vault
      - --runtime-root
      - /data/runtime
      - --key-file
      - /run/supermemory/archive.key
      - --token-file
      - /run/supermemory/daemon.token
      - --runtime-contract
      - /run/supermemory/runtime-contract.json
      - --workspace-id
      - "${SUPERMEMORY_WORKSPACE_ID}"
      - --project-id
      - "${SUPERMEMORY_PROJECT_ID}"
      - --hindsight-url
      - http://127.0.0.1:8888
      - --codex-executable
      - /usr/local/bin/codex
      - --codex-model
      - gpt-5.6-luna
      - --codex-reasoning-effort
      - high
      - --compiler-timeout-ms
      - "${SUPERMEMORY_CODEX_TIMEOUT_MS:-120000}"
    volumes:
      - ${SUPERMEMORY_VAULT_DIR:-/opt/supermemory/vault}:/data/vault
      - ${SUPERMEMORY_RUNTIME_DIR:-/opt/supermemory/runtime}:/data/runtime
      - ${SUPERMEMORY_CODEX_AUTH_DIR:-/opt/supermemory/codex-auth}:/var/lib/supermemory-codex
      - ${SUPERMEMORY_SECRETS_DIR:-/opt/supermemory/secrets}/archive_key:/run/supermemory/archive.key:ro
      - ${SUPERMEMORY_SECRETS_DIR:-/opt/supermemory/secrets}/daemon_token:/run/supermemory/daemon.token:ro
      - ${SUPERMEMORY_SECRETS_DIR:-/opt/supermemory/secrets}/graphd_token:/run/supermemory/graphd.token:ro
      - ${SUPERMEMORY_CONFIG_DIR:-/opt/supermemory/config}/runtime-contract.json:/run/supermemory/runtime-contract.json:ro
    depends_on:
      hindsight: { condition: service_healthy }
      supermemory-graphd: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const t=fs.readFileSync('/run/supermemory/daemon.token','utf8').trim();fetch('http://127.0.0.1:8765/health',{headers:{authorization:'Bearer '+t}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    mem_limit: "${SUPERMEMORY_DAEMON_MEMORY_LIMIT:-2g}"
    cpus: "${SUPERMEMORY_DAEMON_CPUS:-2.0}"
    pids_limit: 256
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    stop_grace_period: 120s
    security_opt: [no-new-privileges:true]
    logging: *default_logging

  supermemory-web:
    image: ${SUPERMEMORY_RUNTIME_IMAGE:-supermemory-runtime:4.0.0}
    build:
      context: ../..
      dockerfile: deploy/runtime/Dockerfile
      args:
        CODEX_CLI_VERSION: "${CODEX_CLI_VERSION:-0.146.1}"
    pull_policy: build
    restart: unless-stopped
    network_mode: host
    environment:
      HINDSIGHT_BASE_URL: "http://127.0.0.1:8888"
      HINDSIGHT_BANK_ID: "${HINDSIGHT_BANK_ID:-supermemory-local}"
      SUPERMEMORY_DAEMON_ENDPOINT: "http://127.0.0.1:8765"
      SUPERMEMORY_DAEMON_TOKEN_FILE: "/run/supermemory/daemon.token"
    command: ["node", "scripts/supermemory-app.mjs", "--port", "4310", "--vault-root", "/data/vault", "--backups-root", "/data/backups", "--automatic-admission"]
    volumes:
      - ${SUPERMEMORY_VAULT_DIR:-/opt/supermemory/vault}:/data/vault
      - ${SUPERMEMORY_BACKUPS_DIR:-/opt/supermemory/backups}:/data/backups
      - ${SUPERMEMORY_SECRETS_DIR:-/opt/supermemory/secrets}/daemon_token:/run/supermemory/daemon.token:ro
    depends_on:
      hindsight: { condition: service_healthy }
      supermemory-daemon: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 20s
    mem_limit: "${SUPERMEMORY_WEB_MEMORY_LIMIT:-1g}"
    cpus: "${SUPERMEMORY_WEB_CPUS:-1.0}"
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    logging: *default_logging

secrets:
  neo4j_auth:
    file: ${SUPERMEMORY_SECRETS_DIR:-/opt/supermemory/secrets}/neo4j_auth
  graphd_token:
    file: ${SUPERMEMORY_SECRETS_DIR:-/opt/supermemory/secrets}/graphd_token

volumes:
  hindsight_database_v090: { name: supermemory-hindsight-v090-database }
  hindsight_cache_v090: { name: supermemory-hindsight-v090-cache }
  neo4j_data: { name: supermemory-neo4j-data }
  neo4j_logs: { name: supermemory-neo4j-logs }
  neo4j_backups: { name: supermemory-neo4j-backups }

networks:
  supermemory_ai: { driver: bridge }
  supermemory_graph: { driver: bridge, internal: true }
