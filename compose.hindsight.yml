services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight@sha256:f0f9e9a73d6aedde9eaf4010ab604c3e015494e494318b26f1011144856b8112
    pull_policy: if_not_present
    container_name: supermemory-hindsight-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: llamacpp
      HINDSIGHT_API_WORKER_ID: supermemory-local
    volumes:
      - "${HOME}/.hindsight-docker-supermemory:/home/hindsight/.pg0"
