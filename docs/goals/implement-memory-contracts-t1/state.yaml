        - "T1.2 expected snapshot_id_collision, got no_error"
        - "T1.3 expected candidate_not_validated, got no_error"
        - "T1.4 expected candidate_type_not_promotable, got no_error"
        - "T1.5 expected do_not_use_not_promotable, got no_error"
        - "T1.6 expected unsafe_recall_policy, got no_error"
        - "T1.7 expected missing_answer_evidence, got no_error"
        - "T1.8 expected invalid_relation_endpoints, got no_error"
      commands:
        - cmd: "node scripts/verify-memory-contracts.mjs"
          status: pass
        - cmd: "node --test tests/memory-contracts.test.mjs"
          status: pass
        - cmd: "git diff --check"
          status: pass
      impact_assessment_ref: T001
