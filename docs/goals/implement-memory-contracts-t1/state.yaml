version: 2
goal:
  slug: implement-memory-contracts-t1
  title: Implement Memory Contracts T1
  status: active
  created_at: "2026-05-20"
  updated_at: "2026-05-20"
  original_request: "on lance un goal afin d'implementer les T1.X ?"
  interpreted_outcome: "Implement Tranche 1 memory-contract TDD fixtures and verifier for T1.1 through T1.8 without integrating Hindsight runtime or building a memory engine."
  input_shape: specific
  audience: "SuperMemory implementers"
  authority: requested
  proof_type: test
  completion_proof: "T1 memory-contract verifier passes, broader SuperMemory specs pass, diff check passes, and changes are committed/pushed."
  goal_oracle: "node scripts/verify-memory-contracts.mjs rejects every invalid T1 fixture with exact expected error names and accepts the valid minimum contract fixture."
  intake:
    completion_proof: "Final audit maps T1.1-T1.8 to fixture assertions and passing verification commands, then cites commit/push proof."
  oracle:
    signal: "node scripts/verify-memory-contracts.mjs plus node scripts/verify-supermemory-specs.mjs pass."
    final_proof: "Final Judge receipt states full_outcome_complete: true with T1 coverage, verification output, and shipping proof."
  likely_misfire: "Build an overbroad engine or loose fixture existence checker instead of a deterministic TDD contract validator."
  non_goals:
    - "No Hindsight runtime integration."
    - "No API, service, database, or UI."
    - "No Golden Case enterprise implementation beyond T1 contracts."
    - "No Graphiti or Memoria activation."
  constraints:
    - "Use the TDD matrix as the source of truth for T1.X."
    - "Start with red tests/fixtures before green implementation."
    - "Keep the validator deterministic and local."
    - "Do not weaken existing verification scripts."
  existing_plan_facts:
    - "docs/golden-case-tdd-matrix.md defines T1.1 through T1.8."
    - "The next files expected by the matrix are scripts/verify-memory-contracts.mjs and identity-vault/90_evals/cases/memory-contracts/**."
goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false
rules:
  allow_read_only_goal_without_shipping: true
  require_quality_checker: true
  require_tdd_worker_flow: true
  require_github_ship_task: true
  require_impact_assessment: true
  one_active_task: true
  goal_pressure_requires_oracle: true
agents:
  scout: installed
  worker: installed
  judge: installed
workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true
active_task: T998
tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate and operationalize the T1.X implementation package before any writes."
    inputs:
      - "docs/golden-case-tdd-matrix.md"
      - "docs/golden-case-implementation-roadmap.md"
      - "identity-vault/75_governance/sequential_relational_model.md"
      - "Current git status"
    constraints:
      - "Read-only."
      - "Preserve the pending roadmap/TDD docs as existing user-approved design work; do not discard them."
      - "Choose the largest safe useful Worker slice for red tests and the green validator."
      - "Do not approve Hindsight runtime, DB, API, or UI work."
    expected_output:
      - "Decision: approved | needs_more_evidence | blocked"
      - "design_concept"
      - "ubiquitous_language"
      - "feedback_policy"
      - "test_strategy"
      - "module_map"
      - "interface_contract"
      - "architecture_review"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
      - "Exact red-test Worker objective, allowed_files, verify, stop_if"
      - "Exact green Worker objective, allowed_files, verify, stop_if"
    receipt:
      result: done
      decision: approved
      design_concept: "T1 is a deterministic contract-validation tranche: fixtures express valid and invalid memory-contract shapes, and the verifier enforces the minimum gates before any runtime Hindsight integration exists."
      ubiquitous_language:
        - "Use Source, SourceSnapshot, Observation, MemoryCandidate, ValidatedMemory, Relation, HindsightPromotionPayload, RecallPolicy, and AnswerEvidence."
        - "Use exact error names from the TDD matrix: missing_snapshot_proof, snapshot_id_collision, candidate_not_validated, candidate_type_not_promotable, do_not_use_not_promotable, unsafe_recall_policy, missing_answer_evidence, invalid_relation_endpoints."
      feedback_policy: "Invalid fixtures must fail with the expected named error; valid fixture must pass. Do not weaken fixtures to obtain green."
      test_strategy: "Create a local JSON fixture with invalid_cases and a valid case, then implement scripts/verify-memory-contracts.mjs as the oracle. T002 records red evidence, T003 makes T1.1-T1.8 green."
      module_map:
        - "scripts/verify-memory-contracts.mjs: deterministic T1 validator and CLI."
        - "identity-vault/90_evals/cases/memory-contracts/input/contracts.fixture.json: valid object graph plus invalid cases."
        - "identity-vault/90_evals/cases/memory-contracts/expected/assertions.json: required T1 coverage and error names."
        - "scripts/verify-supermemory-specs.mjs: broader regression suite, optionally updated to include memory contracts after green."
      interface_contract:
        required_valid_collections:
          - "sources"
          - "snapshots"
          - "observations"
          - "memory_candidates"
          - "validated_memories"
          - "relations"
          - "promotion_payloads"
          - "recall_policies"
          - "answer_evidence"
        required_t1_errors:
          T1.1: "missing_snapshot_proof"
          T1.2: "snapshot_id_collision"
          T1.3: "candidate_not_validated"
          T1.4: "candidate_type_not_promotable"
          T1.5: "do_not_use_not_promotable"
          T1.6: "unsafe_recall_policy"
          T1.7: "missing_answer_evidence"
          T1.8: "invalid_relation_endpoints"
      architecture_review: "Approved. Keep this as a fixture validator, not a memory engine. A later tranche can reuse the shapes for runtime code."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "none; local fixture contract only"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none"
        deploy_rollback: "none"
        observability: "local verifier output only"
        docs: "roadmap/TDD docs already pending and should be preserved"
      red_worker:
        objective: "Create scripts/verify-memory-contracts.mjs and memory-contracts fixtures so the command runs and fails red because validations are not implemented yet."
        allowed_files:
          - "scripts/verify-memory-contracts.mjs"
          - "identity-vault/90_evals/cases/memory-contracts/input/contracts.fixture.json"
          - "identity-vault/90_evals/cases/memory-contracts/expected/assertions.json"
          - "docs/goals/implement-memory-contracts-t1/state.yaml"
        verify:
          - "node --test tests/memory-contracts.test.mjs"
          - "node scripts/verify-memory-contracts.mjs"
          - "git diff --check"
      green_worker:
        objective: "Implement the minimal validator and optionally include it in scripts/verify-supermemory-specs.mjs so T1.1-T1.8 and the full suite pass."
        allowed_files:
          - "scripts/verify-memory-contracts.mjs"
          - "identity-vault/90_evals/cases/memory-contracts/input/contracts.fixture.json"
          - "identity-vault/90_evals/cases/memory-contracts/expected/assertions.json"
          - "scripts/verify-supermemory-specs.mjs"
          - "docs/goals/implement-memory-contracts-t1/state.yaml"
        verify:
          - "node --test tests/memory-contracts.test.mjs"
          - "node scripts/verify-memory-contracts.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
      evidence:
        - "docs/golden-case-tdd-matrix.md"
        - "identity-vault/75_governance/sequential_relational_model.md"
