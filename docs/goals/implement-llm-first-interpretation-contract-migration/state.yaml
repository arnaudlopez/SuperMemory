      decision: approved
      design_concept: "LLM-first interpretation with deterministic governance gates: Observations remain source-backed, InterpretationCandidate carries adaptive LLM meaning with uncertainty and use pattern, and deterministic validators gate advancement to memory, promotion, recall, and answers."
