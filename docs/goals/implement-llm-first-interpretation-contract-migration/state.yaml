goal:
  slug: implement-llm-first-interpretation-contract-migration
  title: Implement LLM-First Interpretation Contract Migration
  status: done
  created_at: "2026-05-21"
  updated_at: "2026-05-21"
  original_request: "goal-prep OK, maintenant passe à l'implémentation du plan prends ton temps"
  interpreted_outcome: "Implement the LLM-first migration plan so SuperMemory consistently models InterpretationCandidate while preserving T1/M1, deterministic governance gates, and global verification."
  input_shape: existing_plan
  audience: "SuperMemory implementers and Arnaud"
  authority: approved
  proof_type: test
  completion_proof: "Enterprise target, T1 contracts, M1 fixture, global SuperMemory specs, and diff check pass; docs/roadmap are aligned; changes are committed and pushed or shipping blocker is recorded."
  goal_oracle: "The migration oracle passes: enterprise target, T1, M1, global specs, and diff check."
  intake:
    completion_proof: "Final audit maps all changed files and verification output back to docs/llm-first-migration-plan.md."
  oracle:
    signal: "node scripts/verify-supermemory-specs.mjs passes after the migration, with T1 and M1 direct verifiers also green."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge receipt says full_outcome_complete: true with verification and shipping proof."
  likely_misfire: "Only making the current global spec failure green, or only editing docs, without generalizing interpretation invariants into T1 and preserving M1 as the first executable LLM-first slice."
  non_goals:
    - "No Hindsight runtime integration."
    - "No Graphiti, Memoria, or engine-port runtime."
    - "No connector, database, service, API, or UI work."
    - "No raw inbox source edits."
    - "No broad vault rewrite."
  constraints:
    - "Preserve existing uncommitted InterpretationCandidate work unless a task proves a safer compatible adjustment."
    - "Keep exact named errors for hard governance invariant failures."
    - "Relax exact natural-language interpretation wording only after property checks exist."
    - "Do not weaken provenance, status, freshness, access, do_not_use, confirmation, or answer evidence checks."
    - "Use TDD for new interpretation invariant checks."
  existing_plan_facts:
    - "docs/llm-first-migration-plan.md defines the target contract and migration order."
    - "Current plan order: restore global specs, generalize T1, harden M1, align roadmap/PRD/docs."
    - "Current dirty worktree already includes interpretation_contract.md and M1 InterpretationCandidate changes."
