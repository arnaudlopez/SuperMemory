        - "Observation: source-backed statement extracted from a SourceSnapshot."
        - "InterpretationCandidate: LLM/memory-agent proposed meaning with evidence_refs, confidence, uncertainty, assumptions, alternatives, use_pattern, and review_status."
        - "MemoryCandidate: governed memory proposal derived from source-backed interpretation."
        - "ValidatedMemory: memory that passed proof, access, freshness, sensitivity, status, and conflict gates."
        - "GovernanceGate: deterministic property checks for hard invariants, not world understanding."
        - "AnswerEvidence: proof chain from used memory to cited snapshots and answer_state."
