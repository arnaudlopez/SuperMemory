      design_concept: "When sources disagree, SuperMemory preserves both facts, records conflicts_with, returns a conflicting answer unless an explicit reliability rule applies, and opens review for unresolved cases. Unavailable sources produce last-known/unverified answers only."
      interface_contract:
        conflict_preservation: "Both conflicting memory items and snapshots remain present with conflicts_with relation."
        no_silent_choice: "No reliability rule means answer_state conflicting and no selected_memory_id."
        explicit_arbitration: "A rule may select guidance but answer must cite conflict and rule id."
        unavailable: "Unavailable source answer uses unavailable or last_known state, not current."
        review_queue: "Unresolved conflict creates conflict_queue review item."
      test_strategy:
        red: "Add fixture/global wiring before verifier implementation so global specs fail on missing verifier."
        green: "Implement verifier for T6.1-T6.5 and wire Node test/global specs."
