version: 2

goal:
  title: "T6 Conflict Unavailable Arbitration"
  slug: "implement-conflict-unavailable-arbitration-t6"
  kind: specific
  tranche: "Implement an executable contract proving conflict preservation, explicit arbitration, unavailable handling, and review queue creation."
  status: done
  oracle:
    signal: "A T6 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves conflict/unavailable arbitration while T0-T5 remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T6 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit_sha 8629d32, pushed branch origin/main, and final audit full_outcome_complete true."
  intake:
    original_request: "enchaine"
    interpreted_outcome: "Continue with T6 conflict, unavailable, and arbitration tranche."
    input_shape: specific
    audience: "SuperMemory maintainers and future memory agents"
    authority: requested
    proof_type: test
    completion_proof: "A T6 fixture/verifier proves conflict/unavailable arbitration, global specs pass, and the work is committed and pushed."
    likely_misfire: "Letting source reliability become silent auto-selection or treating unavailable connector checks as unchanged."
    blind_spots_considered:
      - "Conflicts must preserve both facts."
      - "Explicit reliability rule can guide but must still cite conflict."
      - "Unavailable sources need last-known/refresh behavior."
      - "Unresolved conflicts need review queue evidence."
    existing_plan_facts:
      - "docs/golden-case-tdd-matrix.md defines T6.1-T6.5."
      - "identity-vault/75_governance/conflict_arbitration.md requires conflict preservation and explicit ordering."
      - "identity-vault/75_governance/source_reliability.md defines reliability ordering."
      - "identity-vault/75_governance/answer_policy.md defines conflicting and unavailable answer states."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
