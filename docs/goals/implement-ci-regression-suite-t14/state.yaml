version: 2

goal:
  title: "T14 CI Regression Suite"
  slug: "implement-ci-regression-suite-t14"
  kind: specific
  tranche: "Make Golden Case invariants automatic regressions in CI."
  status: done
  oracle:
    signal: "A T14 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves CI runs critical checks while provenance, permission, do_not_use, relation-chain, and promptfoo-optionality regressions are caught."
    cadence: "after each Worker package and at final audit"
    final_proof: "T14 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit SHA, pushed branch origin/main, and final audit full_outcome_complete true."
  intake:
    original_request: "enchaine"
    interpreted_outcome: "Continue with T14 regression/CI automation."
    input_shape: specific
    audience: "SuperMemory maintainers"
    authority: requested
    proof_type: test
    completion_proof: "A T14 verifier and CI workflow prove critical regressions fail locally and in GitHub Actions while promptfoo remains optional."
    likely_misfire: "Adding a CI workflow that only runs happy-path specs without proving the regression invariants or making promptfoo accidentally mandatory."
    blind_spots_considered:
      - "CI must run the meta-regression verifier, the global spec runner, and whitespace checks."
      - "Regression checks must prove broken provenance, permission filters, do_not_use recall, and relation chains fail."
      - "promptfoo can be documented as optional but must not become a required dependency or CI gate."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

