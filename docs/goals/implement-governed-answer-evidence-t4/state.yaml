      - "identity-vault/90_evals/cases/governed-answer-evidence/expected/assertions.json"
      - "identity-vault/90_evals/cases/governed-answer-evidence/expected/answer-evidence.json"
      - "identity-vault/90_evals/cases/governed-answer-evidence/actual/README.md"
      - "scripts/verify-governed-answer-evidence.mjs"
      - "tests/governed-answer-evidence.test.mjs"
      - "scripts/verify-supermemory-specs.mjs"
    verify:
      - "node scripts/verify-governed-answer-evidence.mjs"
      - "node --test tests/governed-answer-evidence.test.mjs"
      - "node scripts/verify-supermemory-specs.mjs"
      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "Need files outside allowed_files before T003 is complete."
      - "Cannot produce a meaningful red failure before implementation."
      - "Implementation would weaken T0/T1/T2/T3 or global specs."
      - "Behavior becomes an LLM text evaluator instead of deterministic contract checks."
    receipt:
      result: done
      summary: "Implemented the T4 governed answer evidence contract with fixture, verifier, targeted Node test, and global spec wiring."
      changed_files:
        - "identity-vault/90_evals/cases/governed-answer-evidence/input/fixture.json"
        - "identity-vault/90_evals/cases/governed-answer-evidence/expected/assertions.json"
        - "identity-vault/90_evals/cases/governed-answer-evidence/expected/answer-evidence.json"
        - "identity-vault/90_evals/cases/governed-answer-evidence/actual/README.md"
        - "scripts/verify-governed-answer-evidence.mjs"
        - "tests/governed-answer-evidence.test.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      red_evidence:
        - command: "node scripts/verify-supermemory-specs.mjs"
          outcome: "expected_fail"
          summary: "Failed after global wiring because scripts/verify-governed-answer-evidence.mjs did not exist yet."
      commands:
        - cmd: "node scripts/verify-governed-answer-evidence.mjs"
          status: pass
        - cmd: "node --test tests/governed-answer-evidence.test.mjs"
          status: pass
        - cmd: "node scripts/verify-supermemory-specs.mjs"
          status: pass
      design_delta: "T4 now proves governed answer evidence: current answers require memory/document/snapshot/adapter-trace evidence and supports_answer; stale answers cannot claim current certainty; changed or needs_review memory routes to review without operational guidance; restricted answers expose withheld_fields; do_not_use memory is refused; recall-backed answers require adapter traces."

