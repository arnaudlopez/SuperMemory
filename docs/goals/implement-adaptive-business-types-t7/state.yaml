        - "docs/golden-case-tdd-matrix.md defines node scripts/verify-adaptive-business-types.mjs and T7.1-T7.5."
        - "docs/golden-case-implementation-roadmap.md requires marketing_strategy absent at t0, source-backed at t1, experimental, and not stable."
        - "identity-vault/75_governance/entity_type_registry.md lists marketing_strategy only under candidate/experimental examples, not active stable business types."
        - "identity-vault/75_governance/type_lifecycle.md blocks candidate promotion and requires source/eval evidence for stable."
        - "identity-vault/50_review/type_queue.md owns proposed type evidence."
      module_map:
        new_case: "identity-vault/90_evals/cases/adaptive-business-types"
        new_verifier: "scripts/verify-adaptive-business-types.mjs"
        new_test: "tests/adaptive-business-types.test.mjs"
        global_oracle: "scripts/verify-supermemory-specs.mjs"
      ubiquitous_language:
        - "entity_type_registry"
        - "type_queue"
        - "candidate"
        - "experimental"
        - "stable"
        - "schema_status:experimental"
        - "marketing_strategy"
        - "source-backed"
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "local verifier contract only"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none"
        deploy_rollback: "revert fixture/script/test/docs changes"
        observability: "fixture assertions for lifecycle and recall filter evidence"
        docs: "update adaptive type governance docs after green behavior"

    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve T7 architecture and select Worker slice."
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      architecture_review: "Approved. Implement a deterministic local T7 contract, not a production ontology service or live Hindsight integration."
      design_concept: "SuperMemory begins with a stable kernel and grows business types only when real sources or workflows require them. New types pass through candidate and experimental gates before any stable use."
      interface_contract:
        absent_at_t0: "marketing_strategy is not active at t0."
        source_backed_candidate: "A t1 source can propose marketing_strategy only through type_queue evidence."
        candidate_block: "candidate schema_status cannot be actively promoted."
        experimental_bound: "experimental recall must include schema_status:experimental and entity_type filter evidence."
        stable_gate: "stable promotion requires source/eval or review evidence and rejects arbitrary promotion."
      test_strategy:
        red: "Add fixture/global wiring before verifier implementation so global specs fail on missing verifier."
        green: "Implement verifier for T7.1-T7.5 and wire Node test/global specs."
      feedback_policy: "Check lifecycle evidence and filter tags, not exact prose."
      impact_assessment_ref: "T001 receipt impact_assessment"
      allowed_files:
        - "identity-vault/90_evals/cases/adaptive-business-types/input/fixture.json"
        - "identity-vault/90_evals/cases/adaptive-business-types/expected/assertions.json"
        - "identity-vault/90_evals/cases/adaptive-business-types/expected/answer-evidence.json"
        - "identity-vault/90_evals/cases/adaptive-business-types/actual/README.md"
        - "scripts/verify-adaptive-business-types.mjs"
        - "tests/adaptive-business-types.test.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      verify:
        - "node scripts/verify-adaptive-business-types.mjs"
        - "node --test tests/adaptive-business-types.test.mjs"
        - "node scripts/verify-supermemory-specs.mjs"
        - "git diff --check"

