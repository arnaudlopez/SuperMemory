version: 2

goal:
  title: "T7 Adaptive Business Types"
  slug: "implement-adaptive-business-types-t7"
  kind: specific
  tranche: "Implement an executable contract proving that new business types appear only when source-backed and remain governed by lifecycle status."
  status: done
  oracle:
    signal: "A T7 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves adaptive business types while T0-T6 remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T7 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit_sha d164e99, pushed branch origin/main, and final audit full_outcome_complete true."
  intake:
    original_request: "okgo"
    interpreted_outcome: "Continue with T7 adaptive business types."
    input_shape: specific
    audience: "SuperMemory maintainers and future memory agents"
    authority: requested
    proof_type: test
    completion_proof: "A T7 fixture/verifier proves adaptive type lifecycle behavior, global specs pass, and the work is committed and pushed."
    likely_misfire: "Preloading marketing_strategy as active or stable, or allowing candidate types into active promotion."
    blind_spots_considered:
      - "marketing_strategy must not be active at t0."
      - "A real t1 source must justify the type proposal."
      - "candidate types are not promotable as active memory."
      - "experimental types require bounded recall filters."
      - "stable promotion requires eval/source evidence."
    existing_plan_facts:
      - "docs/golden-case-tdd-matrix.md defines T7.1-T7.5."
      - "docs/golden-case-implementation-roadmap.md defines the adaptive type oracle."
      - "identity-vault/75_governance/entity_type_registry.md lists marketing_strategy only as a candidate example."
      - "identity-vault/75_governance/type_lifecycle.md defines candidate -> experimental -> stable | deprecated."
      - "identity-vault/50_review/type_queue.md owns proposed types before activation."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/implement-adaptive-business-types-t7/"
    command: "npx goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-adaptive-business-types-t7"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map T7 source documents and insertion point."
    receipt:
      result: done
      summary: "T7 target found in roadmap/matrix. Existing type registry, type lifecycle, type queue, and PRD define the adaptive type contract."
