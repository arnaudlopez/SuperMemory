version: 2

goal:
  title: "Déployer SuperMemory dans Codex Desktop macOS"
  slug: "deploy-codex-supermemory-desktop"
  kind: existing_plan
  tranche: "Auditer, implémenter, installer et prouver le runtime Desktop macOS réel avec rollback."
  status: active
  oracle:
    signal: "Une nouvelle conversation Codex Desktop sur le projet lié capture un marqueur non sensible et rappelle une mémoire approuvée avec citation."
    cadence: "après le package de déploiement, après l’application réelle et à l’audit final"
    final_proof: "Canari Desktop daté, redémarrage, diagnostic vert et rollback vérifié depuis la sauvegarde du profil."
  intake:
    original_request: "Yeah. Ok essaie d implémenter ça"
    interpreted_outcome: "Rendre l’intégration SuperMemory effectivement active dans Codex Desktop macOS, automatiquement et de façon réversible."
    input_shape: existing_plan
    audience: "propriétaire et utilisateur de SuperMemory"
    authority: approved
    proof_type: demo
    completion_proof: "Le profil Codex réel, le projet lié et les services locaux passent capture, recall cité, redémarrage et rollback sans ancien hook concurrent."
    likely_misfire: "Livrer uniquement plus de code ou un canari isolé sans activation réelle dans l’application macOS."
    blind_spots_considered:
      - "Ancien Memory Compiler ou hooks existants."
      - "Confiance manuelle des hooks de plugin."
      - "Version Codex différente entre CLI et application."
      - "Projet local versus hôte Remote."
      - "LaunchAgent, Hindsight, Ollama et permissions macOS."
      - "Secrets, sauvegarde et rollback du profil réel."
    existing_plan_facts:
      - "Le plugin, hooks, MCP, daemon, registre et installer réversible existent."
      - "Le canari isolé Codex 0.125 a prouvé discovery, activation et oracle local."
      - "Le vrai profil ne contient pas encore SuperMemory."
      - "Le projet SuperMemory est actuellement unbound et sans runtime config."
      - "Le hook reste un capteur; la mémoire active passe par candidate et approbation."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41739/deploy-codex-supermemory-desktop/"
