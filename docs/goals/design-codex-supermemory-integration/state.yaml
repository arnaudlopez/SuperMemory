      result: done
      task_id: T002
      board_path: "/Users/arnaud/Documents/SuperMemory/docs/goals/design-codex-supermemory-integration/state.yaml"
      decision: approved
      full_outcome_complete: false
      rationale: "Les preuves suffisent pour un contrat sans ambiguïté bloquante. L’architecture retenue est un daemon local SuperMemory avec vault canonique, journal append-only, identité projet persistante, capture structurée App Server quand disponible, hooks comme filet de sécurité, et MCP comme seul chemin de recall agent. Les archives brutes, candidates et mémoires actives sont des niveaux distincts. Hindsight reste une projection reconstruisible."
      worker_package:
        objective: "Rédiger un blueprint normatif et implémentable. Il doit fixer: project_id UUID persistant avec aliases et relations worktree; workspace_id stable séparé des chemins; event envelope versionné et journal append-only; priorité App Server > hooks > import history; déduplication et checkpoints; archive chiffrée séparée des candidates/mémoires; aucune capture du raisonnement caché; redaction avant persistance/projection; promotion owner-governed; snapshots de fichiers et de tours; MCP read-only scoped avec citations, budgets et fail-closed; coexistence avec Memories natives désactivées ou non autoritatives; migration idempotente de l’ancien compiler; offline/replay/backpressure; observabilité, rollout, rollback et matrice d’acceptation Desktop/CLI/IDE."
        allowed_files:
          - "docs/codex-supermemory-technical-design.md"
          - "docs/README.md"
        verify:
          - "test -s docs/codex-supermemory-technical-design.md"
          - "rg -n '^## (Contexte|Décisions|Architecture|Identité|Modèle de données|Capture Codex|Versioning|Recall MCP|Sécurité|Migration|Observabilité|Déploiement|Tests et acceptation)' docs/codex-supermemory-technical-design.md"
          - "rg -n 'learn.chatgpt.com/docs/(hooks|extend/mcp|app-server|config-file/config-reference)' docs/codex-supermemory-technical-design.md"
          - "git diff --check"
          - "npm test"
        stop_if:
          - "Une décision structurante ci-dessous ne peut pas être exprimée comme contrat testable."
          - "Une modification hors docs/codex-supermemory-technical-design.md ou docs/README.md serait nécessaire."
          - "Une source officielle contredit un contrat retenu."
          - "Une vérification échoue deux fois."
      evidence:
        - "Identité: project_id est un UUID SuperMemory persistant; root_id/fingerprint servent à l’attachement initial; tous les chemins sont des aliases historisés. Un worktree possède son propre checkout_id mais hérite du project_id via l’identité Git commune et une validation owner en cas d’ambiguïté."
        - "Isolation: workspace_id est stable et obligatoire sur chaque événement, archive, source, snapshot, candidate, mémoire et requête; aucune requête cross-workspace implicite."
        - "Capture: App Server item/completed est autoritatif pour une intégration hôte; hooks SessionStart/UserPromptSubmit/PostToolUse/PreCompact/PostCompact/Stop/SessionEnd assurent le chemin portable; history/transcript import est un backfill explicite, jamais un parsing supposé stable en continu."
        - "Déduplication: event_id déterministe par source_adapter + session/thread + turn + item + payload_hash; journal append-only, cursor/checkpoint par adapter et au moins une fois avec application idempotente."
        - "Contenu: archive détaillée chiffrée et à rétention bornée; sorties volumineuses tronquées ou externalisées par hash; redaction de secrets avant écriture; candidates séparées; mémoires actives uniquement après gouvernance."
        - "Versioning: snapshot de tour immuable relié aux événements; snapshot fichier content-addressed; rename = nouvel alias de la même source quand l’identité est prouvée, sinon review; changement rend les dérivés stale avant reprojection."
        - "Recall: serveur MCP SuperMemory local expose status, resolve_project, search_memory, get_memory et explain_citation en lecture seule; scope issu du cwd/project binding et confirmé par workspace; résultats bornés, cités, filtrés et fail-closed."
        - "Injection: SessionStart ne fournit qu’un bref contexte de navigation et l’instruction d’utiliser MCP à la demande; aucun dump automatique d’archive."
        - "Hindsight: consumer:codex peut être ajouté seulement à la projection approuvée; l’autorisation est recalculée depuis le vault avant chaque résultat; indisponibilité Hindsight déclenche fallback local explicite."
        - "Memories natives: optionnelles et non canoniques; recommandation initiale features.memories=false pour éviter la double source de vérité. Si activées ultérieurement, aucune synchronisation bidirectionnelle sans nouvelle décision."
        - "Sécurité: boucle locale, permissions 0700/0600, clé en keychain/secret store, chiffrement AEAD par record/blob, redaction versionnée, TTL par classe, suppression tombstone + purge projection + compactage attesté."
        - "Migration: inventaire/backup, désactivation atomique des anciens hooks, import idempotent archive/inbox/briefs avec legacy_id, rapport de collisions, comparaison en shadow, cutover et rollback."
        - "Dégradation: Desktop/IDE hôte App Server riche; CLI/IDE sans hôte via hooks; tout client bénéficie du MCP partagé; offline met en file locale, backpressure ne bloque jamais Codex, crash reprend au checkpoint."
        - "Schémas obligatoires: diagramme composants, séquences capture/recall/suppression, tables ProjectBinding/EventEnvelope/ConversationArchive/TurnSnapshot/Candidate/Memory/ProjectionCheckpoint/Tombstone."
        - "Tests obligatoires: identité rename/move/worktree/multi-root, doublons hooks+App Server, ordre/replay/crash, secrets/troncature/chiffrement/TTL/purge, scope denial, stale/revoke, Hindsight offline, MCP indisponible, migration/rollback, matrices Desktop/CLI/IDE."
      subgoal_contract: null
      parallel_safety: "Un seul Worker documentaire; pas de parallélisme d’écriture."
