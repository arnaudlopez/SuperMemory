version: 2

goal:
  title: "Concevoir l’intégration technique Codex ↔ SuperMemory"
  slug: "design-codex-supermemory-integration"
  kind: existing_plan
  tranche: "Produire et faire auditer une conception technique implémentable, sans modifier le produit."
  status: done
  oracle:
    signal: "Le document technique mappe chaque exigence approuvée à des contrats, flux, schémas, stratégies d’échec et critères d’acceptation."
    cadence: "après la rédaction initiale, après revue et à l’audit final"
    final_proof: "Receipt Judge final avec full_outcome_complete: true, git diff --check vert et aucune ambiguïté bloquante."
  intake:
    original_request: "Maintenant, passe à la conception technique."
    interpreted_outcome: "Fournir le blueprint technique complet de l’intégration Codex-SuperMemory prête à implémenter."
    input_shape: existing_plan
    audience: "mainteneur et futurs implémenteurs de SuperMemory"
    authority: approved
    proof_type: artifact
    completion_proof: "Document versionné et revu couvrant architecture, contrats, données, sécurité, migrations, observabilité et acceptation."
    likely_misfire: "Concevoir une intégration théorique incompatible avec le store actuel ou insuffisamment gouvernée."
    blind_spots_considered:
      - "Déplacement, renommage, worktrees et projets multi-dossiers."
      - "Collisions du workspace mono-projet actuel."
      - "Secrets et données sensibles dans les transcripts et sorties outils."
      - "Limites des hooks et outils hébergés."
      - "Double source de vérité avec les Memories natives de Codex."
      - "Migration de l’ancien claude-memory-compiler."
    existing_plan_facts:
      - "Project resolver stable fondé sur une identité persistante, avec les chemins comme alias."
      - "Journal détaillé distinct des mémoires gouvernées et projetées."
      - "Hooks pour la capture et MCP pour le recall à la demande."
      - "SessionStart injecte seulement un contexte court et borné."
      - "Vault canonique, Hindsight reconstruisible."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

