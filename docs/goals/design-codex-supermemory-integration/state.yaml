      board_path: "/Users/arnaud/Documents/SuperMemory/docs/goals/design-codex-supermemory-integration/state.yaml"
      summary: "Le vault est déjà canonique, snapshoté et gouverné, mais le produit local utilise un workspace par défaut unique et une identité de source dérivée du chemin. Codex expose des hooks multi-couches, un MCP partagé entre clients locaux, un App Server structuré et des Memories natives expérimentales. La conception doit donc introduire une identité projet persistante, séparer archive et mémoire active, traiter les hooks comme capture dégradée et réserver l’App Server au chemin d’intégration riche."
      evidence:
        - "scripts/lib/product-store.mjs:215-228 — état canonique workspace/sources/snapshots/candidates/memories."
        - "scripts/lib/product-store.mjs:299-317 — workspaceId par défaut workspace:local et état dans le vault."
        - "scripts/lib/product-store.mjs:348-377 — snapshots SHA-256 et mémoires Markdown dans le vault."
        - "scripts/lib/product-store.mjs:422-440 — changement de source rend les mémoires stale et programme la révocation."
        - "scripts/lib/product-store.mjs:688-790 — ingestion bornée; sourceId dérivé de workspaceId + relativePath."
        - "scripts/lib/product-store.mjs:900-937 — folderName sert à l’inventaire et écrase le libellé du workspace."
        - "scripts/lib/product-store.mjs:1125-1192 — seule une candidate approuvée devient mémoire active et est projetée."
        - "scripts/lib/product-hindsight.mjs:17-33 — Hindsight strictement loopback."
        - "scripts/lib/product-hindsight.mjs:44-76 — tags et métadonnées actuels limités au consumer supermemory."
        - "README.md:20,73-77 — vault source de vérité; Hindsight projection reconstruisible et fallback local."
        - "https://learn.chatgpt.com/docs/hooks — événements, champs communs et caractère non stable de transcript_path."
        - "https://learn.chatgpt.com/docs/extend/mcp — configuration MCP partagée Desktop/CLI/IDE et portée projet possible."
        - "https://learn.chatgpt.com/docs/app-server — threads/turns/items structurés; item/completed autoritatif."
        - "https://learn.chatgpt.com/docs/config-file/config-reference — hooks, history.persistence et Memories désactivées par défaut."
        - "/Users/arnaud/Documents/claude-memory-compiler/hooks/stop.py:212-286 — migration possible du Stop hook incrémental."
        - "/Users/arnaud/Documents/claude-memory-compiler/hooks/session-start.py:1-35 — précédent d’injection de contexte borné."
      facts:
        - "Le chemin ne peut pas rester l’identité primaire: renommages, déplacements et worktrees créeraient des doublons."
        - "Une archive de conversation détaillée doit rester distincte des mémoires approuvées."
        - "Les hooks se cumulent entre couches et peuvent doubler les événements; les hooks projet exigent la confiance."
        - "transcript_path est pratique mais son format n’est pas un contrat stable."
        - "PostToolUse ne constitue pas une preuve exhaustive de toutes les actions hébergées."
        - "Le MCP est le contrat de recall le plus portable pour les clients Codex locaux."
        - "L’App Server est le meilleur flux structuré pour une intégration hôte, avec reprise et déduplication nécessaires."
        - "Les Memories natives Codex ne doivent pas devenir une seconde source de vérité."
