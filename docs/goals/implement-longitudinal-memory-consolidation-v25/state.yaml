active_task: null
tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: "Turn the mature request into a concrete acceptance contract before any implementation work."
    inputs:
      - "goal.md"
      - "acceptance-contract.md"
      - "Current repository source, tests, scripts, docs, and dirty worktree status"
    constraints:
      - "Read-only."
      - "Do not edit product files."
      - "Do not start implementation."
      - "Prefer observable owner outcomes over internal task completion."
    expected_output:
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "interface_contract: public behavior and boundaries that tests should target"
      - "test_strategy: acceptance tests, unit/integration boundaries, mocks, browser or visual checks if relevant"
      - "feedback_policy: targeted test cadence, typecheck, browser checks, and full-suite timing"
      - "acceptance_contract_updates: exact end-state evidence and failure modes"
      - "dirty_worktree_risk_map: unrelated files that must stay untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Read-only mapping completed. v2.5 is an internal daemon worker layered over existing encrypted episodes, independent admission, canonical revisions, Hindsight projections, GraphD, owner recall and Web status; no new service or authority plane is required."
      design_concept: "Episode-by-default, canon-selectively: visible governed Hermes/Codex turns remain immutable evidence; a bounded longitudinal worker emits role-aware signals, resolves only unambiguous user endorsements, clusters evidence deterministically, proposes one cited operation, verifies independently, applies versioned salience and commits through existing canonical stores before projection. Explicit remember becomes pinning, while decay changes recall priority only."
      ubiquitous_language:
        Episode: "Immutable encrypted governed turn or reduced action receipt; never canonical truth by existence alone."
        MemorySignal: "Non-authoritative, cited, role-aware feature extraction from one or more episodes."
        EvidenceCluster: "Deterministic owner/workspace/subject bounded group used for one consolidation decision."
        EndorsementLink: "User-visible acceptance linked to exactly one preceding visible assistant proposal in the same thread."
        ConsolidationProposal: "Cited observe/activate/reinforce/revise/supersede/deemphasize/noop request; never a commit."
        Salience: "Deterministic recall importance vector; not factual confidence."
        Pin: "Explicit governed priority requested by the user; synonym for retain is forbidden in implementation."
        CanonicalMemory: "Versioned vault-authoritative memory committed only after policy/authority checks."
        Deemphasize: "Lower recall priority without deletion or factual invalidation."
        ForbiddenSynonyms: "Do not call an episode a memory truth, salience confidence, Hindsight authority, or decay deletion."
      module_map:
        capture_boundary:
          - integrations/hermes/plugins/memory/supermemory_fabric/__init__.py
          - scripts/lib/personal-manager-capture.mjs
          - scripts/lib/codex-memory-compiler.mjs
        canonical_boundary:
          - scripts/lib/memory-admission-policy.mjs
          - scripts/lib/canonical-knowledge-worker.mjs
          - scripts/lib/personal-memory-command-bus.mjs
          - scripts/lib/personal-memory-revision-store.mjs
        recall_boundary:
          - scripts/lib/personal-recall-orchestrator.mjs
          - scripts/lib/codex-memory-router.mjs
          - scripts/lib/personal-context-card.mjs
        derived_planes:
          - scripts/lib/hindsight-learned-plane.mjs
          - scripts/lib/knowledge-graph-adapter.mjs
          - scripts/lib/hindsight-authority-gateway.mjs
        runtime_and_api:
          - scripts/supermemoryd.mjs
          - scripts/lib/supermemory-daemon.mjs
          - scripts/lib/personal-manager-api.mjs
          - scripts/lib/codex-runtime-config.mjs
          - deploy/runtime/runtime-contract.production.json
        ui_and_deploy:
          - scripts/supermemory-app.mjs
          - web/app.js
          - web/index.html
          - web/styles.css
          - deploy/portainer/supermemory-ai-stack.yml
          - "deploy/home101/*"
        new_deep_modules:
          - memory-signal-store
          - memory-endorsement-resolver
          - memory-salience-policy
          - longitudinal-memory-consolidator
          - memory-recall-feedback
        shallow_module_risks: "Avoid wrappers that merely rename existing admission/revision calls. Keep clustering/checkpoint/operation state cohesive in the consolidator; keep pure authority/endorsement/salience decisions independently testable."
      interface_contract:
        capture: "ACK remains asynchronous; captures activate_memory=false and contain only visible user/final assistant and reduced receipts."
        authority: "Assistant proposal alone and repetition alone cannot activate personal truth; direct user statement or valid endorsement may."
        operations: "observe/activate/reinforce/revise/supersede/deemphasize/noop are idempotent and cited; commit precedes derived projection."
        recall: "Authority and freshness precede salience; pin raises priority but cannot bypass scope or revocation."
        api: "Owner-only lineage/pin/unpin/feedback/status routes; operator run/rebuild with plan hash; checkout identities rejected."
        deployment: "Runtime v8 full activation in existing six-service Z2 stack; native Hermes stays on Home 101."
      test_strategy:
        first_red_e2e: "Natural user conclusion -> capture -> signal -> cluster -> verified consolidation -> canonical memory -> cited recall, with no explicit memory command."
        negatives:
          - "mundane conversation archive_only"
          - "unendorsed assistant proposal rejected"
          - "ambiguous OK rejected"
          - "single Gmail draft cannot infer preference"
          - "sensitive weak inference rejected"
          - "stale salient result loses to fresh current result"
          - "checkout cross-project call rejected"
        units:
          - "signal schema/redaction/idempotence"
          - "endorsement resolution"
          - "salience-v1 and class-aware decay"
          - "cluster identity/bounds"
          - "canonical operation transitions"
          - "lineage recalculation"
        integration:
          - "Hermes capture pipeline"
          - "Codex episode pipeline"
          - "Hindsight outage/retry"
          - "GraphD projection"
          - restart/checkpoint
          - "forget/revoke transitively"
        shipping:
          - "v2.5 exact matrix"
          - "v2-v2.4 regressions"
          - spec/release/production/secrets
          - "real Home101->Z2 E2E"
          - "Z2 restart"
          - "browser visual inspection"
      feedback_policy: "Run focused red/green tests after each module, v2.5 suite at each integration boundary, v2-v2.4 plus Hindsight/specs/secrets before deployment, then build images, back up Z2, deploy directly, run live API/Hermes/restart/browser checks, and only then final audit."
      acceptance_contract_updates: "Treat the 22 ACs as exact matrix entries. Add explicit gates for assistant non-authority, contextual endorsement ambiguity, evidence diversity for inferred preferences, non-destructive decay, transitive forget, worker bounds, six-service topology, native Home 101 Hermes, and runtime v8 canary=false/progressive=false."
      dirty_worktree_risk_map: "v2.4 and production deployment files are already modified or untracked, including supermemoryd, daemon, runtime config, Compose, Web UI, package.json, Personal Manager modules/tests and Home101 artifacts. They are prerequisite user work, not disposable noise. Snapshot hashes/baseline diffs before touching overlaps; add v2.5 changes incrementally; never reset, checkout or rewrite unrelated files. Generated .playwright-cli, output and __pycache__ stay outside implementation scope."
      impact_assessment:
        db_schema_migrations: "No database migration. Additive encrypted vault schemas and revision metadata require versioned readers and recovery tests."
        data_backfill: "Yes: plan/hash/checkpoint bounded signal generation and Codex-history consolidation after binding resolution; no automatic unbounded apply."
        env_secrets: "No new secrets. Reuse daemon/agent/checkout/GraphD/OpenAI credentials; never print them."
        auth_permissions: "Add owner lineage/pin/unpin/feedback/status and local operator run/rebuild permissions; preserve checkout isolation."
        api_contract: "Add Personal Manager lineage/pin/unpin/feedback/status plus local operator consolidation endpoints and compatible status fields."
        ui_routes: "Extend existing Web API and Memory views; no new public origin."
        background_jobs: "New concurrency-1 internal daemon worker, session-close notification, daily maintenance, encrypted checkpoint and retry/dead-letter."
        external_services: "Reuse Hindsight 0.9.0 and GraphD/Neo4j only; no additional service."
        deploy_rollback: "Backup Z2 app/vault/config; runtime flag stops worker; rollback images/config while preserving additive receipts; derived planes rebuildable."
        observability: "Backlog, cluster decisions, operation counts, latency, retries, token bounds, false-positive corrections and checkpoint status without raw content."
        docs: "Blueprint/spec, runtime v8 docs, production runbook and deployment receipt."
