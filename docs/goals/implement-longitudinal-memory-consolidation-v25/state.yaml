      module_map: "Approved T001 module map; new deep modules integrate through existing capture, canonical, derived, runtime and Web boundaries."
      interface_contract: "Owner-only longitudinal API; operator-only rebuild; no checkout widening; no action authorization from recalled memory."
      exact_worker_objective: "Write the failing v2.5 acceptance package for implicit consolidation and all high-risk negative/lifecycle cases without product implementation."
