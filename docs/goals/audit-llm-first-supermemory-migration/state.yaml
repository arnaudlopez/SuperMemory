  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Decide the LLM-first migration shape from Scout evidence and approve the smallest useful documentation work package."
    inputs:
      - "T001 receipt"
      - "Goal oracle"
      - "Non-goals and constraints"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Reject proposals that replace T1/M1 instead of migrating them."
      - "Reject proposals that remove deterministic governance gates for hard invariants."
      - "Reject documentation work that would require script, fixture, expected-output, or test edits in this tranche."
    expected_output:
      - "interface_contract"
      - "module_map"
      - "test_strategy"
      - "feedback_policy"
      - "Decision: approved | needs_more_evidence | blocked"
      - "design_concept for LLM-first interpretation plus deterministic governance gates"
      - "ubiquitous_language for InterpretationCandidate, Observation, MemoryCandidate, ValidatedMemory, GovernanceGate, and AnswerEvidence"
      - "feedback_policy for accepting multiple valid interpretations while preserving exact hard-invariant failures"
      - "test_strategy for future property-based or multi-valid-output verification"
      - "module_map of future file areas to modify"
      - "interface_contract for the proposed interpretation layer"
      - "architecture_review"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
      - "Exact docs Worker objective, allowed_files, verify, and stop_if if documentation edits are approved"
    receipt:
      result: done
      decision: approved
      design_concept: "SuperMemory should be LLM-first at the interpretation boundary and deterministic at the governance boundary. The LLM proposes InterpretationCandidate objects from source-backed Observations; deterministic gates accept, route to review, or reject based on evidence, confidence, uncertainty, use pattern, access, freshness, status, and promotion safety."
      ubiquitous_language:
        - "Observation: source-backed statement extracted from a SourceSnapshot."
        - "InterpretationCandidate: adaptive LLM/memory-agent proposed meaning with evidence_refs, confidence, uncertainty, assumptions, alternatives, use_pattern, and review_status."
        - "MemoryCandidate: governed memory proposal derived from an interpretation and ready for type/freshness/conflict validation."
        - "ValidatedMemory: memory item that passed hard gates and can be active, historical, or forbidden."
        - "GovernanceGate: deterministic property checks for hard invariants; not a world-understanding engine."
        - "AnswerEvidence: cited proof chain from memory to snapshots and answer state."
      feedback_policy: "Future verifiers should keep exact named errors for hard invariant failures, but accept multiple source-backed interpretation claims when they satisfy the interpretation contract. Ambiguous or low-confidence interpretations should route to review rather than force one exact expected answer."
      test_strategy:
        - "Preserve existing T1 and M1 verifier commands as regression gates."
        - "First repair global specs by aligning enterprise target expectations with InterpretationCandidate."
        - "Then extend T1 memory contracts with interpretation-specific hard invariants: evidence refs, confidence, uncertainty, known use pattern, and safe review_status."
        - "Keep M1's T2.7 as the first executable interpretation gate, then add negative cases for missing uncertainty, missing confidence, unknown use_pattern, and unsafe review_status."
        - "Add at least one future fixture where two interpretation phrasings are accepted if both satisfy the same evidence/use-pattern contract."
      module_map:
        preserve:
          - "scripts/verify-memory-contracts.mjs"
          - "identity-vault/90_evals/cases/memory-contracts/**"
          - "scripts/verify-m1-hindsight-promotion-recall-fixture.mjs"
          - "identity-vault/90_evals/cases/m1-hindsight-promotion-recall/**"
          - "scripts/verify-supermemory-specs.mjs"
        migrate_next:
          - "identity-vault/90_evals/cases/enterprise-living-memory-complete/expected/assertions.json"
          - "identity-vault/90_evals/cases/enterprise-living-memory-complete/expected/final-state.md"
          - "scripts/verify-enterprise-living-memory-target.mjs"
          - "docs/golden-case-tdd-matrix.md"
          - "docs/golden-case-implementation-roadmap.md"
          - "docs/prd-memoire-agentique-v2.md"
          - "README.md"
        documentation_artifact:
          - "docs/llm-first-migration-plan.md"
      interface_contract:
        proposed_flow: "Source -> SourceSnapshot -> Observation -> InterpretationCandidate -> MemoryCandidate -> ValidatedMemory -> Relation -> HindsightDocument / Retrieval -> Answer -> Feedback / Change"
        interpretation_candidate_required_fields:
          - "interpretation_id"
          - "proposed_from"
          - "claim"
          - "confidence"
          - "uncertainty"
          - "assumptions"
          - "alternative_interpretations"
          - "use_pattern"
          - "review_status"
          - "evidence_refs"
        hard_rejections:
          - "missing evidence refs or proposed_from"
          - "missing confidence"
          - "missing uncertainty"
          - "unknown use_pattern"
          - "active promotion from needs_review or rejected interpretation"
          - "promotion missing interpretation provenance"
        flexible_fields:
          - "claim wording"
          - "alternative interpretation wording"
          - "assumption wording, when evidence/use-pattern/review constraints remain satisfied"
      architecture_review: "Approved for documentation-only migration planning. The current user changes are a valid partial migration, not a parallel architecture. The next implementation tranche should first restore global specs, then generalize interpretation gates into T1, then update roadmap/PRD docs."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none; future policy effects are limited to existing access/freshness gates"
        api_contract: "none; local fixture/verifier contract only"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none"
        deploy_rollback: "none"
        observability: "local PASS/FAIL verifier output and GoalBuddy receipts"
        docs: "write one migration plan doc plus GoalBuddy receipts only"
      docs_worker:
        objective: "Write docs/llm-first-migration-plan.md as the precise migration plan, grounded in T001 evidence and this Judge decision."
        allowed_files:
          - "docs/llm-first-migration-plan.md"
