        - "Generalize T1 with interpretation invariants before further M1 hardening."
        - "Keep M1 as the first executable LLM-first vertical slice."
        - "Relax exact wording only after hard property checks exist."
      commands:
        - cmd: "git diff --check"
          status: pass
        - cmd: "node /Users/arnaud/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.7/skills/goalbuddy/scripts/goalbuddy-quality-check.mjs docs/goals/audit-llm-first-supermemory-migration/state.yaml"
