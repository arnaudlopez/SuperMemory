version: 2
goal:
  slug: audit-llm-first-supermemory-migration
  title: Audit LLM-First SuperMemory Migration
  status: done
  created_at: "2026-05-21"
  updated_at: "2026-05-21"
  original_request: "Use GoalBuddy goal-prep to prepare an audit/proposal board for making SuperMemory less over-programmatic and more LLM-first, accounting for all existing work and memory, not only M1."
  interpreted_outcome: "Produce a repository-grounded migration plan that shifts SuperMemory toward LLM-first interpretation while preserving deterministic governance invariants and the already-developed T1/M1/global verification work."
  input_shape: audit
  audience: "SuperMemory implementers and Arnaud"
  authority: approved
  proof_type: artifact
  completion_proof: "A final audit receipt points to a precise migration plan covering files to modify later, order of migration, risks, tests to preserve or add, and confirms no unauthorized product-code/script/fixture/test edits occurred."
  goal_oracle: "A precise migration plan exists that a later implementation goal can execute without rediscovering the architecture, and it explicitly accounts for T1, M1, global verification wiring, governance docs, eval fixtures, GoalBuddy boards, and recent memory-backed decisions."
  intake:
    completion_proof: "Plan of migration, not implementation: exact future file areas, preserved invariants, LLM-first contract proposal, verification strategy, migration order, risks, and exclusions."
  oracle:
    signal: "Repository-grounded migration plan exists and final audit confirms full_outcome_complete: true."
    cadence: "after Scout evidence, after Judge decision, after optional docs Worker, and at final audit"
    final_proof: "Final Judge receipt maps audit evidence and any documentation changes to the owner outcome and confirms no unauthorized artifact classes were edited."
  likely_misfire: "Producing a philosophical LLM-first essay or parallel architecture instead of a migration plan grounded in all existing SuperMemory development and memory-backed decisions."
  non_goals:
    - "No implementation script changes."
    - "No fixture or expected-output changes."
    - "No test changes."
    - "No runtime, product, connector, engine, or Hindsight adapter changes."
    - "No replacement of T1 or M1 with a parallel architecture."
    - "No broad rewrite of the vault."
  constraints:
    - "Read repository and project-memory evidence before proposing changes."
    - "Account for all existing development, not only M1."
    - "Preserve deterministic checks for hard invariants: provenance, status, access, freshness, do_not_use, confirmation, and evidence."
    - "Make interpretation and unknown-case handling LLM-first where appropriate."
    - "Documentation edits are allowed only when they clarify the audit findings or migration plan."
  existing_plan_facts:
    - "The user selected Audit then proposition."
    - "Success proof is a precise migration plan."
    - "Docs edits are allowed; scripts, fixtures, tests, and product logic are out of scope."
    - "A fresh GoalBuddy board was requested."
