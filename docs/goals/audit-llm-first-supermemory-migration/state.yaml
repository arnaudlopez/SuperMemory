      - "Project brief and memory facts from the active conversation context"
    constraints:
      - "Read-only."
      - "Do not edit files."
      - "Do not inspect external sources or connectors."
      - "Treat uncommitted work as existing work to preserve unless evidence proves otherwise."
      - "Prefer file-path evidence and memory-backed decisions over generic architecture opinions."
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "Inventory of already-developed artifacts: T1, M1, global verification, governance docs, eval fixtures, GoalBuddy boards, and relevant logs."
      - "Chronology of relevant memory-backed decisions."
      - "Classification: invariants to preserve, too-deterministic areas to soften, already-LLM-first areas to strengthen."
      - "Initial module_map of docs, fixtures, scripts, tests, and governance surfaces involved."
      - "Risks and blind spots for migration."
    receipt:
      result: done
      note: "notes/T001-existing-work-inventory.md"
      summary: "Inventory complete. T1 and M1 are shipped on main; the current dirty worktree has already begun an LLM-first migration by adding InterpretationCandidate to governance docs, M1 fixtures, and the M1 verifier. T1 and M1 verifiers pass, but global specs are red because the enterprise target still asserts the old Observation -> MemoryCandidate lifecycle text."
      evidence:
        - "git log: 619991f, 8410b92, 165f24f, 5c63ade"
        - "identity-vault/75_governance/interpretation_contract.md"
        - "identity-vault/75_governance/sequential_relational_model.md"
