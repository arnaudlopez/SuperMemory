tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Inventory the complete existing SuperMemory work and memory-backed decisions relevant to a LLM-first migration."
    inputs:
      - "README.md"
      - "docs/"
      - "docs/goals/"
      - "identity-vault/70_agent_contracts/"
      - "identity-vault/75_governance/"
      - "identity-vault/90_evals/"
      - "scripts/"
      - "tests/"
