      design_delta: "The migration plan shifts the architecture from direct Observation -> MemoryCandidate/ValidatedMemory fixture thinking to Observation -> InterpretationCandidate -> MemoryCandidate/ValidatedMemory, while preserving deterministic hard-invariant gates for provenance, access, freshness, status, do_not_use, and answer evidence."
      key_points:
