      decision: approved
      full_outcome_complete: false
      architecture_review: "Approved. Implement a deterministic local T11 contract and evidence log, not runtime Graphiti/Memoria integration or dependency installation."
      design_concept: "SuperMemory keeps LLM-first living-memory governance while engine integrations remain optional ports. Passing native evals produce explicit not_activated records; failing evals create candidate_port evidence; governance ownership violations produce rejected_port."
      interface_contract:
        T11_1: "Graphiti decision is not_activated when Hindsight temporal eval result is pass."
        T11_2: "Memoria decision is not_activated when vault snapshots/logs satisfy rollback and audit."
        T11_3: "A red temporal eval creates candidate_port with candidate, failing eval id, justification, and preserved SuperMemory contract."
        T11_4: "A port requiring ownership of permissions, source freshness, revocation, or agent contracts is rejected."
      test_strategy:
        red: "Wire node scripts/verify-engine-port-evals.mjs into global specs before the verifier exists, proving the missing T11 oracle fails."
        green: "Add fixture, JSONL log, verifier, Node test, and docs for valid and invalid engine-port decisions."
      feedback_policy: "Check activation governance shape and evidence, not exact prose wording."
      impact_assessment_ref: "T001 receipt impact_assessment"

