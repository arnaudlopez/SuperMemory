version: 2

goal:
  title: "T11 Engine Port Evals"
  slug: "implement-engine-port-evals-t11"
  kind: specific
  tranche: "Implement an executable contract proving that Graphiti and Memoria remain governed optional ports."
  status: complete
  oracle:
    signal: "A T11 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves engine ports remain governed optional ports while T0-T10 remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T11 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit SHA, pushed branch origin/main, and final audit full_outcome_complete true."
  intake:
    original_request: "ok go"
    interpreted_outcome: "Continue with T11 engine port evals."
    input_shape: specific
    audience: "SuperMemory maintainers and future memory-engine integrations"
    authority: requested
    proof_type: test
    completion_proof: "A T11 fixture/verifier proves governed not_activated, candidate_port, and rejected_port decisions; global specs pass; and the work is committed and pushed."
    likely_misfire: "Installing or designing runtime Graphiti/Memoria integrations instead of proving activation governance."
    blind_spots_considered:
      - "Graphiti must remain not_activated while Hindsight passes current temporal evals."
      - "Memoria must remain not_activated while vault snapshots/logs cover rollback and audit."
      - "A red temporal eval should create a candidate port, not immediate activation."
      - "A port cannot own permissions, revocation, freshness, or agent contracts."
    existing_plan_facts:
      - "docs/golden-case-tdd-matrix.md defines T11.1-T11.4."
      - "docs/golden-case-implementation-roadmap.md requires engine_port_evals.jsonl and not_activated Graphiti/Memoria decisions."
      - "identity-vault/75_governance/memory_engine_ports.md owns the engine-port policy."
      - "identity-vault/90_evals/cases/enterprise-living-memory-complete already expects engine_port_evals.jsonl references."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: null
    command: "npx --yes goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-engine-port-evals-t11"

active_task: null

