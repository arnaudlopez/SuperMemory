          - scripts/verify-hindsight-capture-refresh-sync.mjs
      interface_contract: "The verifier must reject missing connector metadata, broad/all-vault scope, candidates for unregistered sources, candidates without hash/version/unavailable result, and do_not_use sources producing active candidates."
      test_strategy: "Use existing red test wrapper as T003 evidence; green stage adds fixture, verifier, and global spec wiring."
