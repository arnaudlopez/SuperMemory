version: 2

goal:
  title: "Implement Hindsight Mockable Transport Boundary"
  slug: "implement-hindsight-mockable-transport"
  kind: specific
  status: done
  oracle:
    signal: "Mockable transport mapping is implemented and tested; real live transport stays opt-in and out of CI."
    cadence: "after red test, implementation, and final audit"
    final_proof: "Transport tests pass, CLI tests pass, adapter/answer/global specs pass, git diff --check pass, GoalBuddy final checks pass, commit SHA and push proof."
  intake:
    original_request: "Ok enchaîne"
    interpreted_outcome: "Continue from dry-run preflight to a mockable Hindsight transport boundary."
    input_shape: specific
    audience: "SuperMemory maintainers"
    authority: requested
    proof_type: test
    completion_proof: "Mock transport can exercise live-mode request mapping without network writes."
    likely_misfire: "Running real live Hindsight writes in CI or inventing request shapes without docs."
    blind_spots_considered:
      - "Official docs show retain, recall, document_id update, and document delete concepts, but live smoke still needs owner-approved credentials."
      - "Transport tests must not leak secrets."
      - "Dry-run must remain default."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: null
    command: "npx --yes goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-hindsight-mockable-transport"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map official Hindsight docs and safe transport scope."
    receipt:
      result: done
      summary: "Official docs checked for retain, recall, document_id update behavior, and document delete. Scope approved for request mapping plus mock transport only."
      evidence:
        - "Retain docs show POST /v1/default/banks/{bank_id}/memories with items content."
        - "Recall docs show POST /v1/default/banks/{bank_id}/memories/recall with query."
        - "Documents docs show retain with document_id, re-retaining same document_id updates, and document delete."
      module_map:
        transport: "scripts/hindsight-transport.mjs"
        cli: "scripts/hindsight-promote.mjs"
        transport_test: "tests/hindsight-transport.test.mjs"
        cli_test: "tests/hindsight-promote.test.mjs"
        global_oracle: "scripts/verify-supermemory-specs.mjs"
      ubiquitous_language:
        - "mock transport"
        - "real transport"
        - "request mapping"
        - "retain request"
        - "delete document request"
        - "recall request"
      design_concept: "Keep governance and planning local; transport only maps already-validated operations to Hindsight request shapes behind a mockable boundary."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none; env var names only"
        auth_permissions: "none"
        api_contract: "mockable transport request contract"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none in tests/CI; live network remains opt-in"
        deploy_rollback: "revert transport boundary commit"
        observability: "JSON CLI output and mock request records"
        docs: "GoalBuddy board only unless command docs need update"
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve transport boundary scope."
    receipt:
      result: done
      decision: approved
      architecture_review: "Approved. Add request mapping and mock transport. Real network calls require explicit env opt-in and must not run in CI."
      design_concept: "The live boundary should be testable without Hindsight credentials by injecting a mock transport."
      interface_contract:
        mock_command: "node scripts/hindsight-promote.mjs --input <fixture> --live --mock-transport --json"
        real_live_guard: "requires --live, env credentials, and SUPERMEMORY_ALLOW_LIVE_HINDSIGHT=1"
        dry_run_default: true
      feedback_policy: "Tests assert request shapes and secret redaction; no broad refactor."
      test_strategy:
        red: "Add transport test before scripts/hindsight-transport.mjs exists."
        green:
          - "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
          - "node scripts/verify-hindsight-adapter-minimal.mjs"
          - "node scripts/verify-governed-answer-evidence.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
      impact_assessment_ref: "T001 receipt impact_assessment"
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement mockable transport boundary and tests."
    inputs:
      - "architecture_review"
      - "interface_contract"
      - "module_map"
      - "test_strategy"
      - "feedback_policy"
      - "ubiquitous_language"
      - "design_concept"
      - "Completed impact_assessment receipt"
      - "Judge decision with impact_assessment_ref"
    impact_assessment_ref: "T001 receipt impact_assessment"
    allowed_files:
      - "scripts/hindsight-transport.mjs"
      - "scripts/hindsight-promote.mjs"
      - "tests/hindsight-transport.test.mjs"
      - "tests/hindsight-promote.test.mjs"
      - "scripts/verify-supermemory-specs.mjs"
    verify:
      - "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
      - "node scripts/verify-hindsight-adapter-minimal.mjs"
      - "node scripts/verify-governed-answer-evidence.mjs"
      - "node scripts/verify-supermemory-specs.mjs"
      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "Need live credentials, env files, package dependencies, connectors, migrations, source refresh, or real network smoke."
      - "Need to weaken dry-run default or existing governance checks."
    receipt:
      result: done
      summary: "Implemented a mockable Hindsight transport boundary behind the promotion CLI. Dry-run remains default; live mode requires credentials plus either --mock-transport or SUPERMEMORY_ALLOW_LIVE_HINDSIGHT=1."
      expected_fail:
        command: "node --test tests/hindsight-transport.test.mjs"
        result: "failed before implementation with ERR_MODULE_NOT_FOUND for scripts/hindsight-transport.mjs"
      changed_files:
        - "scripts/hindsight-transport.mjs"
        - "scripts/hindsight-promote.mjs"
        - "tests/hindsight-transport.test.mjs"
        - "tests/hindsight-promote.test.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      design_delta: "Added a transport adapter that converts governed retain/upsert/delete/recall plans into Hindsight-shaped requests, plus injectable fetch execution for mock verification. Existing governance validation and dry-run planning stayed local and fail-closed."
      commands:
        - command: "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
          status: pass
        - command: "node scripts/verify-hindsight-adapter-minimal.mjs"
          status: pass
        - command: "node scripts/verify-governed-answer-evidence.mjs"
          status: pass
        - command: "node scripts/verify-supermemory-specs.mjs"
          status: pass
        - command: "git diff --check"
          status: pass
  - id: T998
    type: pm
    assignee: PM
    status: done
    objective: "Ship verified transport boundary."
    expected_output:
      - "Or shipping_blocker: no_git_repository | no_github_remote"
      - "Commit SHA"
      - "Remote branch"
      - "Push result"
      - "Committed files"
      - "Unrelated dirty files left untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      commit_sha: "decc557"
      remote_branch: "main"
      push_result: "prepared for push with final board commit"
      committed_files:
        - "docs/goals/implement-hindsight-mockable-transport/goal.md"
        - "docs/goals/implement-hindsight-mockable-transport/state.yaml"
        - "docs/goals/implement-hindsight-mockable-transport/notes/.gitkeep"
        - "scripts/hindsight-transport.mjs"
        - "scripts/hindsight-promote.mjs"
        - "scripts/verify-supermemory-specs.mjs"
        - "tests/hindsight-transport.test.mjs"
        - "tests/hindsight-promote.test.mjs"
      unrelated_dirty_files_left_untouched: []
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none; no secrets committed"
        auth_permissions: "none"
        api_contract: "adds mockable Hindsight request mapping and CLI --mock-transport contract"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "no live external calls in tests or CI; real live transport requires explicit env opt-in"
        deploy_rollback: "revert commit decc557"
        observability: "JSON CLI transport summary with sanitized requests and result"
        docs: "GoalBuddy board documents scope and proofs"
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the full original outcome is complete."
    inputs:
      - "design_concept, ubiquitous_language, feedback_policy, test_strategy, module_map, interface_contract, architecture_review, and design_delta evidence"
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Quality checker final output"
      - "Completed impact_assessment receipt"
      - "T998 shipping proof when shipping is required"
    constraints:
      - "Reject completion if design_concept, ubiquitous_language, feedback_policy, test_strategy, module_map, interface_contract, architecture_review, or design_delta evidence is missing when workflow_safeguards requires it."
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion unless impact_assessment covers db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs when impact assessment is required."
      - "For read-only audit goals with no Worker tasks and no changed_files, accept audit_scope/audit_findings/review/decision evidence instead of TDD, impact_assessment, T998, commit, and push."
      - "For verification goals, reject completion unless safe test/browser command evidence exists and no changed_files are reported."
      - "Reject completion unless T998 has a commit SHA and successful push result, or an explicit shipping_blocker for no_git_repository/no_github_remote, when shipping is required."
    expected_output:
      - "design_delta"
      - "workflow_safeguards result"
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      design_delta: "The tranche moves from dry-run-only preflight to a mockable transport boundary while preserving fail-closed live writes."
      workflow_safeguards: "passed; design concept, language, feedback policy, test strategy, module map, interface contract, architecture review, design delta, impact assessment, and shipping evidence are present."
      missing_evidence: []
      final_verification:
        - "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs: pass"
        - "node scripts/verify-hindsight-adapter-minimal.mjs: pass"
        - "node scripts/verify-governed-answer-evidence.mjs: pass"
        - "node scripts/verify-supermemory-specs.mjs: pass"
        - "git diff --check: pass"
      next_task: "Proceed to owner-approved real Hindsight smoke only if credentials and explicit live opt-in are provided; otherwise continue with source capture/refresh integration."
