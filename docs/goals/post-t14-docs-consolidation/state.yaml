version: 2

goal:
  title: "Post-T14 Docs Consolidation"
  slug: "post-t14-docs-consolidation"
  kind: specific
  status: active
  oracle:
    signal: "Stale post-T14 docs are corrected while node scripts/verify-supermemory-specs.mjs and git diff --check pass."
    cadence: "after edits and final audit"
    final_proof: "Docs updated, global specs pass, git diff --check pass, GoalBuddy final checks pass, commit SHA and push proof recorded."
  intake:
    original_request: "Ok go"
    interpreted_outcome: "Execute the Post-T14 Docs Consolidation recommended by the release-readiness audit."
    input_shape: specific
    audience: "SuperMemory maintainers"
    authority: requested
    proof_type: artifact
    completion_proof: "Target docs reflect post-T14 reality without touching runtime or weakening verification."
    likely_misfire: "Starting runtime work or broad refactors instead of removing stale documentation assumptions."
    blind_spots_considered:
      - "LLM-first migration plan may describe already-completed work as future work."
      - "README roadmap may still point toward the enterprise Golden Case even though T12-T14 are complete."
      - "PRD promptfoo wording should match T14 optional-reporting decision."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

goal_policy:
  mode: docs
  requires_tdd: false
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: null
    command: "npx --yes goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/post-t14-docs-consolidation"

active_task: T998

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map stale documentation surfaces and safe docs-only edit scope."
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "module_map"
      - "ubiquitous_language"
      - "design_concept"
      - "stale_findings"
      - "impact_assessment"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Mapped stale post-T14 docs and confirmed the safe scope is limited to docs/llm-first-migration-plan.md, README.md, and docs/prd-memoire-agentique-v2.md."
      evidence:
        - "docs/llm-first-migration-plan.md described current uncommitted work and formerly failing specs."
        - "README.md roadmap still pointed toward enterprise living-memory expansion after T12-T14 were already complete."
        - "docs/prd-memoire-agentique-v2.md still framed promptfoo as a broad open question instead of optional reporting."
      module_map:
        migration_record: "docs/llm-first-migration-plan.md"
        project_status: "README.md"
        product_requirements: "docs/prd-memoire-agentique-v2.md"
        release_audit: "docs/release-readiness-consolidation-audit.md"
        global_oracle: "scripts/verify-supermemory-specs.mjs"
      ubiquitous_language:
        - "post-T14"
        - "executable specification"
        - "runtime preflight"
        - "optional reporting"
        - "vault-to-Hindsight promotion"
      design_concept: "Docs should distinguish completed executable specification work from future runtime integration work."
      stale_findings:
        - "LLM-first plan needed conversion from future migration plan to completed migration record."
        - "README roadmap needed a post-T14 runtime path and fixed numbering."
        - "PRD promptfoo wording needed to match the T14 optional-reporting decision."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "none; docs-only consolidation"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none"
        deploy_rollback: "revert the docs consolidation commit"
        observability: "docs clarity and existing local verifier output"
        docs: "updates LLM-first migration plan, README roadmap, and PRD promptfoo wording"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: medium
    objective: "Approve docs-only consolidation shape."
    expected_output:
      - "decision"
      - "architecture_review"
      - "interface_contract"
      - "feedback_policy"
      - "test_strategy"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      architecture_review: "Approved. Keep this docs-only and avoid runtime, verifier, fixture, or dependency changes."
      design_concept: "Make post-T14 docs describe the current executable spec and the next runtime preflight without reopening completed Golden Case tranches."
      interface_contract:
        update_llm_first_plan: "Convert from migration plan to migration record plus runtime implications."
        update_readme: "Replace stale roadmap with post-T14 runtime path."
        update_prd: "Frame promptfoo as optional reporting rather than required runner or blocker."
      feedback_policy: "Prefer small wording corrections backed by current files over broad PRD rewrites."
      test_strategy:
        - "node scripts/verify-supermemory-specs.mjs"
        - "git diff --check"
      impact_assessment_ref: "T001 receipt impact_assessment"
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Update stale post-T14 documentation language."
    inputs:
      - "architecture_review"
      - "interface_contract"
      - "module_map"
      - "test_strategy"
      - "feedback_policy"
      - "ubiquitous_language"
      - "design_concept"
      - "Completed impact_assessment receipt"
      - "Judge decision with impact_assessment_ref"
    impact_assessment_ref: "T001 receipt impact_assessment"
    allowed_files:
      - "docs/llm-first-migration-plan.md"
      - "README.md"
      - "docs/prd-memoire-agentique-v2.md"
    verify:
      - "node scripts/verify-supermemory-specs.mjs"
      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "Need to alter scripts, tests, fixtures, runtime code, dependencies, or external service configuration."
      - "Need broader PRD rewrite beyond stale post-T14 planning language."
    receipt:
      result: done
      summary: "Updated post-T14 docs language without touching scripts, tests, fixtures, runtime code, dependencies, or external services."
      changed_files:
        - "docs/llm-first-migration-plan.md"
        - "README.md"
        - "docs/prd-memoire-agentique-v2.md"
      design_delta: "The LLM-first plan is now a completed migration record with runtime implications; README points to runtime preflight instead of Golden Case expansion; PRD makes promptfoo optional reporting."
      commands:
        -
          command: "node scripts/verify-supermemory-specs.mjs"
          status: pass
        -
          command: "git diff --check"
          status: pass
  - id: T998
    type: pm
    assignee: PM
    status: queued
    objective: "Ship verified docs consolidation."
    expected_output:
      - "Or shipping_blocker: no_git_repository | no_github_remote"
      - "Commit SHA"
      - "Remote branch"
      - "Push result"
      - "Committed files"
      - "Unrelated dirty files left untouched"
  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Audit whether the full original outcome is complete."
    inputs:
      - "design_concept, ubiquitous_language, feedback_policy, test_strategy, module_map, interface_contract, architecture_review, and design_delta evidence"
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Quality checker final output"
      - "Completed impact_assessment receipt"
      - "T998 shipping proof when shipping is required"
    constraints:
      - "Reject completion if design_concept, ubiquitous_language, feedback_policy, test_strategy, module_map, interface_contract, architecture_review, or design_delta evidence is missing when workflow_safeguards requires it."
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion unless impact_assessment covers db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs when impact assessment is required."
      - "For read-only audit goals with no Worker tasks and no changed_files, accept audit_scope/audit_findings/review/decision evidence instead of TDD, impact_assessment, T998, commit, and push."
      - "For verification goals, reject completion unless safe test/browser command evidence exists and no changed_files are reported."
      - "Reject completion unless T998 has a commit SHA and successful push result, or an explicit shipping_blocker for no_git_repository/no_github_remote, when shipping is required."
    expected_output:
      - "design_delta"
      - "workflow_safeguards result"
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt: null
