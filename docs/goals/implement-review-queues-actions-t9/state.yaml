version: 2

goal:
  title: "T9 Review Queues And External Actions"
  slug: "implement-review-queues-actions-t9"
  kind: specific
  tranche: "Implement an executable contract proving that staleness, conflicts, type proposals, permission ambiguity, and external sends open review or confirmation queues."
  status: done
  oracle:
    signal: "A T9 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves review queues/actions while T0-T8 remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T9 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit_sha e78c38236086f9e7df0474a596553a22a7277dde, pushed branch origin/main, and final audit full_outcome_complete true."
  intake:
    original_request: "go"
    interpreted_outcome: "Continue with T9 review queues and external actions."
    input_shape: specific
    audience: "SuperMemory maintainers and future memory agents"
    authority: requested
    proof_type: test
    completion_proof: "A T9 fixture/verifier proves critical ambiguity opens review/confirmation queues, global specs pass, and the work is committed and pushed."
    likely_misfire: "Letting changed/conflicting/restricted/type/action ambiguity produce a confident answer or external send without a queue item."
    blind_spots_considered:
      - "Stale or changed derived memory must open staleness_queue with owner/blocker."
      - "Unresolved source conflict must open conflict_queue."
      - "New type proposals must open type_queue."
      - "Restricted-field ambiguity must open permission_queue."
      - "External email send must open action_confirmation_queue and remain unexecuted."
    existing_plan_facts:
      - "docs/golden-case-tdd-matrix.md defines T9.1-T9.5."
      - "docs/golden-case-implementation-roadmap.md defines T9 queues and oracle."
      - "identity-vault/75_governance/answer_policy.md states external actions require confirmation."
      - "identity-vault/75_governance/conflict_arbitration.md requires review before incompatible external action."
      - "identity-vault/75_governance/use_patterns.md defines external draft and external system update confirmation needs."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
