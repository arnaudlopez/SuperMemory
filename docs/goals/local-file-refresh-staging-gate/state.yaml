      - "goal.md"
      - "acceptance-contract.md"
      - "Current repository source, tests, scripts, docs, and dirty worktree status"
    constraints:
      - "Read-only."
      - "Do not edit product files."
      - "Do not start implementation."
      - "Prefer observable owner outcomes over internal task completion."
    expected_output:
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "interface_contract: public behavior and boundaries that tests should target"
      - "test_strategy: acceptance tests, unit/integration boundaries, mocks, browser or visual checks if relevant"
      - "feedback_policy: targeted test cadence, typecheck, browser checks, and full-suite timing"
      - "acceptance_contract_updates: exact end-state evidence and failure modes"
      - "dirty_worktree_risk_map: unrelated files that must stay untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Read-only Scout mapping completed for the local-file refresh staging gate. The safest design is to extend the existing local-file refresh CLI with an apply-plan staging mode that mirrors the proven local-manual-capture staging pattern while preserving refresh-specific lineage and connector evidence."
      design_concept:
        shared_understanding: "A persisted local_file refresh dry-run plan becomes reviewable staging artifacts only. The gate is an operator review bridge, not vault ingestion, memory compilation, or Hindsight promotion."
        non_goals:
          - "No direct identity-vault writes"
          - "No active memory compilation"
          - "No Hindsight promote/delete"
          - "No remote connectors, jobs, database migrations, UI, env files, or broad scans"
        decision_dependencies:
          - "Keep apply-plan staging in scripts/local-file-source-refresh.mjs unless implementation pressure proves a shared helper is needed"
          - "Stage artifacts must remain JSON-only and content-redacted"
      ubiquitous_language:
        refresh_plan: "Dry-run output generated_from local_file_source_refresh"
        staging_gate: "Validation plus review-only artifact writing into a fresh non-vault directory"
        snapshot_candidate: "Planned immutable snapshot represented by snapshots plus refresh_plans.created_snapshot_id"
        connector_evidence: "connector_runs, connector_results, refresh_candidates, and source-scoped metadata"
        review_item: "staleness_queue routing for memories derived from the previous snapshot"
        forbidden_synonyms:
          - "apply to vault"
          - promote
          - compile
          - "ingest final state"
      module_map:
        scripts/local-file-source-refresh.mjs: "Primary CLI. Already builds dry-run plans and write-plan output. Future apply-plan mode should validate saved plans and write staging artifacts."
        tests/local-file-source-refresh-cli.test.mjs: "Primary acceptance tests. Add red tests for apply-plan success, staging artifacts, invalid plan failures, raw content rejection, non-empty/vault destination refusal, and lineage preservation."
        scripts/verify-local-file-source-refresh-workflow.mjs: "Workflow smoke. Extend from dry-run/write-plan to apply-plan staging verification and leakage checks."
        scripts/local-manual-capture.mjs: "Proven staging/apply/commit pattern. Reuse concepts for resolveApplyPlanPath, resolveApplyOutDir, raw-content guard, manifest, and staging-only output, but do not copy manual-capture-specific owner_confirmed/snapshot rules blindly."
        tests/local-manual-capture-cli.test.mjs: "Reference coverage for apply-plan and vault destination refusal."
        scripts/verify-source-refresh-connector-boundary.mjs: "Regression guard for connector-scoped refresh evidence."
        scripts/verify-source-snapshot-refresh-preflight.mjs: "Regression guard for changed/unchanged/unavailable/do_not_use semantics."
        scripts/verify-supermemory-specs.mjs: "Full local verifier wiring."
        README.md and docs/golden-case-implementation-roadmap.md: "Operator docs and tranche roadmap should document the new refresh staging step after code is green."
      interface_contract:
        cli: "node scripts/local-file-source-refresh.mjs --apply-plan <plan.json> --out-dir <staging-dir> [--json]"
        mode_behavior: "When --apply-plan is present, the command does not require --input or --source-id, reads exactly the saved JSON plan, validates it, creates a fresh non-vault staging directory, writes review artifacts, and returns a JSON result with mode apply-plan, generated_from local_file_source_refresh, staging_only true, network_writes false, vault_writes_performed false."
        staged_artifacts:
          - refresh-plan.json
          - connector-runs.json
          - connector-results.json
          - refresh-candidates.json
          - refresh-plans.json
          - snapshot-candidates.json
          - review-items.json
          - manifest.json
        failure_codes:
          - missing_apply_plan
          - apply_plan_unreadable
          - missing_apply_out_dir
          - apply_plan_parent_missing
          - apply_plan_out_dir_is_file
          - apply_plan_out_dir_not_empty
          - apply_plan_vault_write_forbidden
          - apply_plan_invalid
          - apply_plan_contains_raw_content
          - apply_plan_malformed_lineage
      test_strategy:
        red_tests_first:
          - "Successful changed-source apply writes all expected staging artifacts and manifest"
          - "Changed-source staging preserves previous_snapshot_id, connector_result_id, created_snapshot_id, and needs_review memory routing"
          - "Unavailable and do_not_use plans stage without new snapshot candidates or promotion payloads"
          - "Apply refuses plans with validation errors, malformed lineage, non-empty promotion_payloads, raw-content-like fields, non-empty out dir, and identity-vault destinations"
          - "Stdout, stderr, and staged artifacts do not leak forbidden source text, prompt-injection text, or secret-like snippets"
        regression_commands:
          - "node --test tests/local-file-source-refresh-cli.test.mjs"
          - "node scripts/verify-local-file-source-refresh-workflow.mjs"
          - "node scripts/verify-source-refresh-connector-boundary.mjs"
          - "node scripts/verify-source-snapshot-refresh-preflight.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
      feedback_policy: "Use a TDD loop: write the apply-plan tests first and confirm they fail for missing behavior, implement only the approved slice, then run the targeted CLI test and workflow smoke before the full oracle."
      acceptance_contract_updates:
        visible_outcome: "A maintainer can run local-file-source-refresh --apply-plan against a saved refresh plan and inspect a fresh staging directory containing only redacted, reviewable refresh artifacts and manifest."
        main_path: "Changed local_file refresh plan stages connector evidence, refresh plan, snapshot candidate, review item, and manifest without vault writes."
        edge_cases:
          - "unchanged plan"
          - "unavailable source"
          - "do_not_use source"
        failure_modes:
          - "invalid saved plan"
          - "raw content field"
          - "malformed changed-source lineage"
          - "non-empty promotion_payloads"
          - "identity-vault destination"
          - "non-empty output directory"
          - "leakage in stdout/stderr/staged artifacts"
      dirty_worktree_risk_map:
        current_dirty_files:
          - docs/goals/local-file-refresh-staging-gate/
          - docs/local-file-refresh-staging-gate-notes.md
        risk: "Only DevLoop prep artifacts are dirty; no unrelated product files are modified yet."
        guard: "Future workers must stay within Judge-approved allowed_files and leave unrelated dirty files untouched."
      impact_assessment:
        db_schema_migrations: none
        data_backfill: none
        env_secrets: none
        auth_permissions: none
        api_contract: "local CLI contract only"
        ui_routes: none
        background_jobs: none
        external_services: none
        deploy_rollback: none
        observability: "local manifest and JSON command result only"
        docs: "README and roadmap update after implementation is green"
