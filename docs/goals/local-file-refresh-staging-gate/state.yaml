  oracle:
    signal: "Local file refresh staging gate is complete when node --test tests/local-file-source-refresh-cli.test.mjs, node scripts/verify-local-file-source-refresh-workflow.mjs, node scripts/verify-source-refresh-connector-boundary.mjs, node scripts/verify-source-snapshot-refresh-preflight.mjs, node scripts/verify-supermemory-specs.mjs, and git diff --check all pass."
