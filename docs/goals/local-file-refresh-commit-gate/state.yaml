    expected_output:
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "interface_contract: public behavior and boundaries that tests should target"
      - "test_strategy: acceptance tests, unit/integration boundaries, mocks, browser or visual checks if relevant"
      - "feedback_policy: targeted test cadence, typecheck, browser checks, and full-suite timing"
      - "acceptance_contract_updates: exact end-state evidence and failure modes"
      - "dirty_worktree_risk_map: unrelated files that must stay untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Read-only Scout mapping completed for the local-file refresh commit gate. The existing manual-capture commit path is a useful reference, but local-file refresh needs a separate changed-snapshot commit contract that updates existing source state and appends only new immutable snapshots."
      design_concept:
        shared_understanding: "A reviewed local_file refresh staging directory can be committed into final vault registries only after explicit owner confirmation. This records refreshed source/snapshot evidence; it does not compile active memory or promote to Hindsight."
        non_goals:
          - "No memory compilation"
          - "No Hindsight promotion or delete"
          - "No remote connector or broad scan"
          - "No DB migration, UI, background job, env files, or external service"
          - "No fresh commit for unavailable or do_not_use staging"
        decision_dependencies:
          - "Commit should be limited to changed-source staging with exactly one snapshot candidate for the selected source"
          - "Manual-capture commit helper concepts can be reused, but source registry handling must update existing active_snapshot_id rather than append a new source row"
      ubiquitous_language:
        refresh_staging: "Directory produced by local-file-source-refresh --apply-plan"
        commit_gate: "Owner-confirmed operation that mutates only final vault registry markdown files"
        source_registry_update: "Replace or update the existing source row active snapshot/freshness/status for the refreshed source"
        snapshot_registry_append: "Append a new immutable snapshot row and refuse duplicate snapshot ids"
        reviewed_staging: "Staging that is structurally complete, manifest-backed, content-redacted, and lineage-valid"
        forbidden_synonyms:
          - "compile memory"
          - "promote to Hindsight"
          - "run connector again"
          - "scan vault"
          - "commit unavailable as fresh"
      module_map:
        scripts/local-file-source-refresh.mjs: "Primary CLI. Needs commit-staging mode, staging reader, vault root resolver, registry row update/append helpers, and commit output."
        scripts/local-manual-capture.mjs: "Reference for owner confirmation, staging completeness checks, vault root/registry paths, markdown escaping, duplicate checks, and command output shape."
        tests/local-file-source-refresh-cli.test.mjs: "Primary acceptance tests for commit-staging success and fail-closed cases."
        scripts/verify-local-file-source-refresh-workflow.mjs: "Workflow smoke should extend dry-run -> write-plan -> apply-plan -> commit-staging against a temporary vault."
        README.md: "Operator command docs should add commit-staging for reviewed refresh staging."
        docs/golden-case-implementation-roadmap.md: "Roadmap should add the refresh commit gate tranche after 5c.3."
        scripts/verify-source-refresh-connector-boundary.mjs and scripts/verify-source-snapshot-refresh-preflight.mjs: "Regression guards for connector and refresh semantics."
        scripts/verify-supermemory-specs.mjs: "Global verifier wiring already covers local-file refresh CLI/workflow."
      interface_contract:
        cli: "node scripts/local-file-source-refresh.mjs --commit-staging <staging-dir> --vault-root <identity-vault> --owner-confirmed [--json]"
        success: "Reads refresh staging artifacts and final vault registries, updates source_registry.md for the refreshed source, appends the new snapshot to snapshot_registry.md, and returns mode commit-staging, generated_from local_file_source_refresh, vault_writes_performed true, files_written 2."
        failure_codes:
          - owner_confirmation_required
          - missing_commit_staging_dir
          - commit_staging_unreadable
          - commit_staging_incomplete
          - commit_staging_invalid
          - commit_staging_not_changed_source
          - commit_staging_raw_content
          - missing_vault_root
          - vault_root_unreadable
          - vault_registry_missing
          - vault_source_missing
          - vault_snapshot_already_exists
          - vault_registry_rules_marker_missing
        boundaries: "Do not read source original_ref, do not rerun connector, do not write any file except 00_inbox/source_registry.md and 00_inbox/snapshot_registry.md under the supplied vault root."
      test_strategy:
        red_tests_first:
          - "Successful changed-source staging commit updates existing source registry active snapshot and appends snapshot registry row"
          - "Missing owner confirmation is refused"
          - "Incomplete/tampered staging is refused"
          - "Unavailable and do_not_use staging are refused for final commit"
          - "Duplicate snapshot id is refused"
          - "Commit output and registries do not leak forbidden source text, prompt-injection text, or secret-like snippets"
        regression_commands:
          - "node --test tests/local-file-source-refresh-cli.test.mjs"
          - "node scripts/verify-local-file-source-refresh-workflow.mjs"
          - "node scripts/verify-source-refresh-connector-boundary.mjs"
          - "node scripts/verify-source-snapshot-refresh-preflight.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
      feedback_policy: "Use the same TDD cadence as the previous tranche: write red acceptance tests first, implement only the approved commit mode, run targeted CLI and workflow checks, then run the global oracle before shipping."
      acceptance_contract_updates:
        visible_outcome: "A maintainer can commit reviewed changed-source refresh staging into final vault source/snapshot registries with explicit owner confirmation."
        main_path: "Changed local_file refresh staging updates an existing source row to the new active snapshot and appends one immutable snapshot row preserving previous_snapshot_id and content hash."
        edge_cases:
          - "missing owner confirmation"
          - "duplicate snapshot id"
          - "tampered staging manifest/artifacts"
          - "unavailable staging"
          - "do_not_use staging"
        failure_modes:
          - "raw content leakage"
          - "Hindsight promotion drift"
          - "memory compilation drift"
          - "rerunning connector during commit"
          - "writing outside registry files"
      dirty_worktree_risk_map:
        current_dirty_files:
          - docs/goals/local-file-refresh-commit-gate/
          - docs/local-file-refresh-commit-gate-notes.md
        risk: "Only DevLoop prep artifacts are dirty; no unrelated product files are modified yet."
        guard: "Future workers must stay inside Judge-approved allowed_files and leave unrelated files untouched."
      impact_assessment:
        db_schema_migrations: none
        data_backfill: none
        env_secrets: none
        auth_permissions: none
        api_contract: "local CLI contract only"
        ui_routes: none
        background_jobs: none
        external_services: none
        deploy_rollback: none
        observability: "local JSON result from commit-staging and registry diff evidence"
        docs: "README and roadmap update after implementation is green"
