        data_backfill: none
        env_secrets: none
        auth_permissions: none
        api_contract: none
        ui_routes: none
        background_jobs: none
        external_services: "none; fixtures only"
        deploy_rollback: "local verifier/test/docs only; rollback by reverting commit"
        observability: none
        docs: "goal notes and possibly README/roadmap mention if needed"
