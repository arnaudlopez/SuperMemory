      result: done
      summary: "Mapped the existing source freshness and Hindsight promotion surfaces. Current T5 proves post-change invariants, but there is no dedicated refresh preflight fixture/verifier that compares previous snapshots to refresh candidates and emits unchanged/changed/unavailable/do_not_use plans before downstream review/promotion."
      design_concept: "Add a local deterministic source snapshot refresh preflight. It consumes fixture data only, performs no connector/network work, and outputs/validates a refresh plan that can later feed T5 source-change and Hindsight promotion paths."
      ubiquitous_language:
        source_refresh_candidate: "A simulated fresh capture/check result for a mutable source."
        refresh_plan: "Deterministic plan saying unchanged, create_snapshot, unavailable_last_known, or skip_do_not_use."
        unchanged: "Candidate hash/version matches active snapshot; update last_checked metadata only, no new snapshot."
        changed: "Candidate differs; plan a new immutable snapshot with previous_snapshot_id and affected memory review routing."
        unavailable: "Source could not be fetched; preserve last-known snapshot and do not mark fresh."
        do_not_use: "Forbidden source state; no active refresh, promotion, or recall path."
      module_map:
        existing_t5: "scripts/verify-source-change-t0-t1.mjs plus identity-vault/90_evals/cases/source-change-t0-t1 prove post-change state."
        hindsight_preflight: "scripts/hindsight-promote.mjs and tests/hindsight-promote.test.mjs prove promotion planning/live guards."
        new_contract_candidate: "identity-vault/90_evals/cases/source-snapshot-refresh-preflight plus scripts/verify-source-snapshot-refresh-preflight.mjs and tests/source-snapshot-refresh-preflight.test.mjs."
      interface_contract: "A verifier command should fail on missing changed snapshot lineage, unchanged sources creating snapshots, unavailable sources marked fresh, forbidden sources producing active refresh/promotion, and missing review routing for changed derived memory."
      test_strategy: "TDD: first add fixture/verifier/test wiring that fails because verifier is missing; then implement minimal deterministic verifier and fixture; finally wire into global specs if green."
      feedback_policy: "Run node --test tests/source-snapshot-refresh-preflight.test.mjs, node scripts/verify-source-change-t0-t1.mjs, node --test tests/hindsight-promote.test.mjs, node scripts/verify-supermemory-specs.mjs, and git diff --check."
      acceptance_contract_updates:
        visible_outcome: "A maintainer can run node scripts/verify-source-snapshot-refresh-preflight.mjs and see PASS for a deterministic refresh preflight contract."
        failure_modes:
          - "unchanged source creates a new snapshot"
          - "changed source lacks previous_snapshot_id"
          - "changed memory stays active/fresh before review"
          - "unavailable source is treated as fresh"
          - "do_not_use source produces active refresh or promotion"
          - "global specs regress"
      dirty_worktree_risk_map:
