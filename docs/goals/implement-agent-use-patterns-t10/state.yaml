version: 2

goal:
  title: "T10 Agent Use Patterns"
  slug: "implement-agent-use-patterns-t10"
  kind: specific
  tranche: "Implement an executable contract proving that enterprise agent requests map to reusable use patterns instead of bespoke workflows."
  status: done
  oracle:
    signal: "A T10 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves all six use patterns while T0-T9 remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T10 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit_sha d94ba9a, pushed branch origin/main, and final audit full_outcome_complete true."
  intake:
    original_request: "go"
    interpreted_outcome: "Continue with T10 agent use patterns."
    input_shape: specific
    audience: "SuperMemory maintainers and future memory agents"
    authority: requested
    proof_type: test
    completion_proof: "A T10 fixture/verifier proves six reusable use patterns and rejects bespoke workflows, global specs pass, and the work is committed and pushed."
    likely_misfire: "Implementing runtime agents or one-off workflows instead of proving reusable pattern routing."
    blind_spots_considered:
      - "Email drafting must remain draft-only and use email-safe filters."
      - "PRD refresh must route through internal_draft with review evidence."
      - "Decision support must cite snapshots."
      - "Strategic analysis with a new business type must cite experimental status."
      - "Audit/proof must include relation chain and snapshots."
      - "External system update must require confirmation and remain unexecuted."
    existing_plan_facts:
      - "docs/golden-case-tdd-matrix.md defines T10.1-T10.6."
      - "docs/golden-case-implementation-roadmap.md requires known use patterns and no bespoke workflow."
      - "identity-vault/75_governance/use_patterns.md owns the reusable pattern vocabulary."
      - "T9 already proves external action confirmation queue behavior."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: null
    command: "npx goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-agent-use-patterns-t10"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map T10 source documents and insertion point."
    receipt:
      result: done
      summary: "T10 target found in roadmap/matrix. Existing use_patterns, interpretation governance, and agent guidance define the reusable-pattern contract."
      evidence:
        - "docs/golden-case-tdd-matrix.md defines node scripts/verify-agent-use-patterns.mjs and T10.1-T10.6."
        - "docs/golden-case-implementation-roadmap.md requires every Golden Case enterprise request to attach to an existing use pattern."
        - "identity-vault/75_governance/use_patterns.md defines external_draft, internal_draft, decision_support, strategic_analysis, audit_and_proof, and external_system_update."
        - "identity-vault/75_governance/interpretation_contract.md requires known use pattern before interpretation can advance."
      module_map:
        new_case: "identity-vault/90_evals/cases/agent-use-patterns"
        new_verifier: "scripts/verify-agent-use-patterns.mjs"
        new_test: "tests/agent-use-patterns.test.mjs"
        global_oracle: "scripts/verify-supermemory-specs.mjs"
      ubiquitous_language:
        - "external_draft"
        - "internal_draft"
        - "decision_support"
        - "strategic_analysis"
        - "audit_and_proof"
        - "external_system_update"
        - "bespoke workflow"
        - "evidence_refs"
        - "review gate"
        - "confirmation gate"
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "local verifier contract only"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none; external actions remain fixture-only and unexecuted"
        deploy_rollback: "revert fixture/script/test/docs changes"
        observability: "fixture assertions for pattern routing and rejection"
        docs: "update use pattern docs after green behavior"

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve T10 architecture and selected Worker slice."
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      architecture_review: "Approved. Implement a deterministic local T10 contract, not runtime agent orchestration or an exhaustive workflow catalog."
      design_concept: "Agents can interpret unfamiliar enterprise requests LLM-first, but the governance layer routes them through a small known pattern vocabulary with evidence, filters, snapshots, review gates, or confirmation gates."
      interface_contract:
        external_draft: "Launch-readiness email maps to external_draft with email-safe filters and no send execution."
        internal_draft: "Stale PRD refresh maps to internal_draft with staleness review gate."
        decision_support: "Risk/trust API field question maps to decision_support and cites snapshots."
        strategic_analysis: "Marketing strategy request maps to strategic_analysis and cites experimental type status."
        audit_and_proof: "What-changed audit maps to audit_and_proof and includes relation chain plus snapshots."
        external_system_update: "Email send maps to external_system_update and requires confirmation while remaining unexecuted."
        rejects: "Unknown or bespoke patterns are rejected."
      test_strategy:
        red: "Global spec wiring failed on missing scripts/verify-agent-use-patterns.mjs before implementation."
        green: "Implement fixture/verifier/test for valid patterns and invalid missing gate/unknown pattern cases."
      feedback_policy: "Check pattern assignment shape and gates, not exact natural-language wording."
      impact_assessment_ref: "T001 receipt impact_assessment"

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement T10 agent use pattern fixture, verifier, Node test, and global spec wiring."
    impact_assessment_ref: "T001 receipt impact_assessment"
    allowed_files:
      - "identity-vault/90_evals/cases/agent-use-patterns/input/fixture.json"
      - "identity-vault/90_evals/cases/agent-use-patterns/expected/assertions.json"
      - "identity-vault/90_evals/cases/agent-use-patterns/expected/answer-evidence.json"
      - "identity-vault/90_evals/cases/agent-use-patterns/actual/README.md"
      - "scripts/verify-agent-use-patterns.mjs"
      - "tests/agent-use-patterns.test.mjs"
      - "scripts/verify-supermemory-specs.mjs"
    verify:
      - "node scripts/verify-agent-use-patterns.mjs"
      - "node --test tests/agent-use-patterns.test.mjs"
      - "node scripts/verify-supermemory-specs.mjs"
      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "Need files outside allowed_files before T003 is complete."
      - "Implementation would weaken T0-T9 or global specs."
      - "Behavior becomes runtime agent orchestration or workflow catalog generation instead of deterministic contract checks."
    receipt:
      result: done
      summary: "Implemented the T10 deterministic local contract for six reusable agent use patterns and bespoke workflow rejection."
      changed_files:
        - "identity-vault/90_evals/cases/agent-use-patterns/input/fixture.json"
        - "identity-vault/90_evals/cases/agent-use-patterns/expected/assertions.json"
        - "identity-vault/90_evals/cases/agent-use-patterns/expected/answer-evidence.json"
        - "identity-vault/90_evals/cases/agent-use-patterns/actual/README.md"
        - "scripts/verify-agent-use-patterns.mjs"
        - "tests/agent-use-patterns.test.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      commands:
        - command: "node scripts/verify-agent-use-patterns.mjs"
          status: pass
        - command: "node --test tests/agent-use-patterns.test.mjs"
          status: pass
        - command: "node scripts/verify-supermemory-specs.mjs"
          status: pass
        - command: "git diff --check"
          status: pass
      red_test_evidence:
        - "expected_fail: global specs failed on missing scripts/verify-agent-use-patterns.mjs before implementation."
      green_test_evidence:
        - "green_test status: pass; node scripts/verify-agent-use-patterns.mjs"
        - "green_test status: pass; node --test tests/agent-use-patterns.test.mjs"
        - "green_test status: pass; node scripts/verify-supermemory-specs.mjs"
      contract_coverage:
        - "T10.1 external_draft email-safe filters and draft-only output."
        - "T10.2 internal_draft PRD refresh with staleness review gate."
        - "T10.3 decision_support with snapshot citation."
        - "T10.4 strategic_analysis with experimental type status."
        - "T10.5 audit_and_proof with relation chain and snapshots."
        - "T10.6 external_system_update with confirmation gate and no execution."
        - "T10.7 bespoke workflow rejected as unknown use pattern."

