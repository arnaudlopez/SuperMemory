      - "test_strategy: acceptance tests, unit/integration boundaries, mocks, browser or visual checks if relevant"
      - "feedback_policy: targeted test cadence, typecheck, browser checks, and full-suite timing"
      - "acceptance_contract_updates: exact end-state evidence and failure modes"
      - "dirty_worktree_risk_map: unrelated files that must stay untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Read-only Scout mapping completed. The safest next slice is to extend the existing Hindsight promotion CLI with an operator-reviewed plan gate that mirrors local capture/refresh plan patterns, while preserving existing direct dry-run/live behavior and keeping CI mock-only."
      design_concept:
        shared_understanding: "Direct hindsight-promote execution is useful for fixtures and smoke tests, but the operator path should require a reviewable promotion plan before applying to Hindsight. This keeps LLM-first upstream interpretation flexible while deterministic governance and human review gate promotion."
        non_goals:
          - "No broad vault scan"
          - "No arbitrary vault promotion"
          - "No source capture/refresh/compile/answer behavior changes"
          - "No committed secrets or live evidence"
          - "No Hindsight Cloud fallback by default"
          - "No live write in CI"
        decision_dependencies:
