          - "Apply must refuse tampered or invalid plans"
          - "Mock apply must be enough for CI"
          - "Live apply remains possible only with local explicit env and opt-in"
      ubiquitous_language:
        promotion_plan: "reviewable artifact generated from a validated dry-run Hindsight promotion plan"
        apply_plan: "operator action that executes an already reviewed promotion plan through mock or explicit live transport"
        reviewed_plan: "plan file whose validation passed and whose operation shape was not tampered with"
        mock_apply: "CI-safe execution through mock transport with no network writes"
        live_apply: "local Hindsight network writes, allowed only with explicit env and SUPERMEMORY_ALLOW_LIVE_HINDSIGHT=1"
      module_map:
        scripts/hindsight-promote.mjs: "Primary CLI to extend with write-plan/apply-plan while preserving direct input behavior"
        tests/hindsight-promote.test.mjs: "Primary acceptance coverage for direct mode and reviewed plan mode"
        scripts/hindsight-transport.mjs: "Existing mockable/live transport boundary"
        README.md: "Operator command docs if implementation lands"
        docs/golden-end-state-operator-workflow.md: "Golden workflow docs may mention reviewed promotion plan"
        scripts/verify-supermemory-specs.mjs: "Global suite already runs hindsight-promote tests"
      interface_contract:
        write_plan: "node scripts/hindsight-promote.mjs --input <governed.json> --write-plan <plan.json> --json validates input, writes a redacted plan artifact outside identity-vault, performs no network writes, and returns mode write-plan metadata."
        apply_plan_mock: "node scripts/hindsight-promote.mjs --apply-plan <plan.json> --mock-transport --owner-confirmed --json validates the saved plan and executes mock transport with network_writes false."
        apply_plan_live: "node scripts/hindsight-promote.mjs --apply-plan <plan.json> --live --owner-confirmed --json requires local explicit Hindsight env and live opt-in; not used in CI."
        fail_closed: "Refuse validation errors, tampered operations, missing owner confirmation, missing mode, unsafe cloud endpoint unless explicitly allowed later, secret-like values, identity-vault plan writes, and raw response leakage."
      test_strategy:
        red_tests: "Add failing tests to tests/hindsight-promote.test.mjs for write-plan success, apply-plan mock success, owner confirmation required, tampered plan rejection, identity-vault write-plan refusal, and no secret leakage."
        green_commands:
          - "node --test tests/hindsight-promote.test.mjs"
          - "node scripts/verify-golden-end-state-workflow.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
        mocks: "Use temporary plan files and --mock-transport; do not use live writes in tests."
      feedback_policy: "Run the focused hindsight-promote tests after each edit, then Golden/global verifiers before review. Stop before adding new dependencies, broad scans, credentials, cloud default, or live CI writes."
      acceptance_contract_updates:
        exact_end_state_evidence:
