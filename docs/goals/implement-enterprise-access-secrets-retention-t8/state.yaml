        - "docs/prd-memoire-agentique-v2.md requires secret redaction/exclusion and legal-hold proof retention."
      module_map:
        new_case: "identity-vault/90_evals/cases/enterprise-access-secrets-retention"
        new_verifier: "scripts/verify-enterprise-access-secrets-retention.mjs"
