        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "local verifier contract only"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none"
        deploy_rollback: "revert fixture/script/test/docs changes"
        observability: "fixture assertions for access metadata, redaction, drafts, and legal hold"
        docs: "update enterprise access/retention docs after green behavior"

    expected_output:
