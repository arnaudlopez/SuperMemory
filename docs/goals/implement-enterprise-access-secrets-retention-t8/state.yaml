      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve T8 architecture and select Worker slice."
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      architecture_review: "Approved. Implement a deterministic local T8 contract, not runtime auth, RLS, or live Hindsight security."
      design_concept: "Enterprise memory is usable only when the vault has explicit tenant, owner, access, consumer, redaction, and retention decisions. Hindsight tags execute those vault decisions; they are not the governance source."
      interface_contract:
        workspace_required: "Enterprise memory and promotion payloads require workspace_id."
        access_policy_required: "Enterprise memory and recall payloads require access_policy."
        data_owner_required: "Enterprise memory and promotion payloads require data_owner."
        secret_redaction: "Secret-like values from sources must be absent from promotion payloads and drafts."
        restricted_drafts: "Drafts may contain allowed summaries but must exclude restricted fields and list withheld_fields."
        legal_hold: "Legal-hold sources keep vault proof and retention metadata while active Hindsight use can be excluded."
      test_strategy:
        red: "Add fixture/global wiring before verifier implementation so global specs fail on missing verifier."
        green: "Implement verifier for T8.1-T8.6 and wire Node test/global specs."
      feedback_policy: "Check hard metadata/redaction/retention properties, not exact prose."
      impact_assessment_ref: "T001 receipt impact_assessment"
      allowed_files:
