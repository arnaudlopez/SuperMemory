version: 2

goal:
  title: "T8 Enterprise Access Secrets Retention"
  slug: "implement-enterprise-access-secrets-retention-t8"
  kind: specific
  tranche: "Implement an executable contract proving workspace isolation, access policy metadata, secret redaction, restricted-field withholding, legal hold retention, and data ownership."
  status: active
  oracle:
    signal: "A T8 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves enterprise access/secrets/retention while T0-T7 remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T8 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit SHA, pushed branch, and final audit full_outcome_complete true."
  intake:
    original_request: "OK vas-y."
    interpreted_outcome: "Continue with T8 enterprise access, secrets, and legal hold."
    input_shape: specific
    audience: "SuperMemory maintainers and future memory agents"
    authority: requested
    proof_type: test
    completion_proof: "A T8 fixture/verifier proves enterprise isolation and retention behavior, global specs pass, and the work is committed and pushed."
    likely_misfire: "Treating tags as sufficient security, leaking secret-like strings into promotion/drafts, or deleting legal-hold evidence while excluding active recall."
    blind_spots_considered:
      - "workspace_id, access_policy, and data_owner must be mandatory for enterprise memory."
      - "Secret redaction must cover promotion payloads and drafts."
      - "Restricted fields must be withheld from drafts while allowed summaries remain possible."
      - "Legal hold must preserve vault evidence even when active Hindsight use is excluded."
      - "This remains a deterministic contract, not runtime auth."
    existing_plan_facts:
      - "docs/golden-case-tdd-matrix.md defines T8.1-T8.6."
      - "docs/golden-case-implementation-roadmap.md defines the enterprise leak-prevention oracle."
      - "identity-vault/75_governance/access_control.md defines deny-by-default access metadata."
      - "identity-vault/75_governance/hindsight_contract.md defines enterprise promotion metadata and fail-closed recall."
      - "docs/prd-memoire-agentique-v2.md defines secret redaction and legal-hold retention expectations."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/implement-enterprise-access-secrets-retention-t8/"
    command: "npx goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-enterprise-access-secrets-retention-t8"

