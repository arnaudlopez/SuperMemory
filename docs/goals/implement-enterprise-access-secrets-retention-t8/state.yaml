        - "identity-vault/90_evals/cases/enterprise-access-secrets-retention/expected/assertions.json"
        - "identity-vault/90_evals/cases/enterprise-access-secrets-retention/expected/answer-evidence.json"
        - "identity-vault/90_evals/cases/enterprise-access-secrets-retention/actual/README.md"
        - "scripts/verify-enterprise-access-secrets-retention.mjs"
        - "tests/enterprise-access-secrets-retention.test.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      verify:
        - "node scripts/verify-enterprise-access-secrets-retention.mjs"
        - "node --test tests/enterprise-access-secrets-retention.test.mjs"
        - "node scripts/verify-supermemory-specs.mjs"
        - "git diff --check"

