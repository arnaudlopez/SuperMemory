version: 2

goal:
  title: "Implement Validated Memory Promotion Generation"
  slug: "implement-validated-memory-promotion-generation"
  kind: specific
  status: active
  oracle:
    signal: "The Hindsight preflight can generate promotion_payloads from explicit validated_memories input without scanning or live writes."
    cadence: "after red test, implementation, verification, shipping, and final audit"
    final_proof: "CLI tests pass, adapter/source/global specs pass, git diff --check pass, GoalBuddy checks pass, commit SHA and push proof."
  intake:
    original_request: "Next? Go"
    interpreted_outcome: "Implement the next M2 tranche: explicit vault-derived payload generation from validated_memories."
    input_shape: specific
    audience: "SuperMemory maintainers"
    authority: requested
    proof_type: test
    completion_proof: "Tests prove generated promotion payloads and fail-closed invalid generation."
    likely_misfire: "Automatically scanning the vault or treating every validated_memory as promotable without explicit promotion intent."
    blind_spots_considered:
      - "Generation must be explicit in the input."
      - "Candidate, unapproved, missing-content, or missing-provenance memories must fail closed or be skipped as appropriate."
      - "The existing promotion_payloads path must keep working."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: null
    command: "npx --yes goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-validated-memory-promotion-generation"

active_task: T998

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map validated_memory generation scope."
    receipt:
      result: done
      summary: "The next safe tranche is explicit generation from validated_memories, still inside the existing CLI and tests."
      evidence:
        - "Previous M2 goal added vault_sync_v1 metadata validation."
        - "docs/prd-memoire-agentique-v2.md M2 calls for a vault -> Hindsight sync script without scanning the whole vault automatically."
        - "identity-vault/75_governance/hindsight_contract.md says Hindsight receives governed ValidatedMemory or approved raw audit payloads."
      module_map:
        cli: "scripts/hindsight-promote.mjs"
        cli_test: "tests/hindsight-promote.test.mjs"
        global_oracle: "scripts/verify-supermemory-specs.mjs"
      ubiquitous_language:
        - "validated_memory"
        - "promotion_source"
        - "promotion_payload"
        - "explicit generation"
        - "promote_to_hindsight"
      design_concept: "The input JSON can ask the CLI to derive payloads from already-governed memories; the CLI must not discover or interpret sources itself."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "local CLI contract adds promotion_source: validated_memories"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none in tests/CI"
        deploy_rollback: "revert validated-memory generation commit"
        observability: "CLI JSON generated_from field and validation errors"
        docs: "GoalBuddy board only"
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve generation contract."
    receipt:
      result: done
      decision: approved
      architecture_review: "Approved. Add explicit generation only for promotion_source: validated_memories. Do not scan vault paths, do not infer from files, and do not weaken existing promotion validation."
      design_concept: "Generation is a local transform from governed memory objects to governed payload objects."
      interface_contract:
        trigger: "promotion_source: validated_memories"
        explicit_promotable_flag: "promote_to_hindsight: true"
        generated_payload_fields:
          - "document_id"
          - "memory_id"
          - "text"
          - "tags"
          - "metadata.source_id"
          - "metadata.snapshot_id"
          - "metadata.source_version"
          - "metadata.freshness"
          - "metadata.derived_from"
      feedback_policy: "Use named validation errors and keep existing fixtures green."
      test_strategy:
        red: "Add CLI tests proving generated payloads before implementation."
        green:
          - "node --test tests/hindsight-promote.test.mjs"
          - "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
          - "node scripts/verify-source-change-t0-t1.mjs"
          - "node scripts/verify-hindsight-adapter-minimal.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
      impact_assessment_ref: "T001 receipt impact_assessment"
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement explicit validated_memory promotion generation."
    impact_assessment_ref: "T001 receipt impact_assessment"
    allowed_files:
      - "scripts/hindsight-promote.mjs"
      - "tests/hindsight-promote.test.mjs"
    verify:
      - "node --test tests/hindsight-promote.test.mjs"
      - "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
      - "node scripts/verify-source-change-t0-t1.mjs"
      - "node scripts/verify-hindsight-adapter-minimal.mjs"
      - "node scripts/verify-supermemory-specs.mjs"
      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "Need connector/source capture implementation."
      - "Need broad vault scan or source refresh job."
      - "Need live Hindsight credentials or network smoke."
    receipt:
      result: done
      summary: "Implemented explicit promotion payload generation from validated_memories in the Hindsight promotion CLI."
      expected_fail:
        command: "node --test tests/hindsight-promote.test.mjs"
        result: "failed before implementation because generated_from was absent for promotion_source: validated_memories"
      changed_files:
        - "scripts/hindsight-promote.mjs"
        - "tests/hindsight-promote.test.mjs"
      design_delta: "The CLI now supports promotion_source: validated_memories as a local transform from already-governed memories to promotion_payloads. It requires promote_to_hindsight: true on active approved memories and leaves the existing promotion_payloads path unchanged."
      commands:
        - command: "node --test tests/hindsight-promote.test.mjs"
          status: pass
        - command: "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
          status: pass
        - command: "node scripts/verify-source-change-t0-t1.mjs"
          status: pass
        - command: "node scripts/verify-hindsight-adapter-minimal.mjs"
          status: pass
        - command: "node scripts/verify-governed-answer-evidence.mjs"
          status: pass
        - command: "node scripts/verify-supermemory-specs.mjs"
          status: pass
        - command: "git diff --check"
          status: pass
  - id: T998
    type: pm
    assignee: PM
    status: active
    objective: "Ship verified validated-memory generation tranche."
  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Audit final completion."
    receipt: null
