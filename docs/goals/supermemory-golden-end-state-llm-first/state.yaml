tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: "Turn the mature request into a concrete acceptance contract before any implementation work."
    inputs:
      - "goal.md"
      - "acceptance-contract.md"
      - "Current repository source, tests, scripts, docs, and dirty worktree status"
    constraints:
      - "Read-only."
      - "Do not edit product files."
      - "Do not start implementation."
      - "Prefer observable owner outcomes over internal task completion."
    expected_output:
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "interface_contract: public behavior and boundaries that tests should target"
      - "test_strategy: acceptance tests, unit/integration boundaries, mocks, browser or visual checks if relevant"
      - "feedback_policy: targeted test cadence, typecheck, browser checks, and full-suite timing"
      - "acceptance_contract_updates: exact end-state evidence and failure modes"
      - "dirty_worktree_risk_map: unrelated files that must stay untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Read-only Scout mapping completed. The repo already has strong executable contracts for governance, LLM-first interpretation, local capture, local file refresh, Hindsight transport, and full enterprise fixtures. The missing Golden End State layer is a coherent operator workflow contract/verifier that ties these pieces into capture -> snapshot -> interpretation -> staging/review -> promotion -> recall/answer -> refresh/change audit, while keeping live Hindsight behind local preflight readiness."
      design_concept:
        shared_understanding: "SuperMemory should become operator-usable locally, not merely fixture-complete. The next work should create an executable Golden End State workflow contract before adding more product behavior, so future slices are driven by observable local commands and no implicit cloud/live mutation."
        non_goals:
          - "No implicit Hindsight Cloud fallback"
          - "No committed secrets, env files, bank ids, raw live responses, or live evidence"
          - "No live Hindsight writes unless an active task explicitly permits local mutation and preflight is ready"
          - "No arbitrary vault-wide promotion without an owner-approved staged plan"
          - "No UI before the CLI/operator path is coherent"
          - "No Graphiti/Memoria activation unless evals prove the need"
        decision_dependencies:
          - "Live Hindsight remains blocked until env is explicit and the container is localhost-only"
          - "The first Golden verifier should be non-live and fixture/tmp based"
          - "Operator commands should stay explicit dry-run/apply/commit/live rather than hidden mutation"
      ubiquitous_language:
        golden_end_state: "operator-usable local workflow across capture, snapshot, interpretation, promotion, recall, answer, refresh, and audit"
        operator_workflow: "documented CLI sequence with explicit dry-run, staging, commit, preflight, and apply points"
        llm_first_interpretation: "adaptive meaning extraction with evidence, confidence, uncertainty, assumptions, alternatives, use pattern, and review state"
        deterministic_governance: "hard gates for access, freshness, review, revocation, secret redaction, and live mutation"
        local_live_smoke: "owner-approved execution against self-hosted Hindsight on 127.0.0.1 with sacrificial bank env"
        operational_blocker: "runtime/env/safety condition outside code behavior that prevents live writes"
        forbidden_synonyms: "do not call mock rehearsal live proof; do not call cloud fallback local; do not call fixture completeness operator usability"
      module_map:
        README.md: "Current user-facing status, quickstart, implemented/not-yet-implemented roadmap, and operator command snippets"
        docs/golden-case-tdd-matrix.md: "Historical T0-T14 matrix and Golden Case acceptance basis"
        docs/llm-first-migration-plan.md: "LLM-first meaning plus deterministic governance rationale"
        identity-vault/75_governance/interpretation_contract.md: "InterpretationCandidate contract and LLM-first boundaries"
        identity-vault/90_evals/cases/enterprise-living-memory-complete: "Existing full Golden Case fixture proof"
        scripts/verify-enterprise-living-memory-complete.mjs: "Fixture-level complete Golden Case verifier"
        scripts/local-manual-capture.mjs: "Operator dry-run/apply/commit for local source capture"
        scripts/local-file-source-refresh.mjs: "Operator dry-run/apply/commit for local-file refresh"
        scripts/hindsight-promote.mjs: "Dry-run/mock/live guarded Hindsight promotion path"
        scripts/hindsight-local-live-smoke-preflight.mjs: "Read-only local runtime readiness gate before live Hindsight writes"
        scripts/hindsight-live-smoke-runner.mjs: "Mock/live smoke runner for retain/upsert/delete/recall cases"
        scripts/verify-supermemory-specs.mjs: "Global regression orchestrator; should include any Golden End State verifier"
        shallow_module_risk: "Adding many tiny verifiers that duplicate existing contracts instead of one coherent workflow contract"
      interface_contract:
        golden_verifier: "A new verifier should prove the non-live operator workflow contract end to end using temp dirs/fixtures: local capture plan, staging, vault commit, refresh plan, governed promotion dry-run/mock, answer evidence, and audit/report shape."
        live_boundary: "Live Hindsight is never part of ordinary CI; the Golden verifier may require preflight reporting but must not require real credentials or perform live writes."
        failure_modes:
          - "missing live env fails closed"
          - "non-local endpoint is blocked"
          - "non-localhost Docker binding is visible"
          - "unavailable source becomes unknown/review rather than fresh"
          - "restricted or revoked memory cannot be active answer evidence"
          - "mock transport is not treated as live proof"
        operator_output: "Commands should emit JSON with writes_performed/network_writes, validation errors, files read/written, and redacted env status where relevant."
      test_strategy:
        first_red_test: "Add tests for a Golden End State verifier that currently does not exist, likely tests/golden-end-state-workflow.test.mjs calling scripts/verify-golden-end-state-workflow.mjs."
        implementation_slice: "Implement the verifier as an orchestration/audit over existing commands and fixtures, not a new business engine."
        targeted_verify:
          - "node --test tests/golden-end-state-workflow.test.mjs"
          - "node scripts/verify-golden-end-state-workflow.mjs"
        global_verify:
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
        mocks: "Use temp dirs, existing fixtures, mock Hindsight transport, and preflight JSON; do not use live credentials."
        browser_visual: "not relevant for CLI-only workflow"
      feedback_policy: "Run the new targeted Golden verifier/test after every change in this goal, then run Hindsight/local capture/refresh targeted checks as needed, and run node scripts/verify-supermemory-specs.mjs plus git diff --check before review/shipping. Stop before credentials or live writes."
      acceptance_contract_updates:
        exact_end_state_evidence:
          - "Golden End State verifier exists and is wired into verify-supermemory-specs"
          - "Verifier proves a coherent operator CLI path using existing commands/fixtures without mutating real vault or Hindsight live"
          - "README/docs describe the current operator path and remaining live blockers"
          - "Preflight status is handled as readiness/blocker, not as failure of code completeness"
        failure_modes:
          - "secret leak"
          - "implicit cloud fallback"
          - "live write without explicit ready preflight"
          - "treating fixture/mock proof as live evidence"
          - "bypassing review/staging before vault commit or promotion"
      dirty_worktree_risk_map:
