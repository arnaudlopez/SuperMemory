          - docs/supermemory-golden-end-state-llm-first-notes.md
          - docs/goals/supermemory-golden-end-state-llm-first/
        risk: "Only goal setup artifacts are dirty now. Product files must remain untouched until T004 implementation boundaries are approved."
        guard: "Future Worker tasks must use explicit allowed_files and leave unrelated dirty files untouched."
      impact_assessment:
        db_schema_migrations: none
        data_backfill: none
        env_secrets: "none for the first Golden verifier; live env remains external and redacted"
        auth_permissions: none
        api_contract: "local CLI/reporting contract only"
        ui_routes: none
        background_jobs: none
        external_services: "local Docker Hindsight preflight may be read; live Hindsight writes remain blocked unless explicitly allowed"
        deploy_rollback: none
        observability: "Golden verifier should produce auditable PASS/FAIL and redacted runtime/blocker evidence"
        docs: "README/runbook/roadmap may need updates after implementation"
