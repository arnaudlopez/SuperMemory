        new_test: tests/golden-end-state-workflow.test.mjs
        global_suite: scripts/verify-supermemory-specs.mjs
        operator_docs: "README.md and docs/golden-end-state-operator-workflow.md if needed"
        existing_inputs: "local-manual-capture, local-file-source-refresh, hindsight-promote, Hindsight preflight, governed answer and enterprise complete verifiers"
      interface_contract:
        verifier: "Must pass only when the repo exposes a coherent non-live operator workflow contract from capture through audit."
        required_checks:
