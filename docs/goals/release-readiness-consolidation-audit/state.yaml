version: 2

goal:
  title: "Release Readiness Consolidation Audit"
  slug: "release-readiness-consolidation-audit"
  kind: audit
  status: active
  oracle:
    signal: "A source-backed consolidation audit explains post-T14 readiness, drift, risks, and the next executable goal while global specs remain green."
    cadence: "after audit draft and final verification"
    final_proof: "Audit document present, node scripts/verify-supermemory-specs.mjs pass, git diff --check pass, GoalBuddy final quality check pass, commit SHA and push proof."
  intake:
    original_request: "Ok go"
    interpreted_outcome: "Run the proposed post-T14 release/consolidation audit and prepare the next step."
    input_shape: audit
    audience: "SuperMemory maintainers"
    authority: requested
    proof_type: artifact
    completion_proof: "docs/release-readiness-consolidation-audit.md exists and is grounded in current docs, scripts, fixtures, and goal history."
    likely_misfire: "Treating T0-T14 completion as runtime readiness, or starting a runtime integration before cleaning up stale plans and duplicated verifier pressure."
    blind_spots_considered:
      - "Some planning docs may still describe pre-T14 or pre-LLM-first states."
      - "CI/local verification may be green but noisy or duplicated."
      - "The next goal should not accidentally weaken deterministic governance gates while pursuing LLM-first adaptability."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

goal_policy:
  mode: docs
  requires_tdd: false
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: null
    command: "npx --yes goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/release-readiness-consolidation-audit"

active_task: T998

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map post-T14 source evidence and readiness drift."
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "audit_scope"
      - "module_map"
      - "on_track_evidence"
      - "drift_or_stale_docs"
      - "runtime_readiness_gap"
      - "recommended_next_goal"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      audit_scope:
        - "README.md project status and roadmap"
        - "docs/golden-case-implementation-roadmap.md T0-T14 path"
        - "docs/golden-case-tdd-matrix.md T14 and Definition of Done"
        - "docs/llm-first-migration-plan.md stale migration state"
        - "docs/prd-memoire-agentique-v2.md future M4/M5 runtime work"
        - ".github/workflows/supermemory-specs.yml"
        - "scripts/verify-supermemory-specs.mjs"
        - "identity-vault/90_evals/cases/"
      module_map:
        global_oracle: "scripts/verify-supermemory-specs.mjs"
        ci_oracle: "scripts/verify-ci-regression-suite.mjs"
        ci_workflow: ".github/workflows/supermemory-specs.yml"
        golden_case: "identity-vault/90_evals/cases/enterprise-living-memory-complete"
        audit_artifact: "docs/release-readiness-consolidation-audit.md"
      ubiquitous_language:
        - "specification-first prototype"
        - "runtime preflight"
        - "post-T14 docs consolidation"
        - "vault-to-Hindsight promotion"
        - "optional reporting"
      design_concept: "Separate three states: specification executable, release documentation coherent, and runtime ready."
      on_track_evidence:
        - "T0-T14 executable contracts exist and are wired into the global spec runner."
        - "The complete enterprise Golden Case and CI regression suite exist under identity-vault/90_evals/cases/."
        - "README frames SuperMemory as LLM-first for meaning and deterministic for governance."
      drift_or_stale_docs:
        - "docs/llm-first-migration-plan.md still describes current uncommitted work and a formerly failing global spec state."
        - "README roadmap still says to expand toward the enterprise living-memory target after that target has been implemented."
        - "promptfoo remains worded as an open question in some places even though T14 made it optional reporting."
      runtime_readiness_gap:
        - "No live Hindsight API integration."
        - "No source capture connectors, real change detection, or automated snapshot refresh."
        - "No vault-to-Hindsight promotion CLI."
      recommended_next_goal: "Post-T14 Docs Consolidation before runtime preflight."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "none; docs-only audit artifact"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none"
        deploy_rollback: "revert the audit document and board commit"
        observability: "local verifier output and audit recommendations"
        docs: "adds docs/release-readiness-consolidation-audit.md"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve the audit shape and the next-goal recommendation before writing the artifact."
    expected_output:
      - "decision"
      - "architecture_review"
      - "design_concept"
      - "interface_contract"
      - "feedback_policy"
      - "test_strategy"
      - "impact_assessment"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      architecture_review: "Approved. Produce one source-backed audit artifact and do not start runtime implementation or verifier refactoring in this goal."
      design_concept: "T0-T14 satisfy executable specification readiness; this goal documents release/documentation readiness and selects the next bounded goal."
      interface_contract:
        audit_must_include:
          - "on-track evidence"
          - "drift/stale docs"
          - "runtime gap"
          - "recommended next goals"
          - "verification commands"
        audit_must_not_include:
          - "runtime implementation"
          - "new dependencies"
          - "weakened T0-T14 assertions"
      feedback_policy: "Use file-backed evidence and concrete next-goal boundaries rather than broad strategy language."
      test_strategy:
        - "Run node scripts/verify-supermemory-specs.mjs after the audit artifact is written."
        - "Run git diff --check."
        - "Run GoalBuddy final checks before shipping."
      impact_assessment_ref: "T001 receipt impact_assessment"
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Write the release-readiness consolidation audit document."
    inputs:
      - "architecture_review"
      - "interface_contract"
      - "module_map"
      - "test_strategy"
      - "feedback_policy"
      - "ubiquitous_language"
      - "design_concept"
      - "Completed impact_assessment receipt"
      - "Judge decision with impact_assessment_ref"
    impact_assessment_ref: "T001 receipt impact_assessment"
    allowed_files:
      - "docs/release-readiness-consolidation-audit.md"
    verify:
      - "node scripts/verify-supermemory-specs.mjs"
      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "Need runtime implementation, dependency installation, database migration, secret, hosted service, or external connector."
      - "Need to edit existing roadmap or PRD docs instead of writing the audit artifact."
    receipt:
      result: done
      summary: "Wrote docs/release-readiness-consolidation-audit.md with verdict, evidence reviewed, solid areas, drift, runtime gap, and recommended next goals."
      changed_files:
        - "docs/release-readiness-consolidation-audit.md"
      design_delta: "The project now has an explicit post-T14 release-readiness distinction: executable spec is complete, docs need a small consolidation pass, and runtime integration remains future work."
      commands_pending_final:
        - "node scripts/verify-supermemory-specs.mjs"
        - "git diff --check"
  - id: T998
    type: pm
    assignee: PM
    status: queued
    objective: "Ship the audit artifact and board."
    expected_output:
      - "Or shipping_blocker: no_git_repository | no_github_remote"
      - "Commit SHA"
      - "Remote branch"
      - "Push result"
      - "Committed files"
      - "Unrelated dirty files left untouched"
  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Audit whether the full original outcome is complete."
    inputs:
      - "design_concept, ubiquitous_language, feedback_policy, test_strategy, module_map, interface_contract, architecture_review, and design_delta evidence"
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Quality checker final output"
      - "Completed impact_assessment receipt"
      - "T998 shipping proof when shipping is required"
    constraints:
      - "Reject completion if design_concept, ubiquitous_language, feedback_policy, test_strategy, module_map, interface_contract, architecture_review, or design_delta evidence is missing when workflow_safeguards requires it."
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion unless impact_assessment covers db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs when impact assessment is required."
      - "For read-only audit goals with no Worker tasks and no changed_files, accept audit_scope/audit_findings/review/decision evidence instead of TDD, impact_assessment, T998, commit, and push."
      - "For verification goals, reject completion unless safe test/browser command evidence exists and no changed_files are reported."
      - "Reject completion unless T998 has a commit SHA and successful push result, or an explicit shipping_blocker for no_git_repository/no_github_remote, when shipping is required."
    expected_output:
      - "design_delta"
      - "workflow_safeguards result"
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt: null
