version: 2

goal:
  title: "Implement Hindsight Source-Change Sync Fixture"
  slug: "implement-hindsight-source-change-sync-fixture"
  kind: specific
  status: active
  oracle:
    signal: "A dedicated verifier proves source-change sync from reviewed validated_memory through mock Hindsight transport."
    cadence: "after red verifier, implementation, verification, shipping, and final audit"
    final_proof: "Dedicated verifier passes, global specs pass, git diff --check pass, GoalBuddy checks pass, commit SHA and push proof."
  intake:
    original_request: "Enchaîne"
    interpreted_outcome: "Implement the next P0 runtime proof: complete mock T5 source-change sync fixture."
    input_shape: specific
    audience: "SuperMemory maintainers"
    authority: requested
    proof_type: test
    completion_proof: "Verifier proves changed source, reviewed validated memory, generated payload, and mock transport."
    likely_misfire: "Only adding another unit test without a repo fixture, or running live Hindsight/connector work."
    blind_spots_considered:
      - "Re-promotion should preserve stable document_id and behave like an upsert intent."
      - "No broad vault scan or connector refresh should be introduced."
      - "The proof should be wired into global specs."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: not_started
    url: null
    command: "npx --yes goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-hindsight-source-change-sync-fixture"

active_task: T998

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map source-change sync fixture scope."
    receipt:
      result: done
      summary: "The next P0 task is a fixture-backed end-to-end mock proof for T5 source-change sync."
      evidence:
        - "Project brief lists complete mock T5 source-change sync fixture as P0."
        - "Existing CLI supports promotion_source: validated_memories and mock transport."
        - "scripts/verify-source-change-t0-t1.mjs already proves source changed and reviewed memory semantics locally."
      module_map:
        fixture: "identity-vault/90_evals/cases/hindsight-source-change-sync/input/fixture.json"
        assertions: "identity-vault/90_evals/cases/hindsight-source-change-sync/expected/assertions.json"
        verifier: "scripts/verify-hindsight-source-change-sync.mjs"
        cli: "scripts/hindsight-promote.mjs"
        global_oracle: "scripts/verify-supermemory-specs.mjs"
      ubiquitous_language:
        - "source-change sync"
        - "reviewed validated_memory"
        - "generated promotion_payload"
        - "mock transport"
        - "stable document_id"
        - "upsert intent"
      design_concept: "Use a deterministic JSON fixture to connect existing T5 source-change semantics to the Hindsight promotion preflight and mock transport."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "none"
        api_contract: "local verifier/fixture contract only"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none in tests/CI"
        deploy_rollback: "revert source-change sync fixture commit"
        observability: "verifier output and CLI JSON mock transport summary"
        docs: "GoalBuddy board only"
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve fixture implementation boundary."
    receipt:
      result: done
      decision: approved
      architecture_review: "Approved. Add a fixture, assertions, verifier, and minimal CLI behavior if needed for re-promotion upsert intent. No connectors, broad scans, live writes, dependencies, jobs, or migrations."
      design_concept: "The verifier should run the existing CLI with --live --mock-transport and fake env, then assert generated payload and transport shape."
      interface_contract:
        command: "node scripts/hindsight-promote.mjs --input identity-vault/90_evals/cases/hindsight-source-change-sync/input/fixture.json --live --mock-transport --json"
        expected_flow: "source changed -> t1 approved memory -> generated payload -> mock transport"
        expected_network_writes: false
      feedback_policy: "Keep fixture small but complete; prefer verifier assertions over prose-only docs."
      test_strategy:
        red: "Add verifier expecting upserted source-change sync before CLI supports generated re-promotion upsert intent."
        green:
          - "node scripts/verify-hindsight-source-change-sync.mjs"
          - "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
          - "node scripts/verify-source-change-t0-t1.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
      impact_assessment_ref: "T001 receipt impact_assessment"
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement source-change sync fixture and verifier."
    impact_assessment_ref: "T001 receipt impact_assessment"
    allowed_files:
      - "identity-vault/90_evals/cases/hindsight-source-change-sync/**"
      - "scripts/verify-hindsight-source-change-sync.mjs"
      - "scripts/hindsight-promote.mjs"
      - "scripts/verify-supermemory-specs.mjs"
    verify:
      - "node scripts/verify-hindsight-source-change-sync.mjs"
      - "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
      - "node scripts/verify-source-change-t0-t1.mjs"
      - "node scripts/verify-supermemory-specs.mjs"
      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "Need connector/source capture implementation."
      - "Need broad vault scan or source refresh job."
      - "Need live Hindsight credentials or network smoke."
    receipt:
      result: done
      summary: "Implemented the T5 Hindsight source-change sync fixture, dedicated verifier, CLI re-promotion upsert intent, and global spec wiring."
      expected_fail:
        command: "node scripts/verify-hindsight-source-change-sync.mjs"
        result: "failed before implementation because generated re-promotion used retain and omitted previous_snapshot_id/replaces_memory_id"
      changed_files:
        - "identity-vault/90_evals/cases/hindsight-source-change-sync/input/fixture.json"
        - "identity-vault/90_evals/cases/hindsight-source-change-sync/expected/assertions.json"
        - "scripts/verify-hindsight-source-change-sync.mjs"
        - "scripts/hindsight-promote.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      design_delta: "The runtime preflight proof now spans changed source metadata, a reviewed t1 validated_memory, generated payload metadata, upsert intent for stable document_id re-promotion, and mock Hindsight transport."
      commands:
        - command: "node scripts/verify-hindsight-source-change-sync.mjs"
          status: pass
        - command: "node --test tests/hindsight-transport.test.mjs tests/hindsight-promote.test.mjs"
          status: pass
        - command: "node scripts/verify-source-change-t0-t1.mjs"
          status: pass
        - command: "node scripts/verify-hindsight-adapter-minimal.mjs"
          status: pass
        - command: "node scripts/verify-supermemory-specs.mjs"
          status: pass
        - command: "git diff --check"
          status: pass
  - id: T998
    type: pm
    assignee: PM
    status: active
    objective: "Ship verified source-change sync fixture."
  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Audit final completion."
    receipt: null
