          - "npm test"
          - "npm run verify"
          - "npm run verify:release"
          - "git diff --check"
        stop_if:
          - "Any required implementation would overwrite, discard, or silently replace existing dirty user work instead of merging around it."
          - "Pins or tombstones cannot survive loss or corruption of every derived manifest/index snapshot without treating an independently durable mutation journal as authority."
          - "A tombstone can be acknowledged before its authoritative frame is fsynced, or a crash can leave any normal read path able to reopen the evidence."
          - "Any read, mutation, fork, or rebuild can proceed without exact workspace, project, session, working-set, and evidence bindings or can reveal whether a foreign identifier exists."
          - "Rebuild would trust caller-supplied project/session fields over canonical source envelopes, resurrect tombstoned episodes, lose pins, or produce different selection from incremental replay."
          - "Supporting opaque UUIDv7 identities and stable resume would require rewriting canonical capture payloads or weakening event idempotence."
          - "A durable or reopen-verified response could be emitted before capture, working evidence, canonical episode, and authoritative mutation state are fsynced and reopened with matching hashes and scope."
          - "A partial, spooled, corrupt, expired, purged, tombstoned, or unverified capture could become offload-eligible or suppress original output."
          - "Flags-off behavior changes, plaintext payloads are duplicated, physical paths leak, AEAD/frame chaining is weakened, or a projection becomes canonical."
          - "A required change falls outside allowed_files or enters graph, ontology, improve, Active Map, MCP recall, lifecycle UI, installer, deploy, or production rollout."
          - "Any deterministic test requires Ollama, Hindsight, Graphiti, Neo4j, credentials, a real user vault, or network writes."
          - "The same verification failure remains unresolved after two attempts."
      evidence:
        - kind: implemented_strengths
          findings: "Working artifacts and canonical episodes are AEAD-encrypted, use private directories/files, and contain metadata/payload references rather than duplicated plaintext. Quota selection preserves pins, reports over-capacity, and leaves capture payloads intact. High-watermarks use max sequence and duplicate event admission reuses evidence."
        - kind: storage_contract_failure
          findings: "`codex-working-set-store.mjs:127-221` persists manifest, entries, episodes, pins, and tombstones together in `state.json.aead`. Blueprint §10 requires separate manifest plus independently framed encrypted entries/checkpoints/tombstones journals with sequence and previous-frame hash. The implementation rewrites the entire blob on every mutation."
        - kind: tombstone_rebuild_failure
          findings: "`tombstone` records deletion only inside the rewritable state and updates canonical episodes after the state commit. `rebuild` starts with empty state, reads capture events only, recreates every eligible entry and episode as active, resets pins, and overwrites episode files. Therefore corrupted derived state can resurrect tombstoned evidence and discard pin history."
        - kind: scope_failure
          findings: "`readState`, `openEvidence`, `readEpisode`, and mutation helpers require workspace plus opaque IDs but no expected project/session binding. `rebuild` filters capture records by workspace/session, never verifies each envelope’s project against the requested project, and writes caller-supplied scope into rebuilt entries and episodes."
        - kind: selection_divergence
          findings: "`selectWorkingEvidence` seeds selection only from entries not already marked evicted. After capacity becomes available, previously evicted evidence remains evicted; a fresh rebuild starts every record selected and can choose differently. A direct check returned zero selected tokens despite 60 tokens of available capacity."
        - kind: acknowledgement_and_fail_open
          findings: "Capture commits the encrypted payload and journal before projecting Working Memory. Successful Working acknowledgements reopen payload and episode and compare hashes; injected post-state-commit failure returns `working.durable=false`, `reopen_verified=false`, and degraded state while retaining canonical capture. Daemon client falls back to the encrypted spool."
        - kind: offload_safety
          findings: "`evaluateWorkingOffload` rejects disabled, non-durable, incomplete, unverified, partial, spooled, corrupt, tombstoned, expired, purged, unselected, undersized, and non-allowlisted cases. Every receipt hard-codes `replacement_enabled:false` and `suppress_original:false`; adapters do not wire output replacement."
        - kind: test_gap
          findings: "Fresh focused verification passes 38/38 tests, but the rebuild test corrupts a state containing neither pins nor tombstones, and scope tests do not attempt same-workspace cross-project/session access or forged rebuild scope. Existing green gates therefore do not exercise the unsafe paths."
        - kind: structural_index
          findings: "PM supplied a fresh full `SuperMemory` index with 8,064 nodes, 12,972 edges, skipped_count=0, persistence=false. Exact findings were verified in source; broad search output was truncated and no exhaustive absence claim is made. Deploy remains excluded."
        - kind: dirty_worktree
          findings: "T004 reported changes within its approved allowed_files and no deviations. The repository remains dirty with substantial user-owned untracked work; this Judge made no source, state, index, staging, installation, or configuration changes."
      parallel_safety:
        safe: false
        reason: "Journal format, canonical episode authority, scope validation, selection replay, capture acknowledgements, and fault tests form one coupled durability contract across dirty files. Splitting writers risks incompatible migrations and deletion semantics."
      blocked_tasks:
        - "T005: temporal graph must not consume evidence until Working Memory scope, tombstone, and rebuild authority are repaired."
        - "T006-T008 remain dependency-ordered behind T004 repair and the later graph milestone."
      missing_evidence:
        - "Pins and tombstones surviving derived-state corruption, truncation, restart, and deterministic rebuild."
        - "Adversarial same-workspace cross-project/session read, mutation, fork, and rebuild rejection."
        - "Crash testing between authoritative tombstone commit and episode/index projection updates."
        - "Incremental selection equivalence with replay/rebuild after eviction, pin, unpin, tombstone, and late events."
        - "Framed AEAD journal chaining, truncation detection, and safe handling of the interim T004 state format."
        - "Persisted opaque UUIDv7 identity behavior for resume, duplicate events, and sibling forks."
      required_board_updates:
        - "Mark T013 done with decision rejected and attach this receipt."
        - "Do not activate T005."
        - "Insert and activate one storage-authority repair Worker using this worker_package verbatim."
        - "Queue a read-only Working Memory/Evidence Ledger milestone re-audit after the repair."
        - "Keep graph, ontology, improve, router, and deployment tasks queued until that audit approves storage readiness."
