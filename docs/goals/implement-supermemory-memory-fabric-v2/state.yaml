          - "npm run verify:secrets"
          - "npm run verify:codex"
          - "npm test"
          - "npm run verify"
          - "npm run verify:release"
          - "git diff --check"
        stop_if:
          - "Any required implementation would overwrite, discard, or silently replace existing dirty user work instead of merging around it."
          - "Any recallable graph object could exist without exact workspace scope, canonical episode and evidence provenance, and a valid active admission attestation."
          - "Graphiti, Neo4j, the deterministic backend, or their returned IDs could become canonical or decide authorization, admission, truth, ontology, tombstone, revocation, or temporal validity."
          - "A model/client-provided raw Cypher string, unknown AST field, non-allowlisted entity/relation type, invalid direction, or query above five hops could reach a backend."
          - "Queries cannot enforce default three-hop and maximum five-hop bounds before backend execution, or foreign identifiers produce distinguishable existence signals."
          - "A contradiction or supersede would overwrite historical evidence instead of closing `valid_to`, or an `as_of` query could return a relation outside its validity interval."
          - "Episode tombstone or admission revocation cannot remove canonical recall authority before best-effort projection cleanup, or rebuild could resurrect revoked/tombstoned objects."
          - "Backend loss cannot rebuild an equivalent projection from encrypted canonical graph records and checkpoints without consulting model output or remote state."
          - "Graphiti failure cannot use the injected direct-Neo4j fallback while preserving identical typed contracts, provenance, scope, admission, and temporal semantics."
          - "The package would implement learned ontology changes, entity-resolution inference beyond explicit canonical bindings, improve workers, embeddings, community summaries, Memory Router, MCP/API routes, Portainer/Docker packaging, or production rollout."
          - "Canonical graph records would expose plaintext sensitive content, physical vault paths, secrets, or unencrypted claim text."
          - "Any deterministic test requires network access, Graphiti, Neo4j, Hindsight, Ollama, credentials, containers, or a real user vault."
          - "A required change falls outside allowed_files."
          - "The same verification failure remains unresolved after two attempts."
      evidence:
        - kind: journal_authority
          findings: "`entries.jsonl.aead`, `checkpoints.jsonl.aead`, and `tombstones.jsonl.aead` use independently sealed frames containing journal name, working-set ID, monotonic sequence, previous-frame hash, and AEAD bound to that chain position. Appends fsync and reopen the journal before returning."
        - kind: derived_manifest
          findings: "`manifest.json.aead` contains only a replayed manifest snapshot and journal tail anchors. Missing or corrupt manifests do not lose pins or tombstones; acknowledged journal truncation and frame corruption fail closed."
        - kind: pin_tombstone_recovery
          findings: "Pin changes are checkpoint mutations and tombstones have their own authoritative journal. Tombstone is appended and fsynced before canonical episode projection. Tests inject crashes immediately after pin and tombstone frames, then prove pins persist and evidence cannot reopen; rebuild reconciles episode status without resurrection."
        - kind: scope_and_source_binding
          findings: "Every state read and evidence mutation requires workspace, project, session, and working-set scope; evidence and episode reads additionally bind their IDs. Foreign workspace/project/session calls return unknown errors. Rebuild validates each durable canonical capture envelope and payload hash against the requested scope before accepting it."
        - kind: deterministic_replay
          findings: "Replay initializes every non-tombstoned journal entry as eligible, reapplies final pin/tombstone mutations, and reruns deterministic selection. Tests prove incremental, replayed, and rebuilt selection equality after eviction, late ordering, pin, and unpin operations."
        - kind: identity_and_forks
          findings: "Working-set, evidence, and episode IDs are persisted prefixed UUIDv7 values. Resume scans journal creation records rather than recomputing IDs; duplicate events retain evidence identity. Fork creation validates the parent’s project/workspace and declared parent session, and explicit sibling fork identities produce distinct sets."
        - kind: interim_format
          findings: "The monolithic T004 `state.json.aead` format is neither interpreted nor silently migrated. Discovery explicitly raises `working_interim_format_unsupported`; direct reads expose it only as an unknown invalid working-set ID."
        - kind: acknowledgement_and_offload
          findings: "Canonical capture commits first. Working acknowledgement becomes durable only after evidence journal, canonical encrypted episode, checkpoint, manifest snapshot, scoped payload reopening, episode reopening, and hash checks. Failures return degraded non-durable Working metadata while retaining canonical capture. Offload rejects every unsafe/unselected state and always reports replacement and suppression disabled."
        - kind: encryption_and_canonicality
          findings: "Working journals, manifest, and canonical episodes use AEAD and private filesystem permissions. Tests verify payload plaintext does not appear in Working artifacts. Working projections reference the encrypted capture payload rather than duplicating it."
        - kind: fresh_verification
