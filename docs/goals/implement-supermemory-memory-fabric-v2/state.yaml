        verify:
          - "node --test tests/memory-admission-policy.test.mjs tests/codex-memory-governance.test.mjs tests/codex-memory-compiler.test.mjs tests/product-store-multi-workspace.test.mjs tests/product-hindsight.test.mjs tests/hindsight-promote.test.mjs tests/supermemory-app.test.mjs"
          - "node scripts/verify-memory-contracts.mjs"
          - "node scripts/verify-m1-hindsight-promotion-recall-fixture.mjs"
          - "node scripts/verify-review-queues-actions.mjs"
          - "npm run verify:codex"
          - "npm test"
          - "npm run verify"
          - "npm run verify:release"
          - "git diff --check"
        stop_if:
          - "Any required implementation would overwrite or discard existing user changes in the dirty worktree rather than merge around them."
          - "Automatic activation would require trusting extractor confidence, inventing verifier results, or treating a missing/unavailable verifier as approval."
          - "The separate holdout corpus does not demonstrate at least 95% auto-activation precision and under 5% human exceptions for standard claims; keep automatic mode disabled and stop with the measured result."
          - "Backward compatibility would require rewriting existing immutable candidate/memory artifacts, mutating a real vault during verification, or silently reclassifying legacy pending candidates."
          - "A new final admission decision outside `auto_activate|activate_ttl|quarantine|discard` appears necessary; `pending_verification` must remain a candidate state, not an invented admission decision."
          - "A required change falls outside allowed_files, including Working Memory, graph, ontology, MCP recall, deploy, installer, or production infrastructure."
          - "Any deterministic test requires Ollama, Hindsight, Graphiti, Neo4j, network access, credentials, or a real user vault."
          - "The same verification failure remains unresolved after two attempts."
      evidence:
        - kind: blueprint_contract
          findings: "Blueprint lines 80–92 explicitly assign Lot 0 the README, technical design, PRD/governance fixtures, both stores, and approval-only verifiers while preserving deletion, external-action, permission, secret, readiness, and destructive-ontology gates.,Blueprint lines 219–252 and 465–467 require calibrated audited signals, four final decisions, deterministic policy authority, exceptional quarantine, and under 5% standard-claim exceptions.,Blueprint lines 1152–1158 and WM-AC20 require v1/v2 configurations and flags-off behavior to remain unchanged."
        - kind: gap_map
          findings: "`codex-memory-governance.mjs:209-263` creates candidates and exposes only `reviewCandidate`; no policy or admission path exists.,`codex-workspace-store.mjs:193-419` persists pending candidates, accepts only approve/reject, writes owner-approved active memory, and projects it; active recall has no admission or TTL check.,`product-store.mjs:688-963,1121-1193` creates pending candidates during ingest, labels sources ready/needs-review, and activates only through binary manual review.,`codex-memory-compiler.mjs:416-491` ends at a pending candidate and has an extractor but no independent verifier or policy handoff.,`product-hindsight.mjs` hard-codes `review_status: approved`; `hindsight-promote.mjs` rejects active memories lacking that marker.,`supermemory-review.mjs` and `web/app.js:154-250` present approve/reject as the nominal workflow rather than persistent exceptions.,README and the technical design repeatedly state explicit approval/review-before-activation; `verify-memory-contracts.mjs` and the M1 verifier encode the same requirement.,No `scripts/lib/memory-admission-policy.mjs` or versioned admission calibration corpus currently exists."
        - kind: compatibility_boundary
          findings: "Codex workspace state is additive object-based v2 and already preserves product-store v1 byte-for-byte through `legacyCompatibility`; this supports additive fields and new artifacts without rewriting old files.,Legacy approved memories must remain readable in flags-off/legacy mode. Existing pending candidates must not be bulk auto-activated without verified signals.,Review remains valid for quarantines and legacy migration; unrelated review queues and exact confirmations remain unchanged."
        - kind: baseline_verification
          commands: "node --test tests/codex-memory-governance.test.mjs tests/product-store-multi-workspace.test.mjs tests/supermemory-app.test.mjs,node scripts/verify-memory-contracts.mjs,node scripts/verify-review-queues-actions.mjs,git diff --check"
          result: pass
          details: "11 targeted tests passed; both governance verifiers passed; diff check passed."
        - kind: risks
          items: "The worktree is heavily dirty and most Codex integration files are untracked; edits must be surgical and preserve user content.,Thresholds cannot be selected ad hoc; automatic mode must remain gated unless the separate holdout meets blueprint quality targets.,Product ingestion cannot fabricate independent verification. Missing verifier output remains machine-pending, not a human task and not active memory.,Projection compatibility must accept both legacy reviewed activation and new admission metadata without broadening recall."
        - kind: deferred_lots
          items: "Working Set, Evidence Ledger, Active Map, offload, router, MCP/API recall, temporal graph, ontology evolution, improve worker orchestration, and session consolidation.,Installer/config v3 rollout and real extractor/verifier bindings; this package exposes explicit automatic mode and flags-off compatibility but does not deploy remote services.,Docker/Portainer and deploy validation; deploy was excluded from the fresh graph index and must be checked via filesystem in its later packaging lot."
        - kind: structural_index
          details: "PM supplied a fresh full `SuperMemory` index: 7,692 nodes, 12,220 edges, skipped_count=0, persistence=false. Exact material findings were verified in checked-out source; broad storage search was truncated and no exhaustive storage claim is made."
      parallel_safety:
        safe: false
        reason: "One writer must own this package because the two stores, shared governance contracts, normative docs, and overlapping dirty files change together; splitting would create incompatible admission semantics and migration races."
      blocked_tasks: []
      missing_evidence:
        - "No current test proves AD-AC01–07 or flags-off versus explicit automatic mode."
        - "No versioned calibration/holdout corpus or measured threshold report exists."
        - "No current runtime proves admission metadata survives canonical activation and Hindsight projection without manual review."
        - "Deploy evidence is intentionally deferred because deploy/ is excluded from the structural index."
      required_board_updates:
