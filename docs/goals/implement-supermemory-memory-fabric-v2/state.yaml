version: 2

goal:
  title: "Implement SuperMemory Memory Fabric v2"
  slug: "implement-supermemory-memory-fabric-v2"
  kind: existing_plan
  tranche: "complete successive safe verified slices until the full blueprint v2 outcome is complete"
  status: complete
  oracle:
    signal: "45 acceptance criteria mapped to tests plus an automated ingestion-to-hybrid-recall scenario with cited provenance and nominal auto-admission"
    cadence: "after each Worker package and at final audit"
    final_proof: "receipt-backed acceptance matrix, green relevant tests and release verifiers, and server packaging validation"
  intake:
    original_request: "ok go implent"
    interpreted_outcome: "Implement the approved SuperMemory Memory Fabric v2 blueprint end to end."
    input_shape: existing_plan
    audience: "SuperMemory owner and users"
    authority: requested
    proof_type: test
    completion_proof: "All 45 blueprint acceptance criteria are traceably covered and the full integration scenario passes."
    likely_misfire: "Ship a decorative graph or contracts-only slice while preserving mandatory approve/reject or requiring local AI infrastructure."
    blind_spots_considered:
      - "Dirty worktree and overlapping prior implementation"
      - "Backward compatibility and migration of existing memory records"
      - "Calibration precision and exception-rate targets"
      - "Graph query safety and provenance"
      - "Remote-service independence of local tests"
    existing_plan_facts:
      - "Use docs/supermemory-working-memory-100k-blueprint.md as the approved product and technical plan."
      - "Execute blueprint lots 0 through 9 in dependency order, combining them into coherent vertical slices when safe."
      - "The vault remains canonical; the graph and working projections are rebuildable."
      - "Evaluate Graphiti plus Neo4j first with direct Neo4j fallback."
      - "Human review is exceptional, not nominal."
      - "Target Docker and Portainer on the server; do not deploy the model or graph locally."

rules:
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  require_quality_checker: true
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
  # implementation | bugfix | refactor | audit_read_only | verification | research | docs | infra | data_migration | frontend | release
  mode: frontend
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: true
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/implement-supermemory-memory-fabric-v2/"
    command: "node /Users/arnaud/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.2/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/implement-supermemory-memory-fabric-v2"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the approved blueprint against the current dirty codebase and define the exact largest safe Lot 0 governance-migration Worker package."
    inputs:
      - "docs/supermemory-working-memory-100k-blueprint.md"
      - "README.md"
      - "docs/codex-supermemory-technical-design.md"
      - "package.json"
      - "scripts/lib/codex-memory-governance.mjs"
      - "scripts/lib/codex-workspace-store.mjs"
      - "scripts/lib/product-store.mjs"
      - "existing tests and verifier scripts"
    constraints:
      - "Read-only."
      - "Use codebase-memory-mcp first for structural discovery and verify exact findings in source."
      - "Preserve the blueprint decisions while identifying incompatibilities, overlapping dirty changes, and migration boundaries."
      - "Define one coherent vertical Worker slice, not isolated helpers."
    expected_output:
      - "architecture_review"
      - "interface_contract"
      - "module_map"
      - "test_strategy"
      - "feedback_policy"
      - "Blueprint-to-code gap map"
      - "Exact first Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Risks and deferred lots"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The blueprint explicitly requires Lot 0 to replace standard-memory manual approval while preserving security and destructive-action gates. Current stores, compiler, product UI/CLI, projection metadata, and normative verifiers still encode pending→approve|reject. The approved package is the largest reversible vertical slice: a calibrated deterministic policy, immutable admission attestations, additive store/runtime integration, an explicit flags-off legacy mode, exceptional quarantine resolution, projection compatibility, normative alignment, and executable AD-AC01–07 coverage. Graph, Working Memory, ontology, MCP recall, and deploy remain later dependency-ordered lots."
      impact_assessment:
        db_schema_migrations: "No database schema migration in the local governance, working-memory, graph, or ontology slices; later Neo4j bootstrap must remain additive and rebuildable."
        data_backfill: "No destructive backfill; legacy v1/v2 artifacts remain readable and projections are rebuilt additively from canonical vault and episode evidence."
        env_secrets: "No credentials are added to source; encryption keys and future remote service credentials remain injected secrets with secret-hygiene verification."
        auth_permissions: "Workspace and project scope checks remain mandatory; no authorization or RLS broadening is permitted."
        api_contract: "Admission, graph, improve, recall, and MCP contracts are versioned and additive; flags-off behavior preserves legacy consumers."
        ui_routes: "The only UI change in scope is the already-audited Exceptions workflow; later memory-fabric slices add no unreviewed route mutation."
        background_jobs: "Improve and session consolidation are explicit, idempotent, checkpointed jobs with workspace failure isolation and retryable degradation."
        external_services: "Graphiti, Neo4j, Qwen/Ollama, and Hindsight are optional remote boundaries; deterministic tests cannot require network access or live services."
        deploy_rollback: "No local deployment is allowed; future Docker/Portainer packaging must support health checks, reversible configuration, backup, and operator-controlled rollback."
        observability: "Receipts, admission attestations, projection hashes, checkpoints, provenance, and degraded states provide auditable operational evidence."
        docs: "README, technical design, PRD, blueprint acceptance mapping, deployment instructions, and migration compatibility must remain aligned before release."
      worker_package:
        objective: "Implement the Lot 0 governance migration end to end. Add a versioned, deterministic memory-admission policy that accepts independently verified signals, never uses extractor self-confidence as a deciding signal, emits hash-attested `supermemory.admission-decision.v1` records for `auto_activate|activate_ttl|quarantine|discard`, and leaves verifier outages in non-recallable `pending_verification`. Add idempotent `admitCandidate` flows to both stores and governance/compiler paths; activate/project only auto/TTL decisions with valid evidence and scope, enforce TTL, keep quarantine/discard out of normal recall, and limit `reviewCandidate` to quarantines plus explicit legacy migration mode. Preserve existing v1/v2 state and active reviewed memories without rewriting immutable artifacts; flags off must retain current behavior. In explicit automatic mode, migrate the local product/API/UI/CLI from nominal approval to an Exceptions view, while keeping deletion, permissions, secrets, external actions, production readiness, and destructive ontology gates explicit. Carry admission metadata into Hindsight promotion. Align normative documentation and governance verifiers only for standard-memory activation. Add a versioned calibration/holdout corpus and deterministic tests covering AD-AC01–07, idempotence, projection ordering, workspace isolation, legacy compatibility, and the current manual path when flags are disabled. Do not implement Working Memory, graph, ontology, MCP recall, or deployment."
        allowed_files:
          - README.md
          - docs/codex-supermemory-technical-design.md
          - docs/prd-memoire-agentique-v2.md
          - scripts/lib/memory-admission-policy.mjs
