    objective: "Implement the blueprint’s bounded Lot 3 temporal knowledge-graph vertical slice without ontology learning, improve workers, router/MCP integration, deployment, or live infrastructure. Add immutable core ontology v1 containing only the approved entity and relation type allowlists and shape validators; do not support learned extensions, rename, merge, delete, shadow promotion, or ontology migration. Implement `knowledge-graph-adapter.mjs` with encrypted canonical vault records for entities, claims, temporal relations, projection checkpoints, and tombstones. Every recallable entity/claim/relation must be workspace-scoped, cite existing canonical episode and evidence IDs, carry a currently valid deterministic admission attestation, and preserve observed time plus `valid_from`/`valid_to`. Idempotent mutations must close superseded or contradicted relations without erasing history; episode tombstone or admission revocation must remove recall authority before projection cleanup and transitively requalify every dependent object. Provide a deterministic in-memory GraphEngine used by all local tests. Define the authenticated Graphiti+Neo4j remote projection contract and an injected direct-Neo4j fallback boundary; neither backend may decide truth, authorization, admission, or ontology, and backend loss must rebuild from encrypted vault records with equivalent hashes. Accept only a typed allowlisted query AST with workspace, starting entities, relation types, direction, `as_of`, and `max_hops`; default to 3 hops, reject above 5, reject raw Cypher and unknown fields before any backend call, and compile only parameterized backend requests. Revalidate backend results against canonical scope, admission, provenance, tombstones, and temporal validity before returning cited paths. Prove KG-AC01–09 and KG-AC12 using deterministic fixtures covering aliases explicitly bound to one entity, incompatible homonyms, contradiction/supersede history, `as_of`, cited three-hop paths, six-hop/raw-Cypher rejection, backend loss/rebuild, episode tombstone, admission revocation, cross-workspace indistinguishability, Graphiti failure with direct-Neo4j fallback, idempotence, encryption, and projection failure recovery. Tests must perform no network access and require no Graphiti, Neo4j, Hindsight, Ollama, credentials, container, or real vault."
    inputs:
      - "architecture_review"
      - "interface_contract"
      - "module_map"
      - "test_strategy"
      - "feedback_policy"
      - "ubiquitous_language"
      - "design_concept"
      - "Completed impact_assessment receipt"
