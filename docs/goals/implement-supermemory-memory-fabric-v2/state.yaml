          - "WM-AC07 immediate compact SessionStart rehydration"
          - "WM-AC08 real opt-in model-visible offload replacement"
          - "WM-AC13 stale-map tombstone invalidation"
          - "WM-AC14 derived purge plus content-free attestation"
          - "WM-AC17 corrupt-map rejection/rebuild"
          - "WM-AC19 Working token/permission/round-trip doctor"
        traceability_gap: "There is no versioned executable 45-ID acceptance registry; existing release matrix covers an older 80-ID contract instead."
      security_and_migration_findings:
        - "Exact working_set_id is enforced across MCP/daemon recall and cross-workspace misses are indistinguishable; this secure contract migration is implemented."
        - "Remote graph runtime is not wired, so canonical client-side revalidation is not exercised against graphd."
        - "graphd bearer is global although contract text says workspace-scoped; bind credentials to workspace before enabling remote use."
        - "Keep graphd endpoint HTTPS with certificate validation or loopback through an authenticated SSH tunnel; reject arbitrary HTTP hosts."
        - "Encrypt or content-minimize the durable server improve queue and keep it candidate-only; it must never become canonical authority."
        - "Add a v3 normalizer/migration with v1/v2 flags-off equivalence and explicit full-stack activation; do not rewrite immutable vault artifacts."
        - "Remove canary/progressive deployment requirements from the normative v2 blueprint and readiness path; isolated sacrificial integration tests may remain tests, not rollout."
