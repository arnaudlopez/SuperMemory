  - id: T013
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit the Working Memory and Evidence Ledger milestone for durability truth, encryption, scoping, rebuildability, quota semantics, fail-open behavior, and readiness for the temporal knowledge graph."
    inputs:
      - "T004 receipt"
      - "T004 diff and full verification output"
      - "Blueprint WM and Evidence Ledger contracts"
    constraints:
      - "Read-only."
      - "Reject acknowledgements that overstate durability or reopenability, canonical plaintext duplication, cross-scope leakage, unsafe eviction, or output suppression on degraded captures."
    expected_output:
      - "approve | reject"
      - "Working Memory/Evidence Ledger milestone evidence"
      - "Exact temporal knowledge graph Worker package if approved"
      - "allowed_files, verify, and stop_if"
    receipt:
      result: done
      decision: rejected
      full_outcome_complete: false
      rationale: "The focused 38-test suite passes, encryption and acknowledgement degradation are sound, and offload never suppresses output. The milestone is nevertheless unsafe for graph work. Working state, pins, and tombstones are stored in one rewritable `state.json.aead`, contrary to the blueprint’s independent framed journals. Rebuild starts from capture events alone, resets pins/tombstones, and rewrites canonical episodes active, so projection corruption can resurrect deleted evidence. Read/mutation APIs bind only workspace plus opaque IDs, not the expected project/session, and rebuild trusts caller scope instead of validating every source record. Selection also preserves stale eviction status, producing a different result from rebuild. These are authority, isolation, and deletion-safety failures."
      worker_package:
        objective: "Repair the T004 Working Memory/Evidence Ledger milestone before any graph work. Replace the monolithic rewritable working state with the blueprint’s encrypted manifest plus independently framed, append-only evidence/checkpoint/tombstone mutation journals; each frame must carry sequence and previous-frame hash, use AEAD, fsync before acknowledgement, and support deterministic replay. Treat capture payloads and canonical episode records as authority while keeping Working indexes rebuildable; store only episode references in projections. Persist pin/unpin and tombstone mutations independently so corruption or deletion of derived state cannot lose them. Tombstones must be authoritative before episode/index projection changes, survive injected crashes, deny reopening immediately, and remain applied during every rebuild. Recompute selection from all eligible non-tombstoned records so incremental state and rebuild are identical, while preserving pins and explicit over-capacity state. Require and validate workspace, project, session, working-set, and evidence bindings on reads and mutations; validate every capture record during rebuild and reject cross-project/session records indistinguishably from unknown IDs. Validate fork parents in the same scope, make sibling forks distinct, and implement persisted opaque prefixed UUIDv7 working/evidence/episode identities while retaining stable resume and event idempotence. Preserve truthful capture acknowledgements, encrypted spool fail-open behavior, disabled-by-default compatibility, canonical payload non-duplication, and permanent offload non-replacement. Add adversarial tests for cross-scope access, forged rebuild scope, pin/tombstone survival, fault boundaries, journal corruption/truncation, deterministic selection/rebuild, sibling forks, and safe migration or explicit rejection of the interim T004 state format. Do not begin graph, ontology, improve, Active Map, MCP recall, lifecycle UI, installer, deployment, or production rollout."
        allowed_files:
          - scripts/lib/codex-working-set-store.mjs
          - scripts/lib/codex-working-set-index.mjs
          - tests/codex-working-set-store.test.mjs
          - tests/codex-working-set-index.test.mjs
          - scripts/lib/codex-working-offload.mjs
