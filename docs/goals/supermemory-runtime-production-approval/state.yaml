version: 2

goal:
  title: "SuperMemory Runtime Production Approval"
  slug: "supermemory-runtime-production-approval"
  kind: existing_plan
  tranche: "Validate the existing hardening, produce fresh local live evidence, close runtime gaps, and reach an explicit production decision."
  status: done
  oracle:
    signal: "Contract gate passes, strict local preflight is ready, fresh redacted live smoke evidence passes on a sacrificial local bank, runtime_ready is true, and post-evidence production approval is explicit."
    cadence: "after the live-smoke package, after any runtime fix package, and at final audit"
    final_proof: "T999 records full_outcome_complete: true and cites contract, live smoke, runtime, production decision, secret hygiene, and diff evidence."
  intake:
    original_request: "Ok va y. Objectif production ready"
    interpreted_outcome: "Make the supported local-first SuperMemory operator surface genuinely production-ready with real Hindsight runtime proof and explicit approval."
    input_shape: existing_plan
    audience: "SuperMemory owner and operator"
    authority: approved
    proof_type: decision
    completion_proof: "Fresh local live evidence and all three readiness levels are proven, followed by a final audit."
    likely_misfire: "Calling mock-only contract readiness production readiness or writing to a non-sacrificial/cloud target."
    blind_spots_considered:
      - "Missing live environment values"
      - "Stale prior evidence"
      - "Container and localhost binding health"
      - "Sacrificial bank isolation"
      - "Secret leakage"
      - "Rollback and partial writes"
      - "Uncommitted existing changes"
      - "Post-evidence owner approval"
    existing_plan_facts:
      - "33 Node tests passed after the hardening implementation."
      - "The release verifier reports contract_ready true, runtime_ready false, production_ready false."
      - "The last runtime check was blocked by missing live env and evidence about 1291 hours old."
      - "The local-first production runbook and strict preflight already exist."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
