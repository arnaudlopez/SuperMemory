      decision: approved
      summary: "Acceptance is concrete. Approve a complete red package for owner auth, portfolio recall, canonical mutations, API/provider, capture/action receipts and runtime v7."
      architecture_review: "Use dedicated deep modules; daemon is composition/transport only. Reuse AEAD, redaction, locks and workspace contexts. Canonical commit precedes projections. Checkout MCP remains unchanged. Hermes has no engine credentials. Action connectors remain independent."
      approved_design_concept: "T001 approved."
      approved_ubiquitous_language: "T001 approved."
      feedback_policy: "Targeted tests per patch, v24 per slice, v23/secrets for auth and deploy, full suite at T005."
      test_strategy: "Black-box Node and Python contracts first; Hindsight, GraphD, Gmail and Calendar mocked; no live credentials."
      module_map: "T001 approved; new modules instead of extending hotspots."
      interface_contract: "T001 approved including 8K card, coverage states, revisions, direct-turn intent and governed receipts."
      exact_worker_objective: "Write complete failing v2.4 tests and verifier only."
