active_task: null
tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: "Turn the mature request into a concrete acceptance contract before any implementation work."
    inputs:
      - "goal.md"
      - "acceptance-contract.md"
      - "Current repository source, tests, scripts, docs, and dirty worktree status"
    constraints:
      - "Read-only."
      - "Do not edit product files."
      - "Do not start implementation."
      - "Prefer observable owner outcomes over internal task completion."
    expected_output:
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "interface_contract: public behavior and boundaries that tests should target"
      - "test_strategy: acceptance tests, unit/integration boundaries, mocks, browser or visual checks if relevant"
      - "feedback_policy: targeted test cadence, typecheck, browser checks, and full-suite timing"
      - "acceptance_contract_updates: exact end-state evidence and failure modes"
      - "dirty_worktree_risk_map: unrelated files that must stay untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Read-only Scout mapping completed against the checked-out source and Codebase Memory project SuperMemory (10188 nodes, 16948 edges). The safest architecture adds deep Personal Manager modules beside the existing v2.3 seams instead of extending the 641-line daemon or owner preference store with all policy."
      design_concept: "Hermes has one memory provider, supermemory-fabric, and any number of independent action connectors. The provider is an untrusted edge adapter that talks only to a dedicated Personal Manager API. Server-side AgentScope, ExplicitIntentGate, canonical revision command bus, portfolio recall and governed capture preserve authority. Canonical commit precedes Hindsight and GraphD projections. Action connectors consume memory context but retain their own permissions; only reduced redacted receipts flow back to memory."
      ubiquitous_language:
        Memory Plane: "supermemory-fabric plus governed Personal Manager API; never a synonym for all Hermes tools"
        Action Plane: "Hermes-native Gmail, Calendar and other connectors; not implemented by SuperMemory"
        AgentCredential: "owner-bound Z2 credential with pm capabilities; distinct from checkout and daemon tokens"
        ResolvedAgentScope: "immutable server-derived owner and allowed-project set"
        Personal Context Card: "cited authorized prefetch projection capped at 8000 tokens"
        portfolio recall: "bounded fan-out over owner plus every active owned project with explicit coverage"
        explicit mutation: "add, update, resolve or supersede entailed by the current direct user message"
        canonical revision: "append-only current-state revision with temporal supersession links"
        action receipt: "reduced redacted connector outcome; not the raw connector payload"
        forbidden_synonyms:
          - "provider unique = outil unique"
          - "omniscient = bypass workspace isolation"
          - "retain = canonical commit"
          - "memory context = execution authorization"
      module_map:
        identity_and_scope:
          - "scripts/lib/checkout-credential-store.mjs as cryptographic/storage pattern"
          - "scripts/lib/request-scope-resolver.mjs as fail-closed assertion pattern"
          - "scripts/lib/project-registry.mjs owner and active-project source"
        runtime_and_recall:
          - "scripts/lib/workspace-runtime-supervisor.mjs context cache and owner/project merge"
          - "scripts/lib/workspace-runtime-context.mjs workspace-bound router factory"
          - "scripts/lib/codex-evidence-coverage.mjs and codex-retrieval-plan.mjs for coverage semantics"
        canonical_mutation:
          - "scripts/lib/codex-workspace-store.mjs canonical memory/evidence substrate"
          - "scripts/lib/memory-authority-policy.mjs temporal authority"
          - "scripts/lib/registry-transaction.mjs locking"
          - "scripts/lib/hindsight-authority-gateway.mjs projection and recall revalidation"
        capture:
          - "scripts/lib/codex-redaction.mjs shared redaction"
          - "scripts/lib/codex-spool.mjs AEAD durable queue"
          - "scripts/lib/codex-capture-store.mjs evidence journal"
          - "scripts/lib/canonical-knowledge-worker.mjs governed promotion"
        api:
          - "scripts/lib/supermemory-daemon.mjs composition root and HTTP boundary"
          - "new scripts/lib/personal-manager-api.mjs should own route dispatch and limits to avoid growing the high-risk daemon hotspot"
        provider:
          - "new integrations/hermes/plugins/memory/supermemory_fabric Python package with HTTP client, schemas and durable spool; no engine credentials or runtime upgrades"
        ui:
          - "scripts/supermemory-app.mjs local proxy"
          - "web/index.html, web/app.js, web/styles.css Personal Manager tab and receipts"
        runtime_deploy:
          - "scripts/lib/codex-runtime-config.mjs v7 additive normalization"
          - deploy/runtime/runtime-contract.production.json
          - "deploy/portainer/supermemory-ai-stack.yml and env example"
        shallow_module_risks:
          - "Do not overload owner-preference-store with five domains and revision semantics"
          - "Do not place all new route logic in createSuperMemoryDaemon, already complexity 99/cognitive 198"
          - "Do not duplicate redaction or workspace authorization in Python"
          - "Do not let UI call the daemon with agent secrets"
      interface_contract:
        provider: "MemoryProvider lifecycle initialize, queue_prefetch, prefetch, sync_turn, session switch, tool schemas, tool dispatch and shutdown; provider calls only /v1/personal-manager endpoints"
        auth: "Agent token plus agent/device/audience binding resolves owner and projects server-side; raw workspace IDs are forbidden in Hermes tool schemas"
        recall: "modes auto, project, portfolio, historical return results, citations, searched/failed project sets and complete|partial|abstain coverage"
        context: "POST /context returns <=8000 token cited card and never inactive or unauthorized memory"
        mutations: "POST /commands accepts idempotency key, expected revision and signed turn attestation; add/update/resolve/supersede commit revisions; forget is plan/apply"
        intent: "ExplicitIntentGate authorizes only fields entailed by the direct current user message and cannot consume recalled/tool text as authority"
        capture: "POST /capture accepts only visible user, final assistant and reduced receipts after redaction; ordinary sync_turn cannot activate memory"
        actions: "Gmail/Calendar remain Hermes tools; SuperMemory supplies context and ingests governed receipts but does not authorize or execute connector actions"
        ui: "browser uses existing owner Web auth/proxy and never receives agent, daemon or engine credentials"
      test_strategy:
        first_red_package: "agent credential/scope plus runtime v7 contracts, portfolio recall/context card, canonical command bus and negative intent/replay tests"
        unit: "credential hashing and capabilities; scope resolution; portfolio planner/coverage; card budgeting; intent entailment; revision/idempotency; capture and receipt normalization"
        integration: "daemon personal routes with owner plus three projects; Hindsight and GraphD mocked per workspace; Python provider against mock daemon; connector receipt round-trip"
        security: "forged workspace, checkout token as agent, replayed nonce, recalled prompt injection, tool-output authority, bulk mutation, unconfirmed forget and direct-engine configuration"
        ui: "API-backed Personal Manager tab plus browser DOM assertions; visual Playwright only after deterministic UI tests"
        infra: "static Compose/runtime/secrets references and healthcheck assertions; no live credentials"
        full: "targeted tests after each module; v24 verifier after each vertical slice; npm test and all release/production regressions at final verification"
      feedback_policy: "Run the smallest affected node:test or Python unittest after every patch. Run v24 contract verification after each vertical slice. Run v23 plus secret hygiene whenever auth, daemon, runtime or deploy changes. Run full npm test, verify, release and production only after targeted suites are green. Use browser checks only after API and DOM contracts pass."
      acceptance_contract_updates:
        - "Prove provider memory uniqueness without forbidding action connectors."
        - "Prove owner agent sees all active owned projects while checkout MCP remains project-bound."
        - "Prove same-turn read-after-write from canonical state when Hindsight is down."
        - "Prove recalled or connector text cannot authorize memory or external action."
        - "Prove draft, create-draft and send semantics remain distinct in mocked Gmail flow."
        - "Prove restart durability, idempotency, temporal as_of history and projection recovery."
        - "Report live Z2, Gmail and OAuth checks as pending unless credentials and separate authorization exist."
      dirty_worktree_risk_map: "Preserve unknown untracked .cbmignore, .codex/, .playwright-cli/, output/, and pre-existing goal directories deploy-codex-supermemory-desktop, design-codex-supermemory-integration and implement-codex-supermemory-integration. docs/README.md and docs/personal-manager-hermes-blueprint.md are task-related changes from the preceding blueprint turn. Limit new product edits to Judge-approved files and inspect overlap before every patch."
      impact_assessment:
        db_schema_migrations: "No SQL migration. New encrypted append-only agent credential, revision, audit and receipt stores require schema versioning and atomic migration tests."
        data_backfill: "None required. Runtime v6 to v7 is additive; existing owner preferences remain readable and can migrate lazily without rewriting the vault."
        env_secrets: "New Hermes agent token secret reference and possibly Hermes runtime credentials. Tests use generated fixtures only; no live secret values committed."
        auth_permissions: "Material: new owner-bound pm:context, pm:recall, pm:capture, pm:write and pm:resolve capabilities; checkout permissions remain unchanged."
        api_contract: "Material: dedicated /v1/personal-manager context, recall, get, capture, commands, operation, forget and status routes with separate middleware."
        ui_routes: "Existing local Web server gains proxied Personal Manager reads/actions and a new tab; browser never receives agent token."
        background_jobs: "Durable capture/action-receipt spool and asynchronous Hindsight/GraphD projection reconciliation; canonical write remains synchronous."
        external_services: "Hermes runtime is added. Gmail/Calendar are mocked or sandboxed and remain separately installed native connectors; no live action in implementation."
        deploy_rollback: "Additive Hermes service and runtime v7. Rollback disables Hermes/routes and returns to v6 while retaining new audit revisions; backup and restore contracts required."
        observability: "Add hashed-cardinality metrics for prefetch, coverage, command status, replay rejection, queue depth and projection lag without content."
        docs: "Blueprint already exists; add provider README, upstream receipt, runtime/deployment and operator documentation."
