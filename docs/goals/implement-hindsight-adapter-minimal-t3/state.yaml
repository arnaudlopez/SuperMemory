  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/implement-hindsight-adapter-minimal-t3/"
    command: "npx goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-hindsight-adapter-minimal-t3"

active_task: T998

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map the existing T0/T1/T2 verification surfaces and identify the safest T3 adapter insertion point."
    inputs:
      - "README.md"
      - "docs/llm-first-migration-plan.md"
      - "docs/golden-case-implementation-roadmap.md"
      - "docs/golden-case-tdd-matrix.md"
      - "identity-vault/75_governance"
      - "identity-vault/90_evals/cases/memory-contracts"
      - "identity-vault/90_evals/cases/m1-hindsight-promotion-recall"
      - "scripts"
      - "tests"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Prefer concrete file-path evidence over generic advice."
      - "Do not assume a real Hindsight runtime exists; report evidence either way."
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "Repo evidence for T0/T1/T2 current verification surfaces."
      - "Candidate T3 fixture/script/test file paths."
      - "Recommended minimal adapter boundary."
      - "Risks around real runtime integration versus fake/local contract."
      - "module_map: current modules, future adapter boundary, and files likely in scope."
      - "ubiquitous_language: HindsightAdapter, HindsightDocument, PromotionPayload, ValidatedMemory, RecallPolicy, AnswerEvidence, InterpretationCandidate."
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs."
    receipt:
      result: done
      summary: "Mapped T0/T1/T2 verification and found the safest T3 insertion point: a new fake/local adapter eval case plus verifier wired into the global specs."
      evidence:
        - "scripts/verify-supermemory-specs.mjs runs memory contracts, M1 promotion/recall, identity vault TDD, enterprise target, and JSONL checks."
        - "scripts/verify-memory-contracts.mjs enforces T1 provenance, do_not_use, fail-closed recall policy, answer evidence, and interpretation invariants."
        - "scripts/verify-m1-hindsight-promotion-recall-fixture.mjs validates Source -> Snapshot -> Observation -> InterpretationCandidate -> ValidatedMemory -> HindsightPromotionPayload -> AnswerEvidence."
        - "identity-vault/90_evals/cases/m1-hindsight-promotion-recall/input/fixture.json contains active and do_not_use Acme memories plus the governed promotion payload shape."
        - "identity-vault/75_governance/hindsight_contract.md says Hindsight is adopted memory engine, vault remains source of truth, adapter consumes governed memory only."
        - "docs/golden-case-tdd-matrix.md already defines T3.1-T3.6 for upsert, fail-closed tags, provenance metadata, do_not_use exclusion, no global auto-retain, and recall failure traces."
      recommended_boundary: "Implement a contract-level local adapter fixture/verifier, not a real Hindsight runtime: validate retain/upsert/delete/recall behavior over governed promotion payloads and recall policies."
      candidate_files:
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/input/fixture.json"
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/expected/assertions.json"
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/expected/adapter-state.json"
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/expected/answer-evidence.json"
        - "scripts/verify-hindsight-adapter-minimal.mjs"
        - "tests/hindsight-adapter-minimal.test.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      module_map:
        current_modules:
          - "T1 contracts: identity-vault/90_evals/cases/memory-contracts plus scripts/verify-memory-contracts.mjs."
          - "T2/M1 vertical fixture: identity-vault/90_evals/cases/m1-hindsight-promotion-recall plus scripts/verify-m1-hindsight-promotion-recall-fixture.mjs."
          - "Global oracle: scripts/verify-supermemory-specs.mjs."
          - "Governance docs: identity-vault/75_governance/hindsight_contract.md and memory_engine_ports.md."
        t3_boundary: "New HindsightAdapter contract fixture and verifier living beside existing eval cases; no production runtime, DB, service, or credential dependency."
        shallow_module_risks:
          - "Copying M1 checks into a second verifier without modeling adapter state would miss the upsert/recall boundary."
          - "Using natural-language-only docs would not prove fail-closed behavior."
          - "Introducing real runtime code now would make credentials and external availability the proof instead of contract behavior."
      ubiquitous_language:
        - "HindsightAdapter: minimal port that retains/upserts/deletes governed HindsightDocument records and recalls through scoped policy."
        - "HindsightDocument: adapter-side indexed document derived from a governed promotion payload, never source of truth."
        - "PromotionPayload: vault-governed active memory handoff with document_id, tags, and provenance metadata."
        - "ValidatedMemory: governed vault memory that may be active, historical_only, or do_not_use."
        - "RecallPolicy: fail-closed filter contract requiring workspace/access/status/tags."
        - "AnswerEvidence: source-backed record tying recall results to used memory and cited snapshots."
        - "InterpretationCandidate: LLM-first meaning proposal that must already be approved before active memory promotion."
      impact_assessment:
        db_schema_migrations: "none"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "no runtime permissions; verify access_policy/workspace tags only"
        api_contract: "local adapter contract only; no public API"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none; real Hindsight runtime deferred"
        deploy_rollback: "not applicable beyond reverting fixture/script/test changes"
        observability: "adapter trace assertions for recall miss/delete/upsert behavior"
        docs: "docs should be updated after behavior is green"

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve the T3 architecture and select the largest safe implementation slice."
    inputs:
      - "T001 receipt"
      - "Goal oracle"
    constraints:
      - "Do not implement."
      - "Reject any plan that makes Hindsight a source of truth."
      - "Reject raw LLM conclusions entering adapter recall."
      - "Prefer fake/local adapter contract first unless real runtime evidence is compelling and verifiable."
      - "Pick the largest safe useful Worker slice with clear allowed_files, verify commands, and stop conditions."
    expected_output:
      - "Decision: approved | blocked | needs_more_evidence"
      - "architecture_review"
      - "design_concept"
      - "interface_contract"
      - "module_map"
      - "test_strategy"
      - "feedback_policy"
      - "impact_assessment_ref"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Blocked or deferred tasks"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      architecture_review: "Approved. T3 should implement a fake/local HindsightAdapter contract first. Hindsight remains an adapter/index; the vault remains source of truth. The Worker must prove adapter state behavior, not only payload shape."
      design_concept: "SuperMemory promotes governed ValidatedMemory payloads into a minimal adapter index. The adapter upserts by stable document_id, deletes/excludes forbidden documents, recalls only through fail-closed scoped filters, and returns traces/answer evidence that point back to vault provenance."
      interface_contract:
        retain: "accept only active governed promotion payloads with document_id, restrictive tags, and metadata.source_id/snapshot_id/observation_id/interpretation_id/memory_id"
        upsert: "same document_id replaces adapter-side content instead of creating duplicates"
        delete_or_exclude: "do_not_use or revoked memory removes the adapter document or prevents active recall"
        recall: "requires fail_closed policy with workspace, access_policy, and status:active filters"
        evidence: "recall-derived answers must cite used_memory_ids, cited_snapshot_ids, document_id, and adapter trace ids"
      module_map:
        allowed_new_case: "identity-vault/90_evals/cases/hindsight-adapter-minimal"
        allowed_verifier: "scripts/verify-hindsight-adapter-minimal.mjs"
        allowed_test: "tests/hindsight-adapter-minimal.test.mjs"
        allowed_global_wiring: "scripts/verify-supermemory-specs.mjs"
        deferred_docs: "T004 updates README/roadmap/PRD/governance after executable behavior is green."
      test_strategy:
        red: "First add T3 fixture/assertions and global verifier wiring so node scripts/verify-supermemory-specs.mjs fails because scripts/verify-hindsight-adapter-minimal.mjs is missing or incomplete."
        green: "Implement verifier logic for T3.1-T3.6 and prove T0/T1/T2/global specs pass."
        regression: "Add a Node test wrapper matching existing tests."
      feedback_policy: "Use deterministic checks only for hard adapter invariants; do not test exact LLM wording beyond required metadata/provenance/use-pattern boundaries."
      impact_assessment_ref: "T001 receipt impact_assessment"
      worker_objective: "Implement T3 minimal fake/local adapter fixture, verifier, Node test, and global spec wiring."
      allowed_files:
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/input/fixture.json"
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/expected/assertions.json"
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/expected/adapter-state.json"
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/expected/answer-evidence.json"
        - "identity-vault/90_evals/cases/hindsight-adapter-minimal/actual/README.md"
        - "scripts/verify-hindsight-adapter-minimal.mjs"
        - "tests/hindsight-adapter-minimal.test.mjs"
        - "scripts/verify-supermemory-specs.mjs"
      verify:
        - "node scripts/verify-hindsight-adapter-minimal.mjs"
        - "node --test tests/hindsight-adapter-minimal.test.mjs"
        - "node scripts/verify-supermemory-specs.mjs"
        - "git diff --check"
      stop_if:
        - "Need real Hindsight credentials, runtime, network service, env secrets, production access, DB migration, or destructive operation."
        - "Need files outside allowed_files before T003 is complete."
        - "Cannot produce a meaningful red failure before implementation."
        - "Implementation would weaken T0/T1/T2 or global specs."
        - "Verification fails twice for the same unexplained reason."
      blocked_or_deferred_tasks:
        - "Real Hindsight runtime integration remains deferred until the local adapter contract is green."
        - "Docs alignment remains T004."

