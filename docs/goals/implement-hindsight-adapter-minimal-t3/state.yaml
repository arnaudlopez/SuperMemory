      design_delta: "T3 now proves a contract-level HindsightAdapter boundary: governed active payloads are retained/upserted by document_id, do_not_use payloads delete/exclude documents, recall is fail-closed by required tags, unpromoted raw vault items are not auto-retained, recall misses carry traces, raw LLM conclusions are rejected, and answer evidence cites adapter trace plus source snapshots."
      interface_contract:
        retain: "active promotion payloads require document_id, scoped tags, source/snapshot/observation/interpretation/memory provenance, and text"
        upsert: "repeated active promotions with the same document_id leave one active adapter document with the latest governed memory_id/content"
        delete_or_exclude: "do_not_use payloads remove the adapter document and forbid active recall"
        recall: "only fail_closed policies with workspace, access_policy, status:active, and consumer tags return documents"
        trace: "retain/delete/recall produce deterministic trace ids; recall misses include diagnostics"
      notes:
