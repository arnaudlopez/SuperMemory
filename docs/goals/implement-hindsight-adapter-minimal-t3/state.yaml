version: 2

goal:
  title: "T3 Minimal Hindsight Adapter"
  slug: "implement-hindsight-adapter-minimal-t3"
  kind: specific
  tranche: "Implement a minimal governed Hindsight adapter contract that consumes only validated promotion payloads, upserts by stable document_id, recalls fail-closed, and preserves source-backed answer evidence."
  status: active
  oracle:
    signal: "A T3 executable verifier is wired into node scripts/verify-supermemory-specs.mjs and proves governed promotion/upsert/recall behavior while all T0/T1/T2 specs remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T3 verifier pass, global specs pass, git diff --check pass, GoalBuddy final quality check pass, commit SHA, pushed branch, and final audit with full_outcome_complete: true."
  intake:
    original_request: "OK, entame le prochain goal"
    interpreted_outcome: "Start the next implementation goal after green T0/T1/T2: T3 minimal governed Hindsight adapter."
    input_shape: specific
    audience: "SuperMemory maintainers and future memory agents"
    authority: requested
    proof_type: test
    completion_proof: "A T3 fixture/verifier proves the minimal adapter contract end to end, global SuperMemory specs pass, and the work is committed and pushed."
    likely_misfire: "Building a real Hindsight runtime integration or broad ingestion pipeline before proving the narrow governed adapter boundary, or letting raw LLM conclusions bypass the vault."
    blind_spots_considered:
      - "T2/M1 proves the governed promotion/recall fixture, not a runtime adapter."
      - "Real Hindsight runtime availability may be absent or unnecessary for the first T3 slice."
      - "Adapter tests must preserve LLM-first interpretation flexibility while keeping hard governance deterministic."
      - "The adapter must not become a second source of truth."
    existing_plan_facts:
      - "T0/T1/T2 are implemented and green."
      - "InterpretationCandidate is the LLM-first boundary before MemoryCandidate/ValidatedMemory."
      - "ValidatedMemory and promotion payloads already carry provenance expectations including interpretation_id."
      - "T3 should begin with a minimal fake/local adapter contract unless evidence proves real Hindsight integration is safe."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

