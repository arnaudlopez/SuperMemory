      - "Identify exact files and sections that need alignment."
    expected_output:
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "Current lifecycle vocabulary and relations already present."
      - "Gaps between docs, Golden Case and verification."
      - "Suggested files to edit in the next Worker task."
      - "Notes on any over-programmatic or under-flexible assumptions."
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "The lifecycle exists across PRD V2, living_memory, source_freshness, hindsight_contract, type_lifecycle, and the enterprise Golden Case, but it is distributed rather than expressed as one executable sequential/relational contract."
      design_concept: "SuperMemory is a governed living-memory protocol: mutable sources become immutable snapshots, snapshots yield observations, observations become candidate memories, validated memories create typed relations, and only governed active memory reaches Hindsight and agent answers."
      ubiquitous_language:
        - "Use Source, Snapshot, Observation, Memory Candidate, Validated Memory, Relation, Retrieval, Answer, Feedback/Change as the canonical flow vocabulary."
        - "Keep Source as a mutable pointer and Snapshot as immutable proof."
        - "Use freshness/status terms already present: fresh, stale, changed, conflicting, unavailable, needs_review, historical_only, do_not_use."
      module_map:
        - "docs/prd-memoire-agentique-v2.md owns the product architecture and should cite the canonical flow."
        - "identity-vault/75_governance/living_memory.md owns lifecycle semantics."
        - "identity-vault/75_governance/source_freshness.md owns mutable source and snapshot behavior."
        - "identity-vault/75_governance/hindsight_contract.md owns promotion/recall boundaries."
        - "identity-vault/75_governance/type_lifecycle.md and entity_type_registry.md own adaptive type creation."
        - "identity-vault/90_evals/cases/enterprise-living-memory-complete/expected/* owns the Golden Case oracle."
      gaps:
        - "No single architecture document currently defines the object graph, transition rules, relation verbs, and invariants end to end."
        - "The Golden Case covers the right behaviors but does not explicitly assert every canonical lifecycle object and relation."
        - "Target structure lists stable fields but lacks the full relation vocabulary needed to become a TDD contract."
        - "Verification checks concept strings, but not the sequential flow or relation vocabulary."
      over_programmatic_risk: "Avoid making one workflow per enterprise use case; keep use patterns flexible and relation vocabulary minimal."
      impact_assessment:
        db_schema_migrations: "none; docs/fixtures only"
        data_backfill: "none"
        env_secrets: "none"
        auth_permissions: "no runtime auth change; only access-policy vocabulary in docs"
        api_contract: "no runtime API change; docs define future contracts"
        ui_routes: "none"
        background_jobs: "none"
        external_services: "none"
        deploy_rollback: "none"
        observability: "verification scripts may add assertions only"
        docs: "primary impact"
