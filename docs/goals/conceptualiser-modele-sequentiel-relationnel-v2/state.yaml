version: 2
goal:
  slug: conceptualiser-modele-sequentiel-relationnel-v2
  title: Conceptualiser le modele sequentiel relationnel V2
  status: active
  created_at: "2026-05-20"
  updated_at: "2026-05-20"
  original_request: "prepapre ce travail"
  interpreted_outcome: "Aligner le modele sequentiel/relationnel abstrait de SuperMemory avec le Golden Case, les specs V2 et les structures finales TDD, sans coder le moteur."
  input_shape: specific
  audience: "Product/architecture team building SuperMemory"
  authority: requested
  proof_type: artifact
  completion_proof: "Docs/specs/fixtures/verifications prove one coherent sequential relational architecture and the enterprise Golden Case passes."
  goal_oracle: "The enterprise Golden Case exercises Source -> Snapshot -> Observation -> Memory Candidate -> Validated Memory -> Relations -> Retrieval -> Answer -> Feedback/Change and all verification commands pass."
  intake:
    completion_proof: "A final Judge audit maps the updated docs/specs/fixtures to the enterprise Golden Case oracle, with verification commands passing and no unresolved parallel truths between the sequential relational model, V2 specs and TDD target structures."
  oracle:
    signal: "The enterprise Golden Case explicitly exercises Source -> Snapshot -> Observation -> Memory Candidate -> Validated Memory -> Relations -> Retrieval -> Answer -> Feedback/Change, and the updated verification commands pass."
    final_proof: "Final Judge receipt states full_outcome_complete: true and cites passing verification for docs/specs/fixtures plus the Golden Case lifecycle assertions."
  likely_misfire: "Creating a theoretical model that is not exercised by the Golden Case or usable as TDD structure."
  non_goals:
    - "No SuperMemory engine implementation."
    - "No UI work."
    - "No new external connector integration."
    - "No replacement of Hindsight."
  constraints:
    - "Docs/specs/fixtures/verifications only."
    - "Keep Hindsight as the adopted default memory engine."
    - "Mutable sources are pointers; snapshots are proof."
    - "Business concepts remain adaptive and demand-created."
    - "Memory lifecycle must include freshness, change, conflict, history and governed recall."
  existing_plan_facts:
    - "Golden Case already exists and should become the oracle rather than be recreated from scratch."
    - "The target is architecture executable enough to become contracts, fixtures and tests."
