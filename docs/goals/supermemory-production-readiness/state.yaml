  goal_oracle: "The production readiness goal is complete when node scripts/verify-supermemory-release-readiness.mjs, node scripts/verify-supermemory-specs.mjs, git diff --check, and the GoalBuddy final quality check pass; CI contains the release readiness verifier; docs describe the production operator workflow and rollback; no secrets/live evidence are committed; and all changes are committed and pushed."
  oracle:
    signal: "The production readiness goal is complete when node scripts/verify-supermemory-release-readiness.mjs, node scripts/verify-supermemory-specs.mjs, git diff --check, and the GoalBuddy final quality check pass; CI contains the release readiness verifier; docs describe the production operator workflow and rollback; no secrets/live evidence are committed; and all changes are committed and pushed."
