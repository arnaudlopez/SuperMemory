rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_quality_checker: true
  require_tdd_worker_flow: true
  require_github_ship_task: true
  require_impact_assessment: true
  goal_pressure_requires_oracle: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false
  rationale: "Ready Mode is for app-code or product-behavior work after an LLM-first spec conversation has converged."

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true
  require_t998_shipping: true
  require_t999_final_audit: true
  protect_unrelated_dirty_worktree: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null
tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    objective: "Turn the mature request into a concrete acceptance contract before any implementation work."
    inputs:
      - "goal.md"
      - "acceptance-contract.md"
      - "Current repository source, tests, scripts, docs, and dirty worktree status"
    constraints:
      - "Read-only."
      - "Do not edit product files."
      - "Do not start implementation."
      - "Prefer observable owner outcomes over internal task completion."
    expected_output:
      - "design_concept: shared understanding, non-goals, and decision dependencies"
      - "ubiquitous_language: domain terms, overloaded words, and forbidden synonyms"
      - "module_map: relevant deep modules, boundaries, and shallow-module risks"
      - "interface_contract: public behavior and boundaries that tests should target"
      - "test_strategy: acceptance tests, unit/integration boundaries, mocks, browser or visual checks if relevant"
      - "feedback_policy: targeted test cadence, typecheck, browser checks, and full-suite timing"
      - "acceptance_contract_updates: exact end-state evidence and failure modes"
      - "dirty_worktree_risk_map: unrelated files that must stay untouched"
      - "impact_assessment covering db_schema_migrations, data_backfill, env_secrets, auth_permissions, api_contract, ui_routes, background_jobs, external_services, deploy_rollback, observability, and docs"
    receipt:
      result: done
      summary: "Mapped production readiness as a local-first operator release: consolidate existing safe scripts into one release verifier, one operator workflow surface, CI release gate, and production runbook without SaaS/cloud/connector expansion."
      design_concept: "Production readiness here means the repository can be shipped as a local-first governed operator tool. The product is ready when maintainers can verify and operate capture, refresh, reviewed Hindsight promotion, local Hindsight preflight/smoke, rollback, and audit through documented commands and one release gate, while live credentials and Hindsight Cloud remain explicit opt-ins."
      ubiquitous_language:
        canonical:
          - "production readiness"
          - "release preflight"
          - "operator workflow"
          - "local-first release"
          - "reviewed plan"
          - "owner confirmation"
          - "mock-only CI"
          - "local Hindsight Docker"
          - "cloud opt-in"
          - "release verifier"
          - "production runbook"
        overloaded:
          prod: "means local-first operator release in this pass, not hosted SaaS"
          live: "means explicit local Hindsight live write outside CI, not CI/network default"
          operator CLI: "may be a command index/orchestrator, not a framework rewrite"
        forbidden_synonyms:
          - "auto-cloud fallback"
          - "unreviewed promotion"
          - "implicit live write"
          - "broad connector sweep"
          - "SaaS launch"
      module_map:
        release_verifier: "scripts/verify-supermemory-release-readiness.mjs should become the top-level release gate"
        global_oracle: "scripts/verify-supermemory-specs.mjs remains the complete spec oracle"
        golden_workflow: "scripts/verify-golden-end-state-workflow.mjs proves end-state operator workflow coverage"
        manual_capture: "scripts/local-manual-capture.mjs plus tests/local-manual-capture-cli.test.mjs and scripts/verify-local-manual-capture-workflow.mjs"
        local_file_refresh: "scripts/local-file-source-refresh.mjs plus tests/local-file-source-refresh-cli.test.mjs and scripts/verify-local-file-source-refresh-workflow.mjs"
        hindsight_promotion: "scripts/hindsight-promote.mjs plus tests/hindsight-promote.test.mjs"
        hindsight_runtime: "compose.hindsight.yml, scripts/hindsight-local-live-smoke-preflight.mjs, scripts/hindsight-live-smoke-runner.mjs, scripts/hindsight-transport.mjs"
        ci: .github/workflows/supermemory-specs.yml
        docs: "README.md and a new docs/production-runbook.md"
        goal_notes: "docs/supermemory-production-readiness-notes.md and docs/goals/supermemory-production-readiness/"
      interface_contract:
        release_command: "node scripts/verify-supermemory-release-readiness.mjs --json emits status, checks, commands, docs, ci, security, and no-live-write evidence"
        default_release_behavior: "mock-only, no secrets required, no live network writes, no Hindsight Cloud fallback"
        operator_surface: "a stable operator workflow script or command index must expose supported phases and point to existing deep commands without bypassing reviewed-plan gates"
        docs_contract: "README links to production runbook; runbook covers setup, release preflight, capture/refresh/promotion, local Docker Hindsight, fake vs real smoke, cloud opt-in, rollback, observability, credentials, non-goals"
        ci_contract: "CI runs the release readiness verifier after existing specs without live env"
        security_contract: "tracked files must not include obvious secret-like values or tmp live-smoke evidence as release artifacts"
      test_strategy:
        red_first:
          - "Add a release readiness test/verifier expectation before implementation so missing scripts/docs/CI wiring fail."
          - "Add an operator workflow contract test before adding the operator surface."
        green_commands:
          - "node --test tests/supermemory-release-readiness.test.mjs"
          - "node scripts/verify-supermemory-release-readiness.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
        integration_boundaries:
          - "Use child process checks for existing Node verifiers."
          - "Keep CI/live checks mock-only."
          - "Inspect docs and workflow text for required command references."
          - "Do not use real credentials or live writes in tests."
        failure_modes:
          - "missing runbook"
          - "missing CI release gate"
          - "tracked tmp evidence"
          - "secret-like tracked artifact"
          - "operator workflow omits reviewed plan gates"
          - "implicit cloud fallback wording"
          - "release verifier omits critical TDD commands"
      feedback_policy: "Run focused release-readiness tests after each worker slice, then global specs and whitespace before Judge review. Full global release gate should run before T998 shipping."
      acceptance_contract_updates:
        final_evidence:
          - "node scripts/verify-supermemory-release-readiness.mjs passes"
          - "node scripts/verify-supermemory-specs.mjs passes"
          - "git diff --check passes"
          - "GoalBuddy final quality check passes"
          - "CI includes release readiness verifier"
          - "README links production runbook"
          - "production runbook covers setup/preflight/smoke/rollback/observability/credentials/non-goals"
          - "release verifier proves no tracked tmp live evidence or obvious secrets"
          - "T998 commit SHA and push proof"
          - "T999 final production-readiness audit"
        first_slice: "Release readiness verifier plus tests and runbook skeleton should fail red before implementation, then pass green without credentials."
        known_non_goals:
          - "hosted SaaS UI"
          - "external connectors"
          - "real customer data"
          - "database migrations"
          - "background workers"
          - auth/RLS
          - billing
          - "multi-tenant web deployment"
          - "Hindsight Cloud requirement"
          - "live writes in CI"
      dirty_worktree_risk_map: "Current dirty files are the newly generated production-readiness notes and GoalBuddy board only. Future workers must not touch tmp live smoke evidence, unrelated historical goals, or identity-vault raw memory unless explicitly allowed."
      impact_assessment:
        db_schema_migrations: none
        data_backfill: none
        env_secrets: "env var names only; no secrets or env files"
        auth_permissions: none
        api_contract: "local CLI/verifier contract only, no hosted API"
        ui_routes: none
        background_jobs: none
        external_services: "local Docker Hindsight is documented/preflighted but release tests remain mock-only"
        deploy_rollback: "revert release verifier, operator workflow, docs, CI wiring, and board commits"
        observability: "release verifier JSON/text report, existing smoke evidence paths, runbook audit trail"
        docs: "README plus production runbook plus GoalBuddy receipts"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    objective: "Approve the acceptance contract and choose the largest safe red-test package."
    inputs:
      - "T001 receipt"
      - "Updated acceptance-contract.md if T001 changed it"
    constraints:
      - "Do not implement."
      - "Reject implementation work before tests can express the oracle."
      - "Reject vague acceptance criteria that cannot be verified."
      - "Choose a useful vertical slice, not tiny helper-only work."
    expected_output:
      - "Decision: approved | needs_more_evidence | blocked"
      - "Approved design_concept"
      - "Approved ubiquitous_language"
      - "feedback_policy"
      - "test_strategy"
      - "module_map"
      - "interface_contract"
      - "architecture_review"
      - "Exact Worker objective for red tests"
      - "allowed_files for T003"
      - "verify commands for T003"
      - "stop_if conditions for T003"
      - "impact_assessment_ref"
    receipt:
