          - "node scripts/verify-supermemory-release-readiness.mjs"
          - "node scripts/verify-supermemory-specs.mjs"
          - "git diff --check"
        mocking: "Use filesystem and child_process checks only; CI/live Hindsight remain mock-only."
      module_map:
        red_test: tests/supermemory-release-readiness.test.mjs
        release_verifier: scripts/verify-supermemory-release-readiness.mjs
        operator_surface: scripts/supermemory-operator.mjs
        runbook: docs/production-runbook.md
        readme: README.md
        ci: .github/workflows/supermemory-specs.yml
        existing_oracles:
