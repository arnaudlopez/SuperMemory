      - "git diff --check"
    stop_if:
      - "Need DB migration, schema change, backfill, env/secret, auth/RLS/permission, external service, background job, deploy, or rollback work outside allowed_files."
      - "No meaningful failing test can be written."
      - "T003 is not green."
      - "Need to alter behavior instead of documenting it."
    receipt:
      result: done
      summary: "Aligned README, roadmap, TDD matrix, PRD, source freshness policy, and agent manual with implemented T5 source-change behavior."
      changed_files:
        - "README.md"
        - "docs/golden-case-implementation-roadmap.md"
        - "docs/golden-case-tdd-matrix.md"
        - "docs/prd-memoire-agentique-v2.md"
        - "identity-vault/75_governance/source_freshness.md"
        - "identity-vault/AGENTS.md"
      commands:
        - cmd: "node scripts/verify-supermemory-specs.mjs"
          status: pass
        - cmd: "node --test tests/source-change-t0-t1.test.mjs"
          status: pass
        - cmd: "git diff --check"
          status: pass
      design_delta: "Docs now describe T5 as a deterministic mutable-source contract: changed pointers create t1 snapshots linked to t0, t0 remains auditable, t0-derived memory is quarantined as needs_review/changed, reviewed t1 memory re-promotes with the same document_id, and unavailable checks never prove freshness."

  - id: T998
    type: pm
    assignee: PM
