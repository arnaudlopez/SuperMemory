version: 2

goal:
  title: "T13 Enterprise Living Memory Complete"
  slug: "implement-enterprise-living-memory-complete-t13"
  kind: specific
  tranche: "Implement the complete executable Orion enterprise Golden Case."
  status: done
  oracle:
    signal: "A T13 verifier is wired into node scripts/verify-supermemory-specs.mjs and proves the full Orion enterprise Golden Case while T0-T12 remain green."
    cadence: "after each Worker package and at final audit"
    final_proof: "T13 verifier status pass, global specs status pass, git diff --check status pass, GoalBuddy final quality check status pass, commit SHA, pushed branch origin/main, and final audit full_outcome_complete true."
  intake:
    original_request: "enchaine"
    interpreted_outcome: "Continue with T13 enterprise living-memory complete Golden Case."
    input_shape: specific
    audience: "SuperMemory maintainers and future enterprise-memory agents"
    authority: requested
    proof_type: test
    completion_proof: "A T13 fixture/verifier proves the complete Orion Golden Case, global specs pass, and the work is committed and pushed."
    likely_misfire: "Adding runtime integrations or claiming full enterprise readiness without explicit answer evidence, relation chains, agent scope, queues, secret exclusion, port governance, and use-pattern proof."
    blind_spots_considered:
      - "The existing expected target stays as the documented oracle while actual/fixture.json becomes executable."
      - "Every final question needs evidence and a relation chain, not just prose."
      - "Agent scope must include allowed filters/refusals, not only answer text."
      - "Secrets must be absent from recall/drafts and only represented as redacted evidence."
    existing_plan_facts:
      - "docs/golden-case-tdd-matrix.md defines T13.1-T13.7."
      - "docs/golden-case-implementation-roadmap.md lists all mandatory final questions."
      - "identity-vault/90_evals/cases/enterprise-living-memory-complete/expected remains the full target oracle."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  allow_read_only_goal_without_shipping: true
  require_impact_assessment: true
  require_quality_checker: true
  require_github_ship_task: true
  require_tdd_worker_flow: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

goal_policy:
  mode: implementation
  requires_tdd: true
  requires_impact_assessment: true
  requires_shipping: true
  requires_visual_verification: false
  requires_migration_proof: false
  requires_infra_proof: false
  requires_dependency_review: false
  requires_dirty_worktree_guard: true
  requires_refactor_proof: false

workflow_safeguards:
  requires_design_concept: true
  requires_ubiquitous_language: true
  requires_feedback_policy: true
  requires_test_strategy: true
  requires_module_map: true
  requires_interface_contract: true
  requires_architecture_review: true
  requires_design_delta: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: generated
    url: "http://goalbuddy.localhost:41737/implement-enterprise-living-memory-complete-t13/"
    command: "npx --yes goalbuddy board /Users/arnaud/Documents/SuperMemory/docs/goals/implement-enterprise-living-memory-complete-t13"

active_task: null

