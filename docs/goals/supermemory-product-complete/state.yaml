version: 2

goal:
  title: "SuperMemory Product Complete"
  slug: "supermemory-product-complete"
  kind: open_ended
  tranche: "Complete successive safe verified vertical slices until the local-first product outcome is complete."
  status: done
  oracle:
    signal: "A non-technical user completes the real local web workflow on PDF, DOCX, Markdown, and text documents: choose folder, ingest, review, index, search with citations, refresh, delete, restart, and recover persisted state."
    cadence: "after each Worker package and at final audit"
    final_proof: "A recorded end-to-end walkthrough plus automated test and release-gate receipts covering the complete workflow."
  intake:
    original_request: "Finir SuperMemory à 100 % comme un véritable outil."
    interpreted_outcome: "Deliver a production-ready local-first single-user web application that turns a local document folder into reviewed, searchable, cited memory."
    input_shape: vague
    audience: "A non-technical local user"
    authority: approved
    proof_type: demo
    completion_proof: "The complete real-document workflow passes end to end and remains correct after restart, with automated regression and release checks green."
    likely_misfire: "Declare success because backend scripts and unit tests pass while no coherent non-technical web workflow exists."
    blind_spots_considered:
      - "Product surface versus CLI tooling"
      - "Semantic document extraction and memory compilation"
      - "Review and approval UX"
      - "Citations and source traceability"
      - "Incremental refresh, deletion, restart, and recovery"
      - "Security, local privacy, failure handling, and packaging"
    existing_plan_facts:
      - "Preserve the approved local-first architecture and canonical local vault."
      - "Hindsight remains a derived recall projection rather than canonical truth."
      - "Use a real-document end-to-end walkthrough as the completion oracle."
      - "Exclude SaaS, billing, multi-tenancy, and remote connectors from this version."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41738/supermemory-product-complete/"
